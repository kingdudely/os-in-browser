<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Screen Share</title>
	<link rel="stylesheet" href="styles.css">
	<script type="module" src="index.js" defer></script>
</head>
<body>
	<video id="screenshare" autoplay playsinline></video>

	<dialog id="connect-dialog">
		<button id="copy-offer">Copy offer</button>
		<br/>
		<label for="runner-input">Paste runner address from Actions log:</label>
		<br/>
		<input id="runner-input" placeholder="1.2.3.4:12345" />
		<br/>
		<button id="runner-submit">Connect</button>
	</dialog>
</body>
</html>
