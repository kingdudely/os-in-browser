name: nat-filtering-check

on:
  workflow_dispatch:

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - name: Learn mapped endpoint via STUN, then listen for a cold packet
        shell: python
        run: |
          import socket, struct, random, time

          def stun_request(sock, host, port):
              trans_id = bytes(random.getrandbits(8) for _ in range(12))
              magic = 0x2112A442
              msg = struct.pack('!HHI12s', 0x0001, 0, magic, trans_id)
              sock.sendto(msg, (host, port))
              data, _ = sock.recvfrom(2048)
              msg_len = struct.unpack('!H', data[2:4])[0]
              body = data[20:20 + msg_len]
              i = 0
              mapped = None
              while i < len(body):
                  attr_type, attr_len = struct.unpack('!HH', body[i:i + 4])
                  val = body[i + 4:i + 4 + attr_len]
                  if attr_type in (0x0001, 0x0020):
                      port_raw = struct.unpack('!H', val[2:4])[0]
                      addr_raw = val[4:8]
                      if attr_type == 0x0020:
                          port_raw ^= (magic >> 16)
                          magic_bytes = struct.pack('!I', magic)
                          addr = bytes(a ^ b for a, b in zip(addr_raw, magic_bytes))
                      else:
                          addr = addr_raw
                      mapped = (socket.inet_ntoa(addr), port_raw)
                  padding = (4 - (attr_len % 4)) % 4
                  i += 4 + attr_len + padding
              return mapped

          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.bind(("0.0.0.0", 0))
          sock.settimeout(5)

          mapped = stun_request(sock, "stun.l.google.com", 19302)
          ip, port = mapped
          print("=" * 60)
          print(f"SEND YOUR TEST PACKET TO:  {ip}:{port}")
          print("from your own machine, e.g.:")
          print(f"  echo -n 'hello' | nc -u -w1 {ip} {port}")
          print("You have ~120 seconds from NOW.")
          print("=" * 60, flush=True)

          sock.settimeout(120)
          try:
              data, addr = sock.recvfrom(2048)
              print(f"RECEIVED from {addr}: {data!r}")
              print("RESULT: unsolicited inbound UDP got through -- "
                    "filtering is endpoint-independent (full cone). "
                    "Direct WebTransport reachability should work.")
          except socket.timeout:
              print("RESULT: nothing arrived in the window -- "
                    "either restricted-cone filtering (only accepts "
                    "packets from hosts/ports this socket has already "
                    "sent to) or an NSG is blocking cold inbound UDP. "
                    "Direct WebTransport reachability will likely fail; "
                    "plan for a relay/tunnel fallback.")
