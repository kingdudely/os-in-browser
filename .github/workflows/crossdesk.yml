name: Run CrossDesk

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: "Runner OS"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  run-crossdesk:
    runs-on: ${{ github.event.inputs.runner_os }}

    steps:
      - name: Fetch latest CrossDesk release tag
        id: get_release
        shell: bash
        run: |
          TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kunkundi/crossdesk/releases/latest \
            | grep '"tag_name"' | head -1 | sed 's/.*"tag_name": *"\(.*\)".*/\1/')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest CrossDesk release: $TAG"

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: Install CrossDesk (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TAG="${{ steps.get_release.outputs.tag }}"
          # Derive the plain version number from the tag (e.g. v1.3.6-20260529 → 1.3.6-20260529)
          VER="${TAG#v}"
          # The release asset naming convention uses only the semver part before the dash for
          # the file name suffix, e.g. crossdesk-linux-amd64-1.3.6.deb
          SEMVER=$(echo "$VER" | cut -d'-' -f1)
          DEB="crossdesk-linux-amd64-${SEMVER}.deb"
          URL="https://github.com/kunkundi/crossdesk/releases/download/${TAG}/${DEB}"
          echo "Downloading $URL"
          curl -fsSL -o crossdesk.deb "$URL"
          sudo dpkg -i crossdesk.deb

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: Install CrossDesk (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          TAG="${{ steps.get_release.outputs.tag }}"
          VER="${TAG#v}"
          SEMVER=$(echo "$VER" | cut -d'-' -f1)
          DMG="CrossDesk-${SEMVER}.dmg"
          URL="https://github.com/kunkundi/crossdesk/releases/download/${TAG}/${DMG}"
          echo "Downloading $URL"
          curl -fsSL -o CrossDesk.dmg "$URL"
          hdiutil attach CrossDesk.dmg -nobrowse -mountpoint /Volumes/CrossDesk
          cp -R /Volumes/CrossDesk/CrossDesk.app /Applications/
          hdiutil detach /Volumes/CrossDesk

      # ── Windows ────────────────────────────────────────────────────────────
      - name: Install CrossDesk (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag  = "${{ steps.get_release.outputs.tag }}"
          $ver  = $tag.TrimStart('v')
          $semver = $ver.Split('-')[0]
          $exe  = "crossdesk-win-x64-${semver}.exe"
          $url  = "https://github.com/kunkundi/crossdesk/releases/download/${tag}/${exe}"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile crossdesk-setup.exe
          # Silent install — adjust flags if the installer supports different switches
          Start-Process -FilePath .\crossdesk-setup.exe -ArgumentList '/S' -Wait

      # ── Run CrossDesk ──────────────────────────────────────────────────────
      - name: Run CrossDesk (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # CrossDesk is a GUI app; on a headless runner we start it with a
          # virtual display so it can initialise without crashing.
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          crossdesk --version || crossdesk &
          sleep 5
          echo "CrossDesk started on virtual display :99"

      - name: Run CrossDesk (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          open /Applications/CrossDesk.app
          sleep 5
          echo "CrossDesk launched"

      - name: Run CrossDesk (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Adjust the install path if the installer puts it elsewhere
          $candidates = @(
            "$env:ProgramFiles\CrossDesk\CrossDesk.exe",
            "$env:LOCALAPPDATA\CrossDesk\CrossDesk.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            # Fallback: portable exe downloaded earlier
            $exe = "crossdesk-setup.exe"
          }
          Write-Host "Starting $exe"
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 5
          Write-Host "CrossDesk launched"