name: macOS Browser Remote Desktop

on:
  workflow_dispatch:
    inputs:
      vnc_user_password:
        description: 'VNC user password'
        required: true
      vnc_password:
        description: 'VNC password (max 8 chars)'
        required: true

jobs:
  remote-desktop:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Create VNC user & enable Apple VNC
        run: |
          if ! id -u vncuser &>/dev/null; then
            sudo dscl . -create /Users/vncuser
            sudo dscl . -create /Users/vncuser UserShell /bin/bash
            sudo dscl . -create /Users/vncuser RealName "VNC User"
            sudo dscl . -create /Users/vncuser UniqueID 1001
            sudo dscl . -create /Users/vncuser PrimaryGroupID 80
            sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
            sudo createhomedir -c -u vncuser &>/dev/null
          fi
          sudo dscl . -passwd /Users/vncuser "${{ inputs.vnc_user_password }}"

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes

          printf '%s\n' "${{ inputs.vnc_password }}" \
          | perl -we '
            BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA" }
            $_ = <>; chomp; s/^(.{8}).*/$1/;
            @p = unpack "C*", $_;
            foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }
            print "\n";
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt &>/dev/null

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent -console
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate

      - name: Start Guacamole
        run: |
          git clone https://github.com/novnc/noVNC
          nohup ./noVNC/utils/novnc_proxy \
            --vnc "localhost:5900" \
            --listen 6901 &

      - name: Establish tunnel
        id: tunnel
        uses: anyvm-org/cf-tunnel@v0
        with:
          protocol: http
          port: 6901

      - name: Print access details
        run: |
          echo "  Open : https://${{ steps.tunnel.outputs.server }}/vnc.html"

      - name: Keep alive
        run: sleep 21600