name: macOS Browser Remote Desktop

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'VNC password (max 8 chars)'
        required: true

jobs:
  remote-desktop:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Enable Apple VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes

          printf '%s\n' "${{ inputs.vnc_password }}" \
          | perl -we '
            BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA" }
            $_ = <>; chomp; s/^(.{8}).*/$1/;
            @p = unpack "C*", $_;
            foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }
            print "\n";
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent -console
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate

      - name: Start novnc-webrtc
        run: |
          curl -L https://github.com/ngxson/novnc-webrtc/releases/latest/download/novnc-webrtc-macos-arm64 \
            -o novnc-webrtc
          chmod +x novnc-webrtc
          ./novnc-webrtc --listen "0.0.0.0:6901" --upstream "127.0.0.1:5900" &
          sleep 2

      - name: Establish tunnel
        id: tunnel
        uses: anyvm-org/cf-tunnel@v0
        with:
          protocol: http
          port: 6901

      - name: Print access details
        run: |
          echo "Open: https://${{ steps.tunnel.outputs.server }}"
          echo "Password: your VNC password"

      - name: Keep alive
        run: sleep 21600