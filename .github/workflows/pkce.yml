name: Deploy Pages Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Write index.html
        run: |
          mkdir -p _site
          cat > _site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>os-in-browser launcher</title>
          <style>
            body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; background:#0d1117; color:#c9d1d9; }
            button { background:#238636; color:#fff; border:none; padding:10px 18px; border-radius:6px; font-size:15px; cursor:pointer; }
            button:disabled { background:#30363d; cursor:not-allowed; }
            pre { background:#161b22; padding:12px; border-radius:6px; overflow-x:auto; white-space:pre-wrap; }
            a { color:#58a6ff; }
          </style>
          </head>
          <body>
          <h2>os-in-browser launcher</h2>
          <div id="app">
            <button id="loginBtn">Sign in with GitHub</button>
          </div>
          <pre id="log"></pre>

          <script>
          // ---- CONFIG: fill these in ----
          const CLIENT_ID = "REPLACE_WITH_YOUR_GITHUB_APP_CLIENT_ID";
          const REDIRECT_URI = window.location.origin + window.location.pathname;
          const TEMPLATE_OWNER = "kingdudely";
          const TEMPLATE_REPO = "os-in-browser";
          const WORKFLOW_FILE = "session.yml"; // workflow filename inside the generated repo
          // --------------------------------

          const log = (msg) => {
            document.getElementById("log").textContent += msg + "\n";
          };

          function base64url(buf) {
            return btoa(String.fromCharCode(...new Uint8Array(buf)))
              .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
          }

          async function sha256(str) {
            const data = new TextEncoder().encode(str);
            return await crypto.subtle.digest("SHA-256", data);
          }

          function randomString(len = 64) {
            const arr = new Uint8Array(len);
            crypto.getRandomValues(arr);
            return base64url(arr.buffer);
          }

          async function startLogin() {
            const verifier = randomString(64);
            sessionStorage.setItem("pkce_verifier", verifier);
            const challenge = base64url(await sha256(verifier));

            const params = new URLSearchParams({
              client_id: CLIENT_ID,
              redirect_uri: REDIRECT_URI,
              scope: "repo workflow",
              code_challenge: challenge,
              code_challenge_method: "S256",
              state: randomString(16)
            });
            sessionStorage.setItem("oauth_state", params.get("state"));
            window.location = "https://github.com/login/oauth/authorize?" + params.toString();
          }

          async function exchangeCodeForToken(code) {
            const verifier = sessionStorage.getItem("pkce_verifier");
            const res = await fetch("https://github.com/login/oauth/access_token", {
              method: "POST",
              headers: { "Accept": "application/json", "Content-Type": "application/json" },
              body: JSON.stringify({
                client_id: CLIENT_ID,
                code: code,
                redirect_uri: REDIRECT_URI,
                code_verifier: verifier
              })
            });
            if (!res.ok) throw new Error("token exchange failed: " + res.status);
            const data = await res.json();
            if (data.error) throw new Error(data.error_description || data.error);
            return data.access_token;
          }

          async function gh(path, token, opts = {}) {
            const res = await fetch("https://api.github.com" + path, {
              ...opts,
              headers: {
                "Authorization": "Bearer " + token,
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
                ...(opts.headers || {})
              }
            });
            return res;
          }

          async function runFlow(token) {
            log("Fetching your GitHub user...");
            const userRes = await gh("/user", token);
            const user = await userRes.json();
            log("Logged in as " + user.login);

            const sessionId = randomString(6).toLowerCase().replace(/[^a-z0-9]/g, "");
            const newRepoName = "os-in-browser-session-" + sessionId;

            log("Generating repo from template: " + newRepoName);
            const genRes = await gh(`/repos/${TEMPLATE_OWNER}/${TEMPLATE_REPO}/generate`, token, {
              method: "POST",
              body: JSON.stringify({
                owner: user.login,
                name: newRepoName,
                include_all_branches: false,
                private: false
              })
            });
            if (genRes.status !== 201) {
              const err = await genRes.text();
              throw new Error("generate failed: " + genRes.status + " " + err);
            }
            const repo = await genRes.json();
            log("Repo created: " + repo.html_url);

            // give GitHub a moment to finish provisioning the repo/workflows
            await new Promise(r => setTimeout(r, 4000));

            log("Dispatching workflow: " + WORKFLOW_FILE);
            const dispatchRes = await gh(
              `/repos/${user.login}/${newRepoName}/actions/workflows/${WORKFLOW_FILE}/dispatches`,
              token,
              { method: "POST", body: JSON.stringify({ ref: repo.default_branch || "main" }) }
            );
            if (dispatchRes.status !== 204) {
              const err = await dispatchRes.text();
              throw new Error("dispatch failed: " + dispatchRes.status + " " + err);
            }
            log("Workflow dispatched. Checking run status...");

            await new Promise(r => setTimeout(r, 3000));
            const runsRes = await gh(
              `/repos/${user.login}/${newRepoName}/actions/runs?event=workflow_dispatch`,
              token
            );
            const runs = await runsRes.json();
            if (runs.workflow_runs && runs.workflow_runs.length) {
              const run = runs.workflow_runs[0];
              log("Run started: " + run.html_url);
              document.getElementById("app").innerHTML =
                `<p>Session repo: <a href="${repo.html_url}" target="_blank">${repo.html_url}</a></p>
                 <p>Run: <a href="${run.html_url}" target="_blank">${run.html_url}</a></p>`;
            } else {
              log("No run found yet — check the Actions tab on the new repo directly.");
            }
          }

          async function init() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code");
            const state = params.get("state");

            if (code) {
              // clean the URL so refresh doesn't re-trigger exchange
              window.history.replaceState({}, document.title, REDIRECT_URI);
              if (state !== sessionStorage.getItem("oauth_state")) {
                log("State mismatch — aborting.");
                return;
              }
              document.getElementById("app").innerHTML = "<p>Signing in...</p>";
              try {
                const token = await exchangeCodeForToken(code);
                sessionStorage.setItem("gh_token", token);
                await runFlow(token);
              } catch (e) {
                log("Error: " + e.message);
              }
              return;
            }

            const existingToken = sessionStorage.getItem("gh_token");
            if (existingToken) {
              document.getElementById("app").innerHTML = "<p>Already signed in. Running...</p>";
              try {
                await runFlow(existingToken);
              } catch (e) {
                log("Error: " + e.message);
              }
              return;
            }

            document.getElementById("loginBtn").addEventListener("click", startLogin);
          }

          init();
          </script>
          </body>
          </html>
          HTMLEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4