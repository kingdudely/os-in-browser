name: macos webrtc-rdp

on:
  workflow_dispatch:

jobs:
  remote-desktop:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone webrtc-rdp
        run: |
          git clone https://github.com/binzume/webrtc-rdp.git
          cd webrtc-rdp/app
          npm install
          npx electron-rebuild

      - name: Start webrtc-rdp app
        run: |
          cd webrtc-rdp/app
          npm start > ../webrtc-rdp.log 2>&1 &
          echo $! > ../webrtc-rdp.pid

      - name: Open browser client
        run: |
          open "https://binzume.github.io/webrtc-rdp/"

      - name: Keep job alive
        run: sleep 3600

      - name: Stop app
        if: always()
        run: |
          if [ -f webrtc-rdp/webrtc-rdp.pid ]; then
            kill "$(cat webrtc-rdp/webrtc-rdp.pid)" || true
          fi