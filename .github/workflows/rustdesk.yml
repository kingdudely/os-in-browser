name: Install & Run RustDesk (Docker)

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  rustdesk:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@master

      - name: Start RustDesk
        run: |
          cat > compose.yml <<'EOF'
          services:
            hbbs:
              container_name: hbbs
              image: rustdesk/rustdesk-server:latest
              command: hbbs
              volumes:
                - ./data:/root
              ports:
                - "21115:21115"
                - "21116:21116"
                - "21116:21116/udp"
                - "21118:21118"
              depends_on:
                - hbbr
              restart: unless-stopped
            hbbr:
              container_name: hbbr
              image: rustdesk/rustdesk-server:latest
              command: hbbr
              volumes:
                - ./data:/root
              ports:
                - "21117:21117"
                - "21119:21119"
              restart: unless-stopped
          EOF
          docker compose up -d
          sleep 5
          docker logs hbbs 2>&1 | grep -i key
        shell: bash