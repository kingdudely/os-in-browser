name: Install & Run RustDesk

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating System'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  rustdesk:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Get latest RustDesk version
        id: version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install & Run (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libgtk-3-0 \
            libxcb-randr0 \
            libxdo3 \
            libxfixes3 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libasound2 \
            xvfb \
            xfce4 \
            xfce4-goodies \
            dbus-x11

          wget -q "https://github.com/rustdesk/rustdesk/releases/download/${{ steps.version.outputs.version }}/rustdesk-${{ steps.version.outputs.version }}-x86_64.deb"
          sudo dpkg -i rustdesk-*.deb || sudo apt-get install -fy

          PIPE=$(mktemp -u)
          mkfifo "$PIPE"
          Xvfb -displayfd 3 -screen 0 1920x1080x24 3>"$PIPE" &
          export DISPLAY=:$(head -1 "$PIPE")
          rm "$PIPE"

          rustdesk --service &
          sleep 3
          rustdesk --get-id

      - name: Install & Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/$ver/rustdesk-$ver-x86_64.exe" -OutFile rustdesk.exe
          Start-Process -FilePath rustdesk.exe -ArgumentList '--silent-install' -Wait
          Start-Process -FilePath "$env:ProgramFiles\RustDesk\rustdesk.exe" -ArgumentList '--service'
          Start-Sleep 3
          & "$env:ProgramFiles\RustDesk\rustdesk.exe" --get-id

      - name: Install & Run (macOS)
        if: runner.os == 'macOS'
        run: |
          wget -q "https://github.com/rustdesk/rustdesk/releases/download/${{ steps.version.outputs.version }}/rustdesk-${{ steps.version.outputs.version }}-x86_64.dmg"
          hdiutil attach rustdesk-*.dmg -quiet
          cp -r /Volumes/RustDesk/RustDesk.app /Applications/
          hdiutil detach /Volumes/RustDesk -quiet
          /Applications/RustDesk.app/Contents/MacOS/rustdesk --service &
          sleep 3
          /Applications/RustDesk.app/Contents/MacOS/rustdesk --get-id