name: Install & Run RustDesk (Docker)

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  rustdesk:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@master

      - name: Start RustDesk
        shell: bash
        run: |
          docker run -d --name hbbr \
            -p 21117:21117 -p 21119:21119 \
            -v ./data:/root \
            --restart unless-stopped \
            rustdesk/rustdesk-server:latest hbbr

          docker run -d --name hbbs \
            -p 21115:21115 -p 21116:21116 -p 21116:21116/udp -p 21118:21118 \
            -v ./data:/root \
            --restart unless-stopped \
            rustdesk/rustdesk-server:latest hbbs

          sleep 5
          docker logs hbbs 2>&1 | grep -i key
          sleep infinity