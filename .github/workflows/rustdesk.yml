name: Install & Run RustDesk

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating System'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  rustdesk:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Get latest RustDesk version
        id: rustdesk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(gh release view --repo rustdesk/rustdesk --json tagName -q '.tagName')
          echo "download_prefix_path=https://github.com/rustdesk/rustdesk/releases/download/${VERSION}/rustdesk-${VERSION}-x86_64" >> $GITHUB_OUTPUT

      - name: Install & Run (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            xvfb \
            xfce4 \
            xfce4-goodies \
            dbus-x11

          wget -qO rustdesk.deb "${{ steps.rustdesk.outputs.download_prefix_path }}.deb"
          sudo apt install -fy ./rustdesk.deb

          PIPE=$(mktemp -u)
          mkfifo "$PIPE"
          Xvfb -displayfd 3 -screen 0 1920x1080x24 3>"$PIPE" &
          export DISPLAY=:$(head -1 "$PIPE")
          rm "$PIPE"

          rustdesk --service &
          sleep 3
          rustdesk --get-id
          sleep infinity

      - name: Install & Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ steps.rustdesk.outputs.download_prefix_path }}.exe" -OutFile rustdesk.exe
          Start-Process -FilePath rustdesk.exe -ArgumentList '--silent-install' -Wait
          Start-Process -FilePath "$env:ProgramFiles\RustDesk\rustdesk.exe" -ArgumentList '--service'
          Start-Sleep 3
          & "$env:ProgramFiles\RustDesk\rustdesk.exe" --get-id
          Wait-Event

      - name: Install & Run (macOS)
        if: runner.os == 'macOS'
        run: |
          wget -qO rustdesk.dmg "${{ steps.rustdesk.outputs.download_prefix_path }}.dmg"
          hdiutil attach rustdesk.dmg -quiet
          cp -r /Volumes/RustDesk/RustDesk.app /Applications/
          hdiutil detach /Volumes/RustDesk -quiet
          /Applications/RustDesk.app/Contents/MacOS/rustdesk --service &
          sleep 3
          /Applications/RustDesk.app/Contents/MacOS/rustdesk --get-id
          caffeinate