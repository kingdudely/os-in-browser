name: Open Public Port via STUN + Cloudflare Signaling

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runner OS"
        required: true
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        default: ubuntu-latest
      quic_port:
        description: "Local UDP port for the HTTP/3 server"
        required: false
        default: "45000"
      signaling_port:
        description: "Local TCP port for the signaling server (tunneled)"
        required: false
        default: "8080"
      duration_seconds:
        description: "How long to keep everything open (seconds)"
        required: false
        default: "1800"

jobs:
  open-port:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python deps
        run: pip install aioquic aiohttp cryptography

      - name: Start runner bridge
        run: |
          python3 runner_bridge.py \
            --quic-port ${{ inputs.quic_port }} \
            --signaling-port ${{ inputs.signaling_port }} \
            --duration ${{ inputs.duration_seconds }} &

      - name: Establish tunnel
        id: tunnel
        uses: anyvm-org/cf-tunnel@v0
        with:
          protocol: http
          port: 8080

      - name: Hold job open for the test window
        run: |
          echo "Tunnel URL: https://${{ steps.tunnel.outputs.server }}"
          sleep ${{ inputs.duration_seconds }}
        shell: bash