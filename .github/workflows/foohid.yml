name: Test Karabiner-DriverKit-VirtualHIDDevice

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    
    steps:
      - name: Download Karabiner-DriverKit-VirtualHIDDevice package
        run: |
          curl -L -o karabiner-vhid.pkg https://github.com/pqrs-org/Karabiner-DriverKit-VirtualHIDDevice/releases/download/v7.3.0/Karabiner-DriverKit-VirtualHIDDevice-7.3.0.pkg
          ls -lh karabiner-vhid.pkg
          
      - name: Install package
        run: |
          sudo installer -pkg karabiner-vhid.pkg -target /
          
      - name: Verify installation
        run: |
          ls -la /Library/DriverKit/ || echo "DriverKit dir not found"
          kextstat | grep -i karabiner || echo "Karabiner kext not loaded (expected on macos-latest)"
          
      - name: Check for virtual HID device service
        run: |
          which virtual-hid-device-service-client || echo "Client not in PATH"
          find /Library -name "*virtual-hid*" 2>/dev/null | head -10