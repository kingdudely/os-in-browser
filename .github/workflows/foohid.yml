name: Test VirtHID-macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout VirtHID-macOS
        run: |
          git clone https://github.com/kotleni/VirtHID-macOS.git
          cd VirtHID-macOS
          
      - name: Build VirtHID with xcodebuild
        run: |
          cd VirtHID-macOS
          xcodebuild -scheme VirtHID -configuration Release 2>&1 | head -50
          
      - name: Check build output
        run: |
          cd VirtHID-macOS
          find . -name "*.kext" -o -name "*.app" | head -20