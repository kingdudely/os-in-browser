name: Test IOHIDUserDevice

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Write test program
        run: |
          cat > main.mm << 'EOF'
          #import <Foundation/Foundation.h>
          #import <IOKit/IOKitLib.h>
          #import <IOKit/hid/IOHIDManager.h>
          #import <IOKit/hid/IOHIDUserDevice.h>

          int main(int argc, const char * argv[]) {
              @autoreleasepool {
                  printf("Testing IOHIDUserDevice virtual HID creation...\n");

                  uint8_t reportDescriptor[] = {
                      0x05, 0x01,
                      0x09, 0x02,
                      0xA1, 0x01,
                      0x09, 0x01,
                      0xA1, 0x00,
                      0x05, 0x09,
                      0x19, 0x01,
                      0x29, 0x03,
                      0x15, 0x00,
                      0x25, 0x01,
                      0x95, 0x03,
                      0x75, 0x01,
                      0x81, 0x02,
                      0x95, 0x01,
                      0x75, 0x05,
                      0x81, 0x03,
                      0x05, 0x01,
                      0x09, 0x30,
                      0x09, 0x31,
                      0x15, 0x81,
                      0x25, 0x7F,
                      0x75, 0x08,
                      0x95, 0x02,
                      0x81, 0x06,
                      0xC0,
                      0xC0
                  };

                  CFDataRef descriptorData = CFDataCreate(kCFAllocatorDefault, reportDescriptor, sizeof(reportDescriptor));

                  NSDictionary *properties = @{
                      (NSString *)CFSTR(kIOHIDReportDescriptorKey): (__bridge NSData *)descriptorData,
                      (NSString *)CFSTR(kIOHIDVendorIDKey): @(0x1234),
                      (NSString *)CFSTR(kIOHIDProductIDKey): @(0x5678),
                      (NSString *)CFSTR(kIOHIDProductKey): @"OxiRemote Virtual Mouse",
                      (NSString *)CFSTR(kIOHIDPhysicalDeviceUniqueIDKey): @"oxiremote-test-mouse-001"
                  };

                  IOHIDUserDeviceRef device = IOHIDUserDeviceCreate(kCFAllocatorDefault, (__bridge CFDictionaryRef)properties);

                  if (device == NULL) {
                      printf("FAILED: IOHIDUserDeviceCreate returned NULL\n");
                      printf("This likely means entitlements or permissions are missing.\n");
                      CFRelease(descriptorData);
                      return 1;
                  }

                  printf("SUCCESS: IOHIDUserDevice created: %p\n", (void *)device);

                  uint8_t report[3] = {0x00, 0x05, 0x00}; // no buttons, x+5, y=0
                  IOReturn result = IOHIDUserDeviceHandleReport(device, report, sizeof(report));

                  if (result == kIOReturnSuccess) {
                      printf("SUCCESS: report sent, IOReturn = 0x%x\n", result);
                  } else {
                      printf("WARNING: report send failed, IOReturn = 0x%x\n", result);
                  }

                  printf("Sleeping 2s to let device register...\n");
                  [NSThread sleepForTimeInterval:2.0];

                  CFRelease(device);
                  CFRelease(descriptorData);

                  printf("Done.\n");
                  return 0;
              }
          }
          EOF

      - name: Compile
        run: |
          clang++ -O2 -std=c++17 -fobjc-arc main.mm -o hidtest \
            -framework Foundation \
            -framework IOKit

      - name: Run test (no sudo)
        id: no_sudo
        continue-on-error: true
        run: ./hidtest

      - name: Run test (with sudo)
        if: steps.no_sudo.outcome == 'failure'
        run: sudo ./hidtest

      - name: Check for virtual device in IORegistry
        run: |
          ioreg -p IOService -c IOHIDUserDevice -l | grep -A 5 "OxiRemote" || echo "Device not found in IORegistry"