name: Test IOHIDUserDevice

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install VA-API packages
        run: sudo apt-get install -y libva-dev vainfo intel-media-va-driver i965-va-driver

      - name: Check VA-API status
        run: vainfo
        continue-on-error: true