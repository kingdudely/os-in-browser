name: Test foohid

on:
  push:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout foohid
        uses: actions/checkout@v4
        with:
          repository: unbit/foohid
      
      - name: Build foohid kext
        run: |
          xcodebuild \
            -project foohid.xcodeproj \
            -scheme foohid \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | tail -100
      
      - name: Find and load kext
        run: |
          KEXT=$(find build -name "foohid.kext" -type d)
          if [ -z "$KEXT" ]; then
            echo "::error::No kext found"
            exit 1
          fi
          
          echo "Fixing ownership for $KEXT"
          sudo chown -R root:wheel "$KEXT"
          
          # Bypass notarization check with disable-modules flag
          echo "Loading $KEXT"
          sudo kmutil load -p "$KEXT" --bypass-signatures
      
      - name: Verify loaded
        run: |
          sudo kextstat | grep -i foohid || {
            echo "::error::foohid kext not loaded"
            exit 1
          }
      
      - name: Test virtual mouse
        run: |
          git clone https://github.com/unbit/foohid-py.git
          cd foohid-py
          pip3 install -e .
          # Just import to verify driver is accessible
          python3 -c "import foohid; print('foohid Python module imported successfully')"