name: Test foohid

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    
    steps:
      - name: Install foohid kernel extension
        run: |
          brew install unbit/foohid/foohid
      
      - name: Check if foohid kernel extension is loaded
        run: |
          echo "Checking for foohid kernel extension..."
          kextstat | grep -i foohid || echo "foohid not loaded"
          
      - name: Check /Library/Extensions for foohid
        run: |
          echo "Checking /Library/Extensions..."
          ls -la /Library/Extensions/ | grep -i foohid || echo "foohid not found in /Library/Extensions"
          
      - name: Check /System/Library/Extensions for foohid
        run: |
          echo "Checking /System/Library/Extensions..."
          ls -la /System/Library/Extensions/ 2>/dev/null | grep -i foohid || echo "foohid not found in /System/Library/Extensions"