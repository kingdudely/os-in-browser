name: Test VirtHID-macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout VirtHID-macOS
        uses: actions/checkout@v4
        with:
          repository: kotleni/VirtHID-macOS
      
      - name: Build VirtHID
        run: |
          xcodebuild \
            -scheme VirtHID \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | tail -100
      
      - name: Find and load kext
        run: |
          KEXT=$(find build -name "VirtHID.kext" -type d)
          if [ -z "$KEXT" ]; then
            echo "::error::No kext found"
            exit 1
          fi
          
          echo "Loading $KEXT"
          sudo kextload "$KEXT"
      
      - name: Verify loaded
        run: sudo kextstat | grep -i virthid