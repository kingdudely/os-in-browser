name: Test VirtHID-macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout VirtHID-macOS
        run: |
          git clone https://github.com/kotleni/VirtHID-macOS.git
          
      - name: Build VirtHID with xcodebuild
        run: |
          cd VirtHID-macOS
          xcodebuild -scheme VirtHID -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO 2>&1 | tail -100
          
      - name: Check build output
        run: |
          cd VirtHID-macOS
          find . -name "*.kext" -o -name "*.app" | head -20
          
      - name: Load the kext
        run: |
          cd VirtHID-macOS
          KEXT=$(find . -name "*.kext" | head -1)
          if [ -n "$KEXT" ]; then
            echo "Found kext: $KEXT"
            sudo chown -R root:wheel "$KEXT"
            sudo kextload "$KEXT"
          else
            echo "No kext found!"
            exit 1
          fi
          
      - name: Verify kext loaded
        run: |
          kextstat | grep -i virthid || echo "VirtHID kext not in kextstat"
          sudo kextstat | grep -i virthid || echo "VirtHID kext not loaded"