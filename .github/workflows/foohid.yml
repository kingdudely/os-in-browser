name: Test VirtHID-macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout VirtHID-macOS
        uses: actions/checkout@v4
        with:
          repository: kotleni/VirtHID-macOS
      
      - name: Build VirtHID
        run: |
          xcodebuild \
            -scheme VirtHID \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | tail -100
      
      - name: Fix kext version in plist
        run: |
          KEXT=$(find build -name "VirtHID.kext" -type d)
          PLIST="$KEXT/Contents/Info.plist"
          
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/-.*$//')
          
          echo "Original version: $VERSION"
          echo "Cleaned version: $CLEAN_VERSION"
          
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $CLEAN_VERSION" "$PLIST"
      
      - name: Fix kext ownership and load
        run: |
          KEXT=$(find build -name "VirtHID.kext" -type d)
          echo "Fixing ownership for $KEXT"
          sudo chown -R root:wheel "$KEXT"
          
          echo "Loading $KEXT"
          sudo kextload "$KEXT"
      
      - name: Verify loaded
        run: sudo kextstat | grep -i virthid