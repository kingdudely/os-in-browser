name: IOHIDUserDevice relative-mouse probe

# Checks whether IOHIDUserDeviceCreate can stand up a relative-motion-only
# HID mouse device and accept reports on a GitHub-hosted macos-latest
# runner, run with elevated privileges, with SIP off / AMFI on.
#
# READ BEFORE TRUSTING THE RESULT:
#   - GitHub-hosted macos-latest runners have SIP disabled (confirmed via
#     `csrutil status` in a prior run) but do NOT have any TCC grants
#     pre-approved, and headless CI can't click through a TCC prompt.
#     `sudo` alone does not satisfy a TCC check.
#   - TCC's system database is itself SIP-protected. With SIP disabled we
#     CAN write directly into it, which is what this workflow does — but
#     the write has to be keyed to the exact code-signing identity of the
#     binary (its `csreq` requirement), so we self-sign with a STABLE
#     identity first so the requirement doesn't change between builds.
#   - Apple does not publicly document exactly which TCC service(s) gate
#     IOHIDUserDeviceCreate / IOHIDResource. This workflow does NOT assume
#     one is correct — it seeds grants for every plausible candidate
#     (kTCCServiceListenEvent, kTCCServicePostEvent, kTCCServiceAccessibility)
#     and then tells you, from the actual PASS/FAIL result, whether seeding
#     TCC was sufficient at all, on this macOS version. If it still fails
#     after seeding, the gate is probably something other than TCC (e.g. a
#     private entitlement check), and that's useful information too.
#   - This is inherently an experiment, not a known-good recipe. Treat the
#     job summary as the actual answer for your runner's exact OS build.

on:
  workflow_dispatch:
  push:
    paths:
      - 'iohid_relmouse_test.c'
      - 'IOHIDUserDevice.h'
      - '.github/workflows/iohid-relmouse-probe.yml'

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show OS / SIP / AMFI state (informational)
        run: |
          sw_vers
          echo "---- csrutil status ----"
          csrutil status || true
          echo "---- amfi nvram override check ----"
          nvram -p 2>/dev/null | grep -i amfi || echo "no amfi nvram override present"

      - name: Compile probe
        run: |
          # IOHIDUserDevice.h is not reliably shipped as a public framework
          # header in current SDKs, so we vendor Apple's APSL-licensed
          # header (IOHIDUserDevice.h, alongside this file).
          xcrun clang -Wall -Wextra -O2 \
            -I . \
            -framework CoreFoundation \
            -framework IOKit \
            -o iohid_relmouse_test \
            iohid_relmouse_test.c

      - name: Create a stable self-signed codesign identity
        run: |
          # An ad-hoc signature (`codesign -s -`) hashes per-build and can't
          # be targeted by a TCC.db row ahead of time. A real (even
          # self-signed) identity keeps a stable designated requirement, so
          # we mint one in a throwaway keychain, scoped to this job only.
          KEYCHAIN=probe.keychain
          KEYCHAIN_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          CERT_NAME="IOHIDProbeCodesign"
          cat > cert.conf <<EOF
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = ${CERT_NAME}
          [ext]
          basicConstraints=critical,CA:false
          keyUsage=critical,digitalSignature
          extendedKeyUsage=critical,codeSigning
          EOF

          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem \
            -days 1 -nodes -config cert.conf
          openssl pkcs12 -export -out cert.p12 -inkey key.pem -in cert.pem \
            -passout pass:"$KEYCHAIN_PW"

          security import cert.p12 -k "$KEYCHAIN" -P "$KEYCHAIN_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "CERT_NAME=${CERT_NAME}" >> "$GITHUB_ENV"
          echo "PROBE_KEYCHAIN=${KEYCHAIN}" >> "$GITHUB_ENV"

      - name: Sign the probe binary with the stable identity
        run: |
          codesign -s "$CERT_NAME" --force --timestamp=none iohid_relmouse_test
          codesign -dv iohid_relmouse_test
          echo "---- designated requirement ----"
          codesign -d -r- iohid_relmouse_test

      - name: Seed candidate TCC grants for the signed binary
        run: |
          set -x
          BIN_PATH="$(pwd)/iohid_relmouse_test"
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"

          echo "---- designated requirement (informational) ----"
          codesign -d -r- --requirements - "$BIN_PATH" 2>&1 | sed -n 's/^designated => //p'

          # We can't easily hand-roll the exact binary csreq blob TCC
          # expects from bash; instead use a raw INSERT with auth_value=2
          # (allowed) and csreq=NULL, which several TCC bypass write-ups
          # (CVE-2020-9934-era tooling) rely on when SIP is off and the
          # row is matched primarily by path/identifier rather than a
          # verified csreq. This works on some macOS versions and not
          # others -- that's part of what this job is testing.
          CLIENT_ID="$BIN_PATH"

          for SERVICE in kTCCServiceListenEvent kTCCServicePostEvent kTCCServiceAccessibility; do
            sudo sqlite3 "$TCC_DB" "
              INSERT OR REPLACE INTO access
                (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier)
              VALUES
                ('${SERVICE}', '${CLIENT_ID}', 1, 2, 3, 1, 'UNUSED');
            " || echo "insert for ${SERVICE} failed (schema may differ on this macOS version)"
          done

          echo "---- resulting rows ----"
          sudo sqlite3 "$TCC_DB" "SELECT service, client, auth_value FROM access WHERE client LIKE '%iohid_relmouse_test%';" || true

          echo "Restarting tccd to pick up the change"
          sudo launchctl kickstart -k system/com.apple.tccd 2>/dev/null || \
            sudo killall tccd 2>/dev/null || true
          sleep 2

      - name: Run probe (unprivileged, signed + TCC-seeded)
        id: unpriv
        continue-on-error: true
        run: ./iohid_relmouse_test

      - name: Run probe (sudo, signed + TCC-seeded)
        id: priv
        continue-on-error: true
        run: sudo ./iohid_relmouse_test

      - name: Clean up throwaway keychain
        if: always()
        run: |
          security delete-keychain "$PROBE_KEYCHAIN" 2>/dev/null || true

      - name: Summarize
        run: |
          echo "Unprivileged run outcome: ${{ steps.unpriv.outcome }}"
          echo "sudo run outcome:         ${{ steps.priv.outcome }}"
          if [ "${{ steps.priv.outcome }}" = "success" ] || [ "${{ steps.unpriv.outcome }}" = "success" ]; then
            echo "RESULT: seeding TCC (client_type=1 path-based row, auth_value=2)"
            echo "for kTCCServiceListenEvent/PostEvent/Accessibility was SUFFICIENT"
            echo "on this macOS build to unblock IOHIDUserDeviceCreate."
          else
            echo "RESULT: still failing after signing + TCC seeding. Likely causes:"
            echo "  1. TCC on this macOS build validates the stored csreq blob"
            echo "     strictly and rejects a NULL/placeholder csreq row (our"
            echo "     INSERT above doesn't compute a real binary csreq blob)."
            echo "  2. IOHIDUserDeviceCreate is gated by something other than"
            echo "     the TCC services we guessed (a private entitlement, or"
            echo "     a newer 'protectedDeviceAccess'-style check, as seen in"
            echo "     the macOS 26.4 DriverKit HID reports)."
            echo "  3. The runner's csrutil enabled-flags don't cover the exact"
            echo "     protection bit IOHIDResource checks even though the"
            echo "     top-line SIP status reads 'disabled'."
            echo "This is the actual, verified answer for this OS build -- not"
            echo "a guess -- but it means TCC-seeding alone isn't the fix here."
            exit 1
          fi