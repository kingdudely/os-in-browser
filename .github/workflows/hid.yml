name: IOHIDUserDevice relative-mouse probe

# Checks whether IOHIDUserDeviceCreate can stand up a relative-motion-only
# HID mouse device and accept reports on a GitHub-hosted macos-latest
# runner, run with elevated privileges.
#
# NOTE (read before trusting the result):
#   - GitHub-hosted macos-latest runners do NOT have SIP disabled and do
#     NOT have every TCC/Input-Monitoring permission pre-granted, and you
#     cannot interactively click through a TCC prompt in headless CI.
#     `sudo` does not bypass Input Monitoring/TCC checks for HID.
#   - AMFI is enabled in this scenario, which is irrelevant to
#     IOHIDUserDeviceCreate anyway (no kext/DriverKit ext is being loaded
#     here, so AMFI's kext/binary policy doesn't gate this call).
#   - So: a FAIL on the hosted runner likely reflects the runner's TCC
#     state, not a defect in the approach. Treat this workflow as a
#     build-and-smoke-test harness, and treat the PASS/FAIL log as
#     informative rather than authoritative — the real signal comes from
#     running the same binary on a machine where you've actually granted
#     Input Monitoring / disabled SIP yourself.

on:
  workflow_dispatch:
  push:
    paths:
      - 'iohid_relmouse_test.c'
      - '.github/workflows/iohid-relmouse-probe.yml'

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show OS / SIP / AMFI state (informational)
        run: |
          sw_vers
          echo "---- csrutil status ----"
          csrutil status || true
          echo "---- codesign AMFI-related sanity check ----"
          # There's no simple 'amfi status' CLI; csrutil status folds AMFI
          # state into SIP reporting on most macOS versions.
          nvram -p 2>/dev/null | grep -i amfi || echo "no amfi nvram override present"

      - name: Compile probe
        run: |
          clang -Wall -Wextra -O2 \
            -framework CoreFoundation \
            -framework IOKit \
            -o iohid_relmouse_test \
            iohid_relmouse_test.c

      - name: Run probe (unprivileged)
        id: unpriv
        continue-on-error: true
        run: ./iohid_relmouse_test

      - name: Run probe (sudo)
        id: priv
        continue-on-error: true
        run: sudo ./iohid_relmouse_test

      - name: Summarize
        run: |
          echo "Unprivileged run outcome: ${{ steps.unpriv.outcome }}"
          echo "sudo run outcome:         ${{ steps.priv.outcome }}"
          if [ "${{ steps.priv.outcome }}" != "success" ] && [ "${{ steps.unpriv.outcome }}" != "success" ]; then
            echo "Neither run succeeded on this hosted runner. This is expected"
            echo "if Input Monitoring / TCC hasn't been granted to the process —"
            echo "sudo alone does not grant it. See workflow header notes."
            exit 1
          fi