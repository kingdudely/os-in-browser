name: Remote Desktop
on:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        description: Runner OS
        default: ubuntu-latest
        options: [ubuntu-latest, macos-latest, windows-latest]

jobs:
  stream:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360
    steps:
      - name: Linux – virtual display + audio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox pulseaudio libx11-dev libxext-dev
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          openbox &
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=vout
          pactl set-default-sink vout
          pactl load-module module-loopback latency_msec=1

      - name: macOS – virtual audio
        if: runner.os == 'macOS'
        run: brew install blackhole-2ch || true

      - name: Windows – virtual audio
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip -OutFile c.zip
          Expand-Archive c.zip -DestinationPath c
          Start-Process c\VBCABLE_Setup_x64.exe -ArgumentList '-i','-h' -Wait -Verb RunAs

      - name: Write Go files
        shell: bash
        run: |
          cat > go.mod << 'EOF'
          module rd

          go 1.22

          require (
            github.com/pion/mediadevices v0.6.2
            github.com/pion/webrtc/v4    v4.0.0
          )
          EOF

          cat > main.go << 'EOF'
          package main

          import (
            "encoding/base64"
            "io"
            "log"
            "net/http"
            "os"
            "strings"
            "sync"

            "github.com/pion/mediadevices"
            "github.com/pion/mediadevices/pkg/codec/opus"
            "github.com/pion/mediadevices/pkg/codec/vpx"
            "github.com/pion/mediadevices/pkg/codec/x264"
            "github.com/pion/mediadevices/pkg/prop"
            "github.com/pion/webrtc/v4"
          )

          var (
            user     = os.Getenv("RD_USER")
            pass     = os.Getenv("RD_PASS")
            mu       sync.Mutex
            sessions = map[string]*webrtc.PeerConnection{}
          )

          const indexHTML = `<!DOCTYPE html>
          <html><body>
          <video id=v autoplay playsinline controls style="width:100%;height:100vh"></video>
          <script>
          (async () => {
            const pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
            pc.addTransceiver("video",{direction:"recvonly"});
            pc.addTransceiver("audio",{direction:"recvonly"});
            pc.ontrack = e => document.getElementById("v").srcObject = e.streams[0];
            let res_url = null;
            pc.onicecandidate = async e => {
              if (!e.candidate || !res_url) return;
              await fetch(res_url, {method:"PATCH", body: e.candidate.candidate});
            };
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            const r = await fetch("/whip", {method:"POST", headers:{"Content-Type":"application/sdp"}, body: offer.sdp});
            res_url = r.headers.get("Location");
            await pc.setRemoteDescription({type:"answer", sdp: await r.text()});
          })();
          </script>
          </body></html>`

          func auth(next http.Handler) http.Handler {
            return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
              u, p, ok := r.BasicAuth()
              if !ok || u != user || p != pass {
                w.Header().Set("WWW-Authenticate", `Basic realm="rd"`)
                http.Error(w, "Unauthorized", 401)
                return
              }
              next.ServeHTTP(w, r)
            })
          }

          func newPC() (*webrtc.PeerConnection, error) {
            x264p, _ := x264.NewParams()
            x264p.Preset = x264.PresetUltrafast
            x264p.BitRate = 4_000_000

            vp8p, _ := vpx.NewVP8Params()
            vp8p.BitRate = 4_000_000

            vp9p, _ := vpx.NewVP9Params()
            vp9p.BitRate = 4_000_000

            op, _ := opus.NewParams()

            cs := mediadevices.NewCodecSelector(
              mediadevices.WithVideoEncoders(&x264p, &vp8p, &vp9p),
              mediadevices.WithAudioEncoders(&op),
            )

            m := &webrtc.MediaEngine{}
            cs.Populate(m)

            pc, err := webrtc.NewAPI(webrtc.WithMediaEngine(m)).NewPeerConnection(webrtc.Configuration{
              ICEServers: []webrtc.ICEServer{{URLs: []string{"stun:stun.l.google.com:19302"}}},
            })
            if err != nil {
              return nil, err
            }

            s, err := mediadevices.GetUserMedia(mediadevices.MediaStreamConstraints{
              Video: func(c *mediadevices.MediaTrackConstraints) {
                c.Width = prop.Int(1920); c.Height = prop.Int(1080); c.FrameRate = prop.Float(30)
              },
              Audio: func(c *mediadevices.MediaTrackConstraints) {},
              Codec: cs,
            })
            if err != nil {
              return nil, err
            }

            for _, t := range s.GetTracks() {
              pc.AddTransceiverFromTrack(t, webrtc.RTPTransceiverInit{Direction: webrtc.RTPTransceiverDirectionSendonly})
            }
            return pc, nil
          }

          func main() {
            mux := http.NewServeMux()

            mux.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
              w.Header().Set("Content-Type", "text/html")
              w.Write([]byte(indexHTML))
            })

            mux.HandleFunc("/whip", func(w http.ResponseWriter, r *http.Request) {
              body, _ := io.ReadAll(r.Body)
              pc, err := newPC()
              if err != nil { http.Error(w, err.Error(), 500); return }

              pc.SetRemoteDescription(webrtc.SessionDescription{Type: webrtc.SDPTypeOffer, SDP: string(body)})
              ans, _ := pc.CreateAnswer(nil)
              done := webrtc.GatheringCompletePromise(pc)
              pc.SetLocalDescription(ans)
              <-done

              id := base64.RawURLEncoding.EncodeToString(func() []byte {
                b := make([]byte, 8); f, _ := os.Open("/dev/urandom"); f.Read(b); f.Close(); return b
              }())
              mu.Lock(); sessions[id] = pc; mu.Unlock()

              pc.OnConnectionStateChange(func(s webrtc.PeerConnectionState) {
                if s == webrtc.PeerConnectionStateFailed || s == webrtc.PeerConnectionStateClosed {
                  mu.Lock(); delete(sessions, id); mu.Unlock(); pc.Close()
                }
              })

              w.Header().Set("Content-Type", "application/sdp")
              w.Header().Set("Location", "/whip/"+id)
              w.WriteHeader(201)
              w.Write([]byte(pc.LocalDescription().SDP))
            })

            mux.HandleFunc("/whip/", func(w http.ResponseWriter, r *http.Request) {
              id := strings.TrimPrefix(r.URL.Path, "/whip/")
              mu.Lock(); pc, ok := sessions[id]; mu.Unlock()
              if !ok { http.Error(w, "not found", 404); return }
              switch r.Method {
              case http.MethodPatch:
                body, _ := io.ReadAll(r.Body)
                pc.AddICECandidate(webrtc.ICECandidateInit{Candidate: string(body)})
                w.WriteHeader(204)
              case http.MethodDelete:
                mu.Lock(); delete(sessions, id); mu.Unlock()
                pc.Close(); w.WriteHeader(204)
              }
            })

            log.Println("listening :8080")
            http.ListenAndServe(":8080", auth(mux))
          }
          EOF

      - name: Build
        run: go mod tidy && go build -o streamer .
        env:
          CGO_ENABLED: "1"

      - name: Tunnel
        id: tunnel
        uses: anyvm-org/cf-tunnel@v0
        with:
          protocol: http
          port: 8080

      - name: Run
        run: |
          echo "URL: https://${{ steps.tunnel.outputs.server }}"
          ./streamer
        env:
          RD_USER: ${{ secrets.USERNAME }}
          RD_PASS: ${{ secrets.PASSWORD }}