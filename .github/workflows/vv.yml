name: Test Hardware Video Encoders

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-encoders:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg vainfo intel-media-va-driver-non-free

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Show ffmpeg encoders
        run: ffmpeg -hide_banner -encoders | grep -iE "qsv|videotoolbox|nvenc" || echo "No hw encoders listed"

      - name: Check VA-API devices (Linux only)
        if: runner.os == 'Linux'
        run: |
          echo "Checking for /dev/dri render nodes..."
          ls -la /dev/dri 2>/dev/null || echo "No /dev/dri found - no GPU/iGPU exposed to this runner"
          echo "---"
          echo "Running vainfo (expect failure if no device)..."
          vainfo || echo "vainfo failed - confirms no VA-API device access"

      - name: Generate test clip
        shell: bash
        run: |
          ffmpeg -f lavfi -i testsrc=duration=5:size=1280x720:rate=30 -pix_fmt yuv420p test_input.mp4

      - name: Test QSV encode (Ubuntu)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          echo "=== Attempting h264_qsv encode ==="
          time ffmpeg -y -init_hw_device qsv=hw -filter_hw_device hw \
            -i test_input.mp4 -vf format=nv12,hwupload=extra_hw_frames=64 \
            -c:v h264_qsv -b:v 3M out_qsv.mp4
          echo "QSV encode result: $?"

      - name: Test QSV encode (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          echo "=== Attempting h264_qsv encode ==="
          $t0 = Get-Date
          ffmpeg -y -i test_input.mp4 -c:v h264_qsv -b:v 3M out_qsv.mp4
          $exit = $LASTEXITCODE
          $t1 = Get-Date
          Write-Host "QSV encode exit code: $exit, took $(($t1 - $t0).TotalSeconds)s"

      - name: Test VideoToolbox encode (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          echo "=== Attempting h264_videotoolbox encode ==="
          time ffmpeg -y -i test_input.mp4 -c:v h264_videotoolbox -b:v 3M out_vt.mp4
          echo "VideoToolbox encode result: $?"

      - name: Baseline software (libx264) encode for comparison
        shell: bash
        run: |
          echo "=== Software x264 encode (baseline) ==="
          time ffmpeg -y -i test_input.mp4 -c:v libx264 -preset medium -b:v 3M out_sw.mp4
          echo "Software encode result: $?"

      - name: Summarize results
        shell: bash
        run: |
          echo "### Encode output files present ###"
          ls -la out_*.mp4 2>/dev/null || echo "No hardware-encoded output produced"
          echo ""
          echo "If out_qsv.mp4 / out_vt.mp4 is missing above, that encoder failed on this runner."
          echo "Compare the 'real' time from each encode step to see speed difference vs libx264."