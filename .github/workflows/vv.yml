name: Test Hardware Video Encoders

on:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check + test hardware encoding (Linux)
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg vainfo intel-media-va-driver-non-free mesa-va-drivers xvfb > /dev/null

          echo "### GPU / render node check ###"
          lspci -nnk | grep -iA3 vga || echo "No VGA device via lspci"
          ls -la /dev/dri 2>/dev/null || echo "No /dev/dri present"

          echo "### VA-API driver check (under Xvfb) ###"
          xvfb-run -a vainfo 2>&1 || echo "VA-API unavailable"

          echo "### NVIDIA check ###"
          nvidia-smi 2>&1 || echo "No NVIDIA GPU"

          xvfb-run -a ffmpeg -f lavfi -i testsrc=duration=5:size=1280x720:rate=30 -pix_fmt yuv420p -y test_input.mp4

          echo "### QSV encode attempt ###"
          xvfb-run -a ffmpeg -y -init_hw_device qsv=hw -filter_hw_device hw -i test_input.mp4 \
            -vf format=nv12,hwupload=extra_hw_frames=64 -c:v h264_qsv -b:v 3M out_qsv.mp4 \
            2>&1 || echo "QSV FAILED"

          echo "### NVENC encode attempt ###"
          xvfb-run -a ffmpeg -y -i test_input.mp4 -c:v h264_nvenc -b:v 3M out_nvenc.mp4 2>&1 || echo "NVENC FAILED"

          echo "### Software baseline ###"
          time ffmpeg -y -i test_input.mp4 -c:v libx264 -preset medium -b:v 3M out_sw.mp4

          echo "### RESULT SUMMARY ###"
          ls -la out_*.mp4 2>/dev/null
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Check + test hardware encoding (Windows)
        shell: pwsh
        run: |
          Write-Host "### GPU check (WMI) ###"
          Get-CimInstance Win32_VideoController | Select-Object Name, AdapterRAM, DriverVersion | Format-List

          choco install ffmpeg -y | Out-Null

          ffmpeg -f lavfi -i testsrc=duration=5:size=1280x720:rate=30 -pix_fmt yuv420p -y test_input.mp4

          Write-Host "### QSV encode attempt ###"
          ffmpeg -y -i test_input.mp4 -c:v h264_qsv -b:v 3M out_qsv.mp4 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "QSV FAILED (exit $LASTEXITCODE)" }

          Write-Host "### NVENC encode attempt ###"
          ffmpeg -y -i test_input.mp4 -c:v h264_nvenc -b:v 3M out_nvenc.mp4 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "NVENC FAILED (exit $LASTEXITCODE)" }

          Write-Host "### Software baseline ###"
          $t0 = Get-Date
          ffmpeg -y -i test_input.mp4 -c:v libx264 -preset medium -b:v 3M out_sw.mp4
          Write-Host "Software encode took $((Get-Date) - $t0)"

          Write-Host "### RESULT SUMMARY ###"
          Get-ChildItem out_*.mp4 -ErrorAction SilentlyContinue

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Check + test hardware encoding (macOS)
        run: |
          echo "### Hardware check ###"
          system_profiler SPDisplaysDataType | head -30
          sysctl -n machdep.cpu.brand_string 2>/dev/null || echo "N/A"

          brew install ffmpeg > /dev/null

          ffmpeg -f lavfi -i testsrc=duration=5:size=1280x720:rate=30 -pix_fmt yuv420p -y test_input.mp4

          echo "### VideoToolbox encode attempt ###"
          ffmpeg -y -i test_input.mp4 -c:v h264_videotoolbox -b:v 3M out_vt.mp4 2>&1 || echo "VideoToolbox FAILED"

          echo "### VideoToolbox forced software fallback (-allow_sw 1) ###"
          ffmpeg -y -i test_input.mp4 -c:v h264_videotoolbox -allow_sw 1 -b:v 3M out_vt_sw.mp4 2>&1 || echo "VideoToolbox sw-fallback FAILED"

          echo "### Software baseline ###"
          time ffmpeg -y -i test_input.mp4 -c:v libx264 -preset medium -b:v 3M out_sw.mp4

          echo "### RESULT SUMMARY ###"
          ls -la out_*.mp4 2>/dev/null