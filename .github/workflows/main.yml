name: Remote Desktop

on: 
  workflow_dispatch:
    inputs:
      offer:
        description: "Offer"
        type: string
        required: true
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main
        
      - name: Setup Ubuntu desktop GUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorg xfce4 xvfb

          Xvfb ${DISPLAY} -screen 0 1920x1080x24 &
          setsid startxfce4 &

      - name: Start server
        env:
          OFFER: ${{ github.event.inputs.offer }}
        run: |
          go run main.go