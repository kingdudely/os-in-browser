name: Remote Desktop

on: 
  workflow_dispatch:
    inputs:
      offer:
        description: "Offer"
        type: string
        required: true
      os:
        description: "Operating system"
        type: choice
        required: true
        default: "windows-latest"
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Start server
        id: start-server
        run: |
          case "$RUNNER_OS" in
            macOS)
              coproc { ./dist/darwin; }
              ;;

            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                lxqt \
                openbox \
                dbus-x11 \
                xvfb

              coproc { xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'dbus-launch startlxqt >/tmp/lxqt.log 2>&1 & exec ./dist/linux'; }
              ;;

            Windows)
              coproc { ./dist/windows.exe; }
              ;;

            *)
              echo "Error: Unsupported OS"
              exit 1
              ;;
          esac

          echo "${{ github.event.inputs.offer }}" >&"${COPROC[1]}"
          read -r <&"${COPROC[0]}"
          echo "answer=${REPLY}" >> "${GITHUB_OUTPUT}"

      - name: Save answer to file
        run: printf '%s' "${{ steps.start-server.outputs.answer }}" > "${RUNNER_TEMP}/answer.txt"

      - name: Upload answer
        uses: actions/upload-artifact@main
        with:
          path: "${{ runner.temp }}/answer.txt"
          archive: false

      - name: Keep alive
        run: read