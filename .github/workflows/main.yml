name: Remote Desktop
run-name: ${{ inputs.os }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

      username:
        description: Username
        type: string
        required: true

      password:
        description: Password
        type: string
        required: true

jobs:
  job:
    name: URL
    runs-on: ${{ inputs.os }}

    env:
      PORT: 8080

    environment:
      name: ${{ github.run_id }}

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Establish tunnel
        id: tunnel
        uses: anyvm-org/cf-tunnel@v0
        with:
          protocol: http
          port: ${{ env.PORT }}

      - name: Run remote desktop
        env:
          GH_TOKEN: ${{ github.token }}
          TUNNEL_URL: ${{ steps.tunnel.outputs.server }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export USERNAME=$(jq -r '.inputs.username // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${USERNAME}"

          export PASSWORD=$(jq -r '.inputs.password // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${PASSWORD}"

          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                icewm \
                xvfb \
                libx11-6 \
                libxtst6 \
                libxfixes3

              read -r DISPLAY_NUMBER < <(
                Xvfb \
                  -displayfd 1 \
                  -screen 0 1920x1080x24 \
                  +extension XTEST \
                  +extension XFIXES \
                  -nolisten tcp
              )

              export DISPLAY=":$DISPLAY_NUMBER"
              icewm-session &

              gh release download \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 'os-in-browser-linux-x64' \
                --output os-in-browser

              chmod +x os-in-browser
              ./os-in-browser
              ;;

            Windows)
              gh release download \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 'os-in-browser-windows-x64.exe' \
                --output os-in-browser.exe

              ./os-in-browser.exe
              ;;

            macOS)
              gh release download \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 'os-in-browser-macos-arm64.zip' \
                --output os-in-browser.zip

              unzip -q os-in-browser.zip
              ./os-in-browser.app/Contents/MacOS/os-in-browser
              ;;
          esac