name: Remote Desktop

on: 
  workflow_dispatch:
    inputs:
      offer:
        description: "Offer"
        type: string
        required: true
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      OFFER: ${{ github.event.inputs.offer }}

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main
        
      - name: Ubuntu setup
        if: runner.os == 'Linux'
        env:
          DISPLAY: ":0"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorg xfce4 xvfb dbus-x11

          Xvfb "${DISPLAY}" -screen 0 1920x1080x24 &
          setsid startxfce4 &
          sudo -E ./dist/linux

      - name: MacOS setup
        if: runner.os == 'MacOS'
        run: |
          ./dist/darwin

      - name: Windows setup
        if: runner.os == 'Windows'
        run: |
          ./dist/windows.exe