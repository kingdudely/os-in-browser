name: Remote Desktop

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on: 
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      offer:
        description: "Offer"
        type: string
        required: true

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Create Linux screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lxqt \
            openbox \
            dbus-x11 \
            xvfb

          read -r DISPLAY_NUMBER < <(exec Xvfb -displayfd 1)

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"

          startlxqt &

      - name: Start server
        id: server
        env:
          OFFER: ${{ github.event.inputs.offer }}
        background: true
        run: |
          npx nw

      - name: Wait for answer.txt
        run: |
          until [ -f answer.txt ]; do
            sleep 1
          done

      - name: Upload answer.txt
        uses: actions/upload-artifact@main
        with:
          path: answer.txt
          archive: false

      - name: Wait until connection is closed
        wait: server