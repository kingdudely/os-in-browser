name: Remote Desktop

on: 
  workflow_dispatch:
    inputs:
      os:
        description: 'OS'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      page_offer:
        description: "Page offer"
        type: string
        required: true

defaults:
  run:
    shell: bash

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360
    env:
      DISPLAY: ":0"

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Install Python
        uses: actions/setup-python@main
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Setup Ubuntu desktop GUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorg xfce4 xvfb # x11-utils

          Xvfb ${DISPLAY} -screen 0 1920x1080x24 &
          setsid startxfce4 &

      - name: Install server dependencies
        run: |
          pip install -r requirements.txt

      - name: Start server
        env:
          PAGE_OFFER: ${{ github.event.inputs.page_offer }}
        run: |
          python3 -u main.py