name: Remote Desktop

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on: 
  workflow_dispatch:
    inputs:
      share-id:
        description: "Share ID"
        type: string
        required: true
      os:
        description: "Operating system"
        type: choice
        required: true
        default: "windows-latest"
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Start server
        id: server
        background: true
        run: |
          case "$RUNNER_OS" in
            macOS)
              ./dist/darwin
              ;;

            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                lxqt \
                openbox \
                dbus-x11 \
                xvfb

              xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'dbus-launch startlxqt >/tmp/lxqt.log 2>&1 & exec ./dist/linux'
              ;;

            Windows)
              ./dist/windows.exe
              ;;

            *)
              echo "Error: Unsupported OS"
              exit 1
              ;;
          esac

      - name: Wait for answer
        run: |
          until [ -f "answer.txt" ]; do
            sleep 1
          done

      - name: Upload answer
        uses: actions/upload-artifact@main
        with:
          path: answer.txt
          archive: false

      - name: Wait until connection is closed
        wait: server