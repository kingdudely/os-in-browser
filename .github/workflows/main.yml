name: Remote Desktop

on: 
  workflow_dispatch:
    inputs:
      offer:
        description: "Offer"
        type: string
        required: true
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      OFFER: ${{ github.event.inputs.offer }}

    steps:
      - name: Copy repository into runner
        uses: actions/checkout@main

      - name: Install Linux packages
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: "lxqt openbox dbus-x11"
          version: "1.0"

      - name: Start server
        run: |
          case "$RUNNER_OS" in
            macOS)
              ./dist/darwin
              ;;

            Linux)
              xvfb-run -as "-screen 0 1920x1080x24" bash -c "dbus-launch --exit-with-session startlxqt & exec ./dist/linux"
              ;;

            Windows)
              ./dist/windows.exe
              ;;

            *)
              echo "Error: Unsupported OS"
              exit 1
              ;;
          esac