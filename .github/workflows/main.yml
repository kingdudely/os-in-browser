name: Remote Desktop

on: 
  workflow_dispatch:
    inputs:
      os:
        description: 'OS'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      username:
        description: "Username"
        type: string
        required: false
      password:
        description: "Password"
        type: string
        required: false

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Install server dependencies
        run: pip install -r requirements.txt

      - name: Start server
        run: |
          USERNAME=$(jq -r '.inputs.username' "$GITHUB_EVENT_PATH")
          PASSWORD=$(jq -r '.inputs.password' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${USERNAME}"
          echo "::add-mask::${PASSWORD}"

          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install lxqt openbox dbus-x11 xvfb
            xvfb-run -as "-screen 0 1920x1080x24" bash -c "dbus-launch --exit-with-session startlxqt & python3 -u main.py --username=${USERNAME} --password=${PASSWORD}"
          else
            python3 -u main.py --username="${USERNAME}" --password="${PASSWORD}"
          fi