name: Remote Desktop

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on: 
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      offer:
        description: "Offer"
        type: string
        required: true

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Start server
        id: server
        env:
          OFFER: ${{ github.event.inputs.offer }}
        background: true
        run: |
          case "$RUNNER_OS" in
            macOS)
              ;;

            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                lxqt \
                openbox \
                dbus-x11 \
                xvfb

              read -r DISPLAY_NUMBER < <(exec Xvfb -displayfd 1)
              export DISPLAY=":$DISPLAY_NUMBER"

              startlxqt &
              ;;

            Windows)
              ;;

            *)
              echo "Error: Unsupported OS"
              exit 1
              ;;
          esac

          # List native library files inside the shaded jar
          jar tf ./host/target/remote-desktop-agent-1.0.0.jar | grep -E "\.(so|dylib|dll)"
          java -jar ./host/target/remote-desktop-agent-1.0.0.jar

      - name: Wait for answer.txt
        run: |
          until [ -f answer.txt ]; do
            sleep 1
          done

      - name: Upload answer.txt
        uses: actions/upload-artifact@main
        with:
          path: answer.txt
          archive: false

      - name: Wait until connection is closed
        wait: server