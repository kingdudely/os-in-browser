name: Remote Desktop

on: 
  workflow_dispatch:
    inputs:
      viewer_share_id:
        description: "Viewer share ID"
        type: string
        reuqired: true
      os:
        description: 'OS'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Install Node.js
        uses: actions/setup-node@main
        with:
          node-version: 24
          cache: 'npm'

      - name: Install server dependencies
        run: |
          npm install

      - name: Start server
        env:
          NODE_OPTIONS: --unhandled-rejections=strict
          VIEWER_SHARE_ID: ${{ github.event.inputs.viewer_share_id }}
        run: |
          npm start
