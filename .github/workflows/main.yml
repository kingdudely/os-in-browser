name: Remote Desktop

on: 
  workflow_dispatch:
    inputs:
      offer:
        description: "Offer"
        type: string
        required: true
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      OFFER: ${{ github.event.inputs.offer }}
      DISPLAY: ":0"

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main
        
      - name: Ubuntu setup
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorg xfce4 xvfb dbus-x11

          Xvfb "${DISPLAY}" -screen 0 1920x1080x24 &

          echo "Waiting for display to initialize..."
          until xset -q &>/dev/null; do
              sleep 0.67
          done
          echo "Display is ready!"

          setsid startxfce4 &

      - name: Start server
        run: |
          case "$RUNNER_OS" in
            macOS)
              ./dist/darwin
              ;;

            Linux)
              ./dist/linux
              ;;

            Windows)
              ./dist/windows.exe
              ;;

            *)
              echo "Error: Unsupported OS"
              exit 1
              ;;
          esac