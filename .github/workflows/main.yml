name: Remote Desktop
run-name: ${{ inputs.os }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      username:
        description: "Username"
        type: string
        required: true
      password:
        description: "Password"
        type: string
        required: true
jobs:
  job:
    name: 'URL'
    runs-on: ${{ inputs.os }}

    environment:
      name: Cloudflare tunnel
      url: ${{ steps.host.outputs.url }}

    permissions:
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Windows packages
        if: runner.os == 'Windows'
        run: |
          choco install -y cloudflared

      - name: Create admin account for MacOS
        if: runner.os == 'macOS'
        run: |
          sudo sysadminctl -addUser admin -password admin -fullName Administrator -admin

      - name: Install MacOS packages
        if: runner.os == 'macOS'
        run: |
          brew install cloudflared

      - name: Add Cloudflare APT repo
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" | sudo tee /etc/apt/sources.list.d/cloudflared.list

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cloudflared \
            icewm \
            xvfb \
            libx11-6 \
            libxtst6 \
            libxfixes3

      - name: Setup Linux Desktop
        if: runner.os == 'Linux'
        run: |
          read -r DISPLAY_NUMBER < <(
            exec Xvfb \
              -displayfd 1 \
              -screen 0 1920x1080x24 \
              +extension XTEST \
              +extension XFIXES \
              -nolisten tcp
          )

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"

          icewm-session &

      - name: Install NPM packages
        run: npm install

      - name: Start remote desktop host
        id: host
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORT: 8080
          METRICS_HOSTNAME: "localhost:8081"
        run: |
          export USERNAME=$(jq -r '.inputs.username // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${USERNAME}"

          export PASSWORD=$(jq -r '.inputs.password // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${PASSWORD}"

          npm start &
          HOST_PID=$!

          HOSTNAME="http://localhost:${PORT}"
          cloudflared tunnel \
            --metrics="${METRICS_HOSTNAME}" \
            --url="${HOSTNAME}" &
          TUNNEL_PID=$!

          until \
            cloudflared tunnel ready --metrics="${METRICS_HOSTNAME}" &&
            curl -fsS "${HOSTNAME}" >/dev/null
          do
            if ! kill -0 "${HOST_PID}" 2>/dev/null; then
              wait "${HOST_PID}"
            fi

            if ! kill -0 "${TUNNEL_PID}" 2>/dev/null; then
              wait "${TUNNEL_PID}"
            fi

            sleep 1
          done

          TUNNEL_HOSTNAME=$(
            curl -fsS "http://${METRICS_HOSTNAME}/quicktunnel" |
            jq -r '.hostname'
          )

          echo "url=https://${TUNNEL_HOSTNAME}" >> "$GITHUB_OUTPUT"

      - name: Sleep
        run: sleep 21600