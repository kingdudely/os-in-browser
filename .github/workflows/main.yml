name: NW.js Mixed Context Runner

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS to run on"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
  push:
    branches: [main]

env:
  NWJS_VERSION: "0.113.0"
  NWJS_FLAVOR: "normal"   # "normal" or "sdk"

jobs:
  run-nwjs:
    # workflow_dispatch lets you pick; push events default to ubuntu-latest
    runs-on: ${{ github.event.inputs.os || 'ubuntu-latest' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set platform vars (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "NWJS_PLATFORM=linux-x64" >> $GITHUB_ENV
          echo "NWJS_EXT=tar.gz" >> $GITHUB_ENV
          echo "NWJS_BIN=nw" >> $GITHUB_ENV

      - name: Set platform vars (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "NWJS_PLATFORM=osx-x64" >> $GITHUB_ENV
          echo "NWJS_EXT=zip" >> $GITHUB_ENV
          echo "NWJS_BIN=nwjs.app/Contents/MacOS/nwjs" >> $GITHUB_ENV

      - name: Set platform vars (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "NWJS_PLATFORM=win-x64" >> $GITHUB_ENV
          echo "NWJS_EXT=zip" >> $GITHUB_ENV
          echo "NWJS_BIN=nw.exe" >> $GITHUB_ENV

      - name: Cache NW.js download
        id: cache-nwjs
        uses: actions/cache@v4
        with:
          path: nwjs-dist
          key: nwjs-${{ env.NWJS_VERSION }}-${{ env.NWJS_FLAVOR }}-${{ env.NWJS_PLATFORM }}

      - name: Download NW.js
        if: steps.cache-nwjs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          NAME="nwjs"
          if [ "$NWJS_FLAVOR" = "sdk" ]; then NAME="nwjs-sdk"; fi
          FILE="${NAME}-v${NWJS_VERSION}-${NWJS_PLATFORM}.${NWJS_EXT}"
          URL="https://dl.nwjs.io/v${NWJS_VERSION}/${FILE}"
          echo "Downloading $URL"
          curl -L -o nwjs-archive.${NWJS_EXT} "$URL"

          if [ "$NWJS_EXT" = "tar.gz" ]; then
            tar -xzf nwjs-archive.tar.gz
          else
            unzip -q nwjs-archive.zip
          fi
          mv ${NAME}-v${NWJS_VERSION}-${NWJS_PLATFORM} nwjs-dist

      - name: Add NW.js to PATH (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "nwjs-dist/${NWJS_BIN}" || true
          echo "${{ github.workspace }}/nwjs-dist" >> $GITHUB_PATH

      - name: Add NW.js to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${{ github.workspace }}/nwjs-dist" >> $GITHUB_PATH

      - name: Install app dependencies
        shell: bash
        run: |
          if [ -f package.json ]; then npm ci --omit=dev || npm install; fi

      - name: Install xvfb (Linux only, for headless GUI)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run NW.js app (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            nw . --enable-logging --no-sandbox
        env:
          DISPLAY: ":99"

      - name: Run NW.js app (macOS)
        if: runner.os == 'macOS'
        run: |
          ./nwjs-dist/${{ env.NWJS_BIN }} . --enable-logging --no-sandbox

      - name: Run NW.js app (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          nwjs-dist\nw.exe . --enable-logging --no-sandbox

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nwjs-output-${{ runner.os }}
          path: |
            output/**
            *.log
          if-no-files-found: ignore