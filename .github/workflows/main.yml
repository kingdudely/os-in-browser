name: Remote Desktop

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on: 
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360
    permissions:
      statuses: write

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Start server
        run: |
          case "$RUNNER_OS" in
            macOS)
              # ./macos/dist/...
              ;;

            Linux)
              sudo apt-get install -y --no-install-recommends \
                lxqt \
                openbox \
                dbus-x11 \
                xvfb \
                libxrandr-dev \
                libxtst-dev


              xvfb-run -a -s "-screen 0 1920x1080x24" bash -c "dbus-launch startlxqt >/tmp/lxqt.log 2>&1 & exec ./dist/linux"
              ;;

            Windows)
              winget install -e --id=Parsec.ParsecVDD --accept-package-agreements --accept-source-agreements --disable-interactivity
              # ./windows/dist/...
              ;;

            *)
              echo "Error: Unsupported OS"
              exit 1
              ;;
          esac