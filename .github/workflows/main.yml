name: Remote Desktop

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on: 
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      offer:
        description: "Offer"
        type: string
        required: true

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Start server
        id: server
        env:
          OFFER: ${{ github.event.inputs.offer }}
        background: true
        run: |
          case "$RUNNER_OS" in
            macOS)
              chmod +x ./host/dist/macos-latest/os-in-browser-host
              ./host/dist/macos-latest/os-in-browser-host
              ;;

            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                lxqt \
                openbox \
                dbus-x11 \
                xvfb

              chmod +x ./host/dist/ubuntu-latest/os-in-browser-host
              xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'dbus-launch startlxqt >/tmp/lxqt.log 2>&1 & exec ./host/dist/ubuntu-latest/os-in-browser-host'
              ;;

            Windows)
              ./host/dist/windows-latest/os-in-browser-host.exe
              ./host/dist/windows-latest/os-in-browser-host.exe
              ;;

            *)
              echo "Error: Unsupported OS"
              exit 1
              ;;
          esac

      - name: Wait for answer.txt
        run: |
          until [ -f answer.txt ]; do
            sleep 1
          done

      - name: Upload answer.txt
        uses: actions/upload-artifact@main
        with:
          path: answer.txt
          archive: false

      - name: Wait until connection is closed
        wait: server
