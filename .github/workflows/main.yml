name: Remote Desktop

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on: 
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      offer:
        description: "Offer"
        type: string
        required: true

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Create Linux screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lxqt \
            openbox \
            dbus-x11 \
            xvfb

          read -r DISPLAY_NUMBER < <(exec Xvfb -displayfd 1)

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"

          startlxqt &

      - name: Install Windows Virtual Device Driver
        if: runner.os == 'Windows'
        run: |
          winget install --id=VirtualDrivers.Virtual-Display-Driver -e

      - name: Install MacOS dependencies
        if: runner.os == 'macOS'
        env:
          KARABINER_VERSION: "8.2.0" # bump deliberately, don't track main
        run: |
          brew install lld

          # --- Karabiner-DriverKit-VirtualHIDDevice ---------------------------------
          # Pinned tag, not main, so a Karabiner-side change can't silently break your build.
          git clone --depth 1 --branch "v${KARABINER_VERSION}" \
            https://github.com/pqrs-org/Karabiner-DriverKit-VirtualHIDDevice.git /tmp/karabiner-vhid

          # Headers: client library + its vendored deps (dispatcher, hid, spdlog,
          # nlohmann json, asio, boost, etc). Both trees have a top-level pqrs/ dir
          # with non-overlapping subfolders, so they merge cleanly.
          mkdir -p native-apis/macos/vendor/karabiner
          cp -R /tmp/karabiner-vhid/include/.               native-apis/macos/vendor/karabiner/
          cp -R /tmp/karabiner-vhid/vendor/vendor/include/.  native-apis/macos/vendor/karabiner/

          # Install the driver + daemon from the pkg that ships in that same repo.
          PKG_PATH=$(ls /tmp/karabiner-vhid/dist/Karabiner-DriverKit-VirtualHIDDevice-*.pkg | sort -V | tail -1)
          sudo installer -pkg "$PKG_PATH" -target /

          # With SIP disabled, this skips the normal interactive "Allow" prompt in
          # System Settings -> Privacy & Security, which otherwise has no one to click it
          # on a headless runner.
          sudo systemextensionsctl developer on

          # Activate the system extension.
          sudo '/Applications/.Karabiner-VirtualHIDDevice-Manager.app/Contents/MacOS/Karabiner-VirtualHIDDevice-Manager' activate

          # Start the daemon that brokers client <-> driver communication.
          # Client apps (this addon) must also run as root to be allowed to send input.
          sudo '/Library/Application Support/org.pqrs/Karabiner-DriverKit-VirtualHIDDevice/Applications/Karabiner-VirtualHIDDevice-Daemon.app/Contents/MacOS/Karabiner-VirtualHIDDevice-Daemon' &

          rm -rf /tmp/karabiner-vhid

      - name: Start server
        id: server
        env:
          OFFER: ${{ github.event.inputs.offer }}
        background: true
        run: |
          unset LDFLAGS CXXFLAGS CPPFLAGS
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          npm install
          npm start

      - name: Wait for answer.txt
        run: |
          until [ -f answer.txt ]; do
            sleep 1
          done

      - name: Upload answer.txt
        uses: actions/upload-artifact@main
        with:
          path: answer.txt
          archive: false

      - name: Wait until connection is closed
        wait: server