name: Remote Desktop

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on: 
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360
    permissions:
      statuses: write

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create Linux virtual screen
        if: runner.os == 'Linux'
        run: |
          # Use docker one day
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xfce4 \
            dbus-x11 \
            xvfb \
            libxtst-dev

          read -r DISPLAY_NUMBER < <(exec Xvfb -displayfd 1 -screen 0 1920x1080x24 +extension XTEST -nolisten tcp)

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          echo "ELECTRON_DISABLE_SANDBOX=1" >> $GITHUB_ENV

          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"

          startxfce4 &

      - name: Start server
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install
          npm start
