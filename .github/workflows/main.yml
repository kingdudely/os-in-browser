name: Remote Desktop

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on: 
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      topic-name:
        description: "Topic name"
        type: string
        required: true

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Create Linux screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lxqt \
            openbox \
            dbus-x11 \
            xvfb \
            libxrandr-dev

          read -r DISPLAY_NUMBER < <(exec Xvfb -displayfd 1)

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"

          startlxqt &

      - name: Install Windows Virtual Device Driver
        if: runner.os == 'Windows'
        run: |
          winget install --id=VirtualDrivers.Virtual-Display-Driver -e --accept-source-agreements --accept-package-agreements

      - name: Start server
        env:
          TOPIC_NAME: ${{ github.event.inputs.topic-name }}
          ELECTRON_DISABLE_SANDBOX: 1 # Curse you Ubuntu!!!!!!!!!!!!!!!! jk sorry, but still . ... .
        run: |
          npm install
          npm start