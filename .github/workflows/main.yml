name: Remote Desktop
run-name: ${{ inputs.os }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      username:
        description: "Username"
        type: string
        required: true
      password:
        description: "Password"
        type: string
        required: true
jobs:
  job:
    name: 'URL'
    runs-on: ${{ inputs.os }}

    env:
      METRICS_HOSTNAME: "localhost:8081"

    environment:
      name: Cloudflare tunnel
      url: ${{ steps.tunnel.outputs.url }}

    permissions:
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Create admin account for MacOS
        if: runner.os == 'macOS'
        run: |
          sudo sysadminctl -addUser admin -password admin -fullName Administrator -admin

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            icewm \
            xvfb \
            libx11-6 \
            libxtst6 \
            libxfixes3

      - name: Setup Linux Desktop
        if: runner.os == 'Linux'
        run: |
          read -r DISPLAY_NUMBER < <(
            exec Xvfb \
              -displayfd 1 \
              -screen 0 1920x1080x24 \
              +extension XTEST \
              +extension XFIXES \
              -nolisten tcp
          )

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"

          icewm-session &

      - name: Install NPM packages
        run: |
          npm install

      - name: Start remote desktop host
        id: host
        background: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export USERNAME=$(jq -r '.inputs.username // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${USERNAME}"

          export PASSWORD=$(jq -r '.inputs.password // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${PASSWORD}"

          npm start # cloudflared tunnel --metrics "localhost:${METRICS_PORT}" ready
      
      - name: Wait for tunnel hostname # what if steps.host fails?
        id: tunnel
        run: |
          until response=$(curl -fsS "http://${METRICS_HOSTNAME}/quicktunnel"); do
            sleep 1
          done

          hostname=$(jq -r '.hostname' <<< "${response}")

          echo "url=https://${hostname}" >> "$GITHUB_OUTPUT"

      - name: Wait for host
        wait: host