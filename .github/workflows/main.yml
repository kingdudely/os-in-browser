name: Remote Desktop

on: 
  workflow_dispatch:
    inputs:
      os:
        description: 'OS'
        type: choice
        required: true
        default: 'windows-latest'
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      username:
        description: "Username"
        type: string
        required: false
      password:
        description: "Password"
        type: string
        required: false

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Install Python
        uses: actions/setup-python@main
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Linux setup
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xterm

          read -r DISPLAY_NUMBER < <(exec Xvfb -displayfd 1)

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"

          xterm &

      - name: Install server dependencies
        run: pip install -r requirements.txt

      - name: Start server
        run: |
          USERNAME=$(jq -r '.inputs.username' "$GITHUB_EVENT_PATH")
          PASSWORD=$(jq -r '.inputs.password' "$GITHUB_EVENT_PATH")
          # echo "::add-mask::${USERNAME}"
          # echo "::add-mask::${PASSWORD}"

          python3 -u main.py --username="${USERNAME}" --password="${PASSWORD}"