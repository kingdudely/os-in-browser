name: Remote Desktop
run-name: ${{ inputs.os }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

      username:
        description: Username
        type: string
        required: true

      password:
        description: Password
        type: string
        required: true

jobs:
  job:
    name: URL
    runs-on: ${{ inputs.os }}

    environment:
      name: ${{ github.run_id }}

    permissions:
      contents: read
      deployments: write

    env:
      PORT: 8080
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Start tunnel
        id: tunnel
        env:
          METRICS_URL: "localhost:8081"
        run: |
          case "$RUNNER_OS" in
            Windows)
              CLOUDFLARED=./cloudflared.exe

              curl -fsSL \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" \
                -o "${CLOUDFLARED}"
              ;;

            Linux)
              CLOUDFLARED=./cloudflared

              curl -fsSL \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
                -o "${CLOUDFLARED}"
              ;;

            macOS)
              CLOUDFLARED=./cloudflared

              curl -fsSL \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz" |
                tar -xz
              ;;
          esac

          chmod +x "${CLOUDFLARED}"

          "${CLOUDFLARED}" tunnel \
            --metrics="${METRICS_URL}" \
            --url "http://localhost:${PORT}" &

          until JSON="$(curl -sS "${METRICS_URL}/quicktunnel")"; do
            sleep 0.1
          done

          HOSTNAME="$(jq -r '.hostname' <<< "${JSON}")"
          TUNNEL_URL="https://${HOSTNAME}"

          echo "url=${TUNNEL_URL}" >> "$GITHUB_OUTPUT"

      - name: Setup Ubuntu desktop and audio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            icewm \
            xvfb \
            libx11-6 \
            libxtst6 \
            libxfixes3 \
            pulseaudio \
            pulseaudio-utils

          read -r DISPLAY_NUMBER < <(
            Xvfb \
              -displayfd 1 \
              -screen 0 1920x1080x24 \
              +extension XTEST \
              +extension XFIXES \
              -nolisten tcp
          )

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=${DISPLAY}" >> $GITHUB_ENV

          icewm-session &
          pulseaudio --start --exit-idle-time=-1

      - name: Setup Windows audio
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip `
            -OutFile "$env:RUNNER_TEMP\VBCABLE.zip"

          Expand-Archive `
            "$env:RUNNER_TEMP\VBCABLE.zip" `
            -DestinationPath "$env:RUNNER_TEMP\VBCABLE"

          & "$env:RUNNER_TEMP\VBCABLE\VBCABLE_Setup_x64.exe" -i -h

          Start-Service audiosrv

          Install-Module AudioDeviceCmdlets -Force -Confirm:$false
          Import-Module AudioDeviceCmdlets

          $cable = Get-AudioDevice -List |
            Where-Object { $_.Name -like "CABLE Input*" } |
            Select-Object -First 1

          if (-not $cable) {
            Get-AudioDevice -List | Format-Table -AutoSize
            throw "VB-CABLE playback device not found"
          }

          Set-AudioDevice -Index $cable.Index

          Get-AudioDevice -Playback

      - name: Install Electron binary
        run: |
          npm install

      - name: Run remote desktop
        env:
          TUNNEL_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          export USERNAME=$(jq -r '.inputs.username // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${USERNAME}"

          export PASSWORD=$(jq -r '.inputs.password // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${PASSWORD}"
          case "$RUNNER_OS" in
            Linux)
              npx electron \
                --no-sandbox \
                --enable-features=PulseaudioLoopbackForScreenShare \
                app/main.js
              ;;

            Windows)
              npx electron \
                app/main.js
              ;;

            macOS)
              npx electron \
                --enable-features=MacLoopbackAudioForScreenShare,MacCatapSystemAudioLoopbackCapture \
                app/main.js
              ;;
          esac