name: Remote Desktop

on: 
  workflow_dispatch:
    inputs:
      offer:
        description: "Offer"
        type: string
        required: true
      os:
        description: "Operating system"
        type: choice
        required: true
        default: "windows-latest"
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

jobs:
  remote:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Copy repository into PC
        uses: actions/checkout@main

      - name: Start server
        env:
          arguments: ${{ github.event.inputs.offer }}
        run: |
          case "$RUNNER_OS" in
            macOS)
              ./dist/darwin
              ;;

            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                lxqt \
                openbox \
                dbus-x11 \
                xvfb
              
              xvfb-run -a -s "-screen 0 1920x1080x24" bash -c "dbus-launch startlxqt & ./dist/linux"
              ;;

            Windows)
              ./dist/windows.exe
              ;;

            *)
              echo "Error: Unsupported OS"
              exit 1
              ;;
          esac