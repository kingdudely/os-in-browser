name: Check macOS Runner Display

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check-display:
    runs-on: macos-latest
    steps:
      - name: Print runner OS/hardware info
        run: |
          sw_vers
          system_profiler SPHardwareDataType
          system_profiler SPDisplaysDataType

      - name: Write display inspection Swift script
        run: |
          cat > check_display.swift << 'EOF'
          import CoreGraphics
          import Foundation

          var displayCount: UInt32 = 0
          CGGetActiveDisplayList(0, nil, &displayCount)

          print("=== Active Display Count: \(displayCount) ===")

          if displayCount == 0 {
              print("No active displays detected — fully headless.")
              exit(0)
          }

          var displayIDs = [CGDirectDisplayID](repeating: 0, count: Int(displayCount))
          CGGetActiveDisplayList(displayCount, &displayIDs, &displayCount)

          for id in displayIDs {
              print("---")
              print("Display ID: \(id)")

              let isBuiltin = CGDisplayIsBuiltin(id) != 0
              print("Is built-in: \(isBuiltin)")

              let isOnline = CGDisplayIsOnline(id) != 0
              print("Is online: \(isOnline)")

              let isAsleep = CGDisplayIsAsleep(id) != 0
              print("Is asleep: \(isAsleep)")

              let width = CGDisplayPixelsWide(id)
              let height = CGDisplayPixelsHigh(id)
              print("Resolution: \(width)x\(height)")

              let vendor = CGDisplayVendorNumber(id)
              let model = CGDisplayModelNumber(id)
              let serial = CGDisplaySerialNumber(id)
              print("Vendor: \(vendor), Model: \(model), Serial: \(serial)")

              // Heuristic: Apple's virtual/headless displays and CI VM framebuffers
              // typically report vendor/model as 0 or a known placeholder,
              // and are neither a real built-in panel nor a real EDID-reporting monitor.
              let looksVirtualOrPlaceholder = (vendor == 0 || vendor == 0xFFFFFFFF) && !isBuiltin
              print("Looks like virtual/placeholder framebuffer: \(looksVirtualOrPlaceholder)")

              if isBuiltin {
                  print("=> Classified as: REAL built-in display")
              } else if looksVirtualOrPlaceholder {
                  print("=> Classified as: LIKELY VIRTUAL / VM placeholder framebuffer")
              } else {
                  print("=> Classified as: REAL external/EDID-reporting display")
              }

              print("--- Available display modes (CGDisplayCopyAllDisplayModes) ---")
              let options: [String: Bool] = [kCGDisplayShowDuplicateLowResolutionModes as String: true]
              guard let modes = CGDisplayCopyAllDisplayModes(id, options as CFDictionary) as? [CGDisplayMode] else {
                  print("No modes returned.")
                  continue
              }
              print("Total modes reported: \(modes.count)")

              var uniqueSizes = Set<String>()
              for mode in modes {
                  let key = "\(mode.width)x\(mode.height)@\(mode.refreshRate)"
                  if uniqueSizes.insert(key).inserted {
                      print("  \(mode.width)x\(mode.height) (pixel: \(mode.pixelWidth)x\(mode.pixelHeight)) @ \(mode.refreshRate)Hz")
                  }
              }

              // Try to test setting an arbitrary/unusual resolution to see if
              // this placeholder framebuffer accepts non-listed modes, or only
              // ones from its advertised list.
              print("--- Testing arbitrary resolution set (1337x842) ---")
              if let arbitraryMode = modes.first(where: { $0.width == 1337 && $0.height == 842 }) {
                  print("1337x842 IS in the advertised mode list (unexpected) — attempting to set it.")
                  var config: CGDisplayConfigRef?
                  if CGBeginDisplayConfiguration(&config) == .success, let configRef = config {
                      let result = CGConfigureDisplayWithDisplayMode(configRef, id, arbitraryMode, nil)
                      if result == .success {
                          CGCompleteDisplayConfiguration(configRef, .forSession)
                          print("Set succeeded.")
                      } else {
                          CGCancelDisplayConfiguration(configRef)
                          print("Set failed: \(result)")
                      }
                  }
              } else {
                  print("1337x842 not in advertised mode list, as expected — public API only allows listed modes.")
              }

              // Try setting the largest available advertised mode as a sanity check
              // that we CAN change resolution via public API on this display at all.
              if let largest = modes.max(by: { $0.width * $0.height < $1.width * $1.height }) {
                  print("--- Testing set to largest advertised mode: \(largest.width)x\(largest.height) ---")
                  var config2: CGDisplayConfigRef?
                  if CGBeginDisplayConfiguration(&config2) == .success, let configRef2 = config2 {
                      let result2 = CGConfigureDisplayWithDisplayMode(configRef2, id, largest, nil)
                      if result2 == .success {
                          CGCompleteDisplayConfiguration(configRef2, .forSession)
                          print("Set succeeded. New reported size: \(CGDisplayPixelsWide(id))x\(CGDisplayPixelsHigh(id))")
                      } else {
                          CGCancelDisplayConfiguration(configRef2)
                          print("Set failed: \(result2)")
                      }
                  }
              }
          }
          EOF

      - name: Compile and run display check
        run: |
          swiftc check_display.swift -o check_display
          ./check_display