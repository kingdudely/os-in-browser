name: NW.js Mixed Context Runner Copy

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS to run on"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest

jobs:
  run-nwjs:
    runs-on: ${{ github.event.inputs.os }}
    steps:
      - uses: actions/checkout@main
      - name: Run app
        run: |
          # mkdir /Users/runner/work/os-in-browser/os-in-browser/node_modules/nw/nwjs-v0.113.0-osx-arm64/nwjs.app/Contents/Resources/app.nw
          npx nw .