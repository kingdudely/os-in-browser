name: Generate new fingerprint

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Generate certificate and fingerprint
        run: |
          if [[ -f key.pem && -f certificate.pem && -f public/fingerprint.txt ]]; then
            echo "Already generated"
            exit 0
          fi

          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout key.pem -out certificate.pem \
            -nodes -subj "/CN=WebRTC-Workflow" -days 36500

          openssl x509 -in certificate.pem -noout -fingerprint -sha256 \
            | sed 's/.*=//' > public/fingerprint.txt

      - name: Commit certificate and fingerprint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add certificate.pem key.pem public/fingerprint.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update WebRTC certificate and fingerprint"
          git push

      - name: Upload artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@main