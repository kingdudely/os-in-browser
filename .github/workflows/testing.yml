name: Check FFmpeg Hardware Encoding

on: [push, pull_request, workflow_dispatch]

jobs:
  check-encoders:
    runs-on: windows-latest

    steps:
      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: List Available Compiled Encoders
        run: |
          echo "=== Supported Hardware Encoders built into FFmpeg ==="
          ffmpeg -encoders | Select-String "nvenc|amf|qsv|_mf"

      - name: Test Native Windows Media Foundation Encoding
        id: test_mf
        continue-on-error: true
        run: |
          # Generate a 1-frame dummy canvas and encode it using Media Foundation
          ffmpeg -f lavfi -i color=c=blue:s=320x240:d=0.04 -c:v h264_mf -f null -
          if ($LASTEXITCODE -eq 0) {
            echo "MF_SUPPORTED=true" >> $env:GITHUB_ENV
            echo "✅ Windows Media Foundation (h264_mf) is supported and working!"
          } else {
            echo "MF_SUPPORTED=false" >> $env:GITHUB_ENV
            echo "❌ Windows Media Foundation (h264_mf) failed or is unsupported."
          }

      - name: Test NVIDIA NVENC Encoding
        continue-on-error: true
        run: |
          ffmpeg -f lavfi -i color=c=blue:s=320x240:d=0.04 -c:v h264_nvenc -f null -
          if ($LASTEXITCODE -eq 0) {
            echo "🚀 NVIDIA NVENC is supported and working!"
          } else {
            echo "ℹ️ NVIDIA NVENC not available (Expected on standard GitHub runners)."
          }