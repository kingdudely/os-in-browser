name: Check VideoToolbox Support

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/videotoolbox-check.yml'

jobs:
  check-videotoolbox:
    runs-on: macos-latest
    steps:
      - name: System info
        run: |
          sw_vers
          uname -a
          sysctl -n machdep.cpu.brand_string || true

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: List available hardware encoders
        run: ffmpeg -hide_banner -encoders | grep -i videotoolbox

      - name: List VideoToolbox hwaccels
        run: ffmpeg -hide_banner -hwaccels

      - name: Generate test source
        run: |
          ffmpeg -f lavfi -i testsrc=duration=5:size=1280x720:rate=30 -c:v libx264 -pix_fmt yuv420p source.mp4

      - name: Encode with h264_videotoolbox
        run: |
          ffmpeg -y -i source.mp4 -c:v h264_videotoolbox -b:v 2M out_h264_vt.mp4
          ffprobe -hide_banner out_h264_vt.mp4

      - name: Encode with hevc_videotoolbox
        run: |
          ffmpeg -y -i source.mp4 -c:v hevc_videotoolbox -b:v 2M out_hevc_vt.mp4
          ffprobe -hide_banner out_hevc_vt.mp4

      - name: Confirm hardware acceleration used (verbose log check)
        run: |
          ffmpeg -y -v verbose -i source.mp4 -c:v h264_videotoolbox -b:v 2M out_verbose.mp4 2>&1 | tee vt_log.txt
          echo "---- searching log for videotoolbox confirmation ----"
          grep -i "videotoolbox" vt_log.txt || echo "No explicit VideoToolbox mention found in log"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: videotoolbox-test-outputs
          path: |
            *.mp4
            vt_log.txt