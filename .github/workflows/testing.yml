name: Test Hardware Video Encoders

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Show runner info
        shell: bash
        run: |
          uname -a || true
          echo "OS: $RUNNER_OS"

      - name: Check FFmpeg
        shell: bash
        run: |
          ffmpeg -version
          echo
          echo "=== Hardware acceleration methods ==="
          ffmpeg -hide_banner -hwaccels
          echo
          echo "=== Encoders ==="
          ffmpeg -hide_banner -encoders

      - name: Test Ubuntu VAAPI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e

          ls -l /dev/dri || true

          ffmpeg \
            -f lavfi -i testsrc=size=1280x720:rate=30 \
            -t 1 \
            -vf format=nv12,hwupload \
            -c:v h264_vaapi \
            -f null -

          echo "Exit code: $?"

      - name: Test Windows Media Foundation / QSV / NVENC / AMF
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set +e

          echo "=== h264_nvenc ==="
          ffmpeg -f lavfi -i testsrc -t 1 -c:v h264_nvenc -f null -
          echo "Exit: $?"

          echo
          echo "=== h264_qsv ==="
          ffmpeg -f lavfi -i testsrc -t 1 -c:v h264_qsv -f null -
          echo "Exit: $?"

          echo
          echo "=== h264_amf ==="
          ffmpeg -f lavfi -i testsrc -t 1 -c:v h264_amf -f null -
          echo "Exit: $?"

      - name: Test macOS VideoToolbox
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e

          ffmpeg \
            -f lavfi -i testsrc=size=1280x720:rate=30 \
            -t 1 \
            -c:v h264_videotoolbox \
            -f null -

          echo "Exit code: $?"