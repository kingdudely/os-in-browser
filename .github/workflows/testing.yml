name: Test Ubuntu Hardware Video Encoder

on:
  workflow_dispatch:

jobs:
  test-hw-encoder:
    runs-on: ubuntu-latest

    steps:
      - name: System info
        run: |
          uname -a
          lscpu | grep "Model name" || true

      - name: Install FFmpeg and hardware tools
        run: |
          sudo apt update
          sudo apt install -y \
            ffmpeg \
            vainfo \
            mesa-va-drivers \
            xvfb \
            pciutils

      - name: Start X server
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 6.7
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Check GPU devices
        run: |
          echo "=== /dev/dri ==="
          ls -la /dev/dri || true

          echo
          echo "=== PCI video devices ==="
          lspci | grep -Ei "vga|3d|display" || true

      - name: Check VAAPI
        run: |
          echo "=== VAINFO ==="
          DISPLAY=:99 vainfo || true

      - name: Check FFmpeg hardware support
        run: |
          echo "=== FFmpeg version ==="
          ffmpeg -version

          echo
          echo "=== Hardware acceleration methods ==="
          ffmpeg -hide_banner -hwaccels

          echo
          echo "=== Hardware encoders ==="
          ffmpeg -hide_banner -encoders | grep -E "vaapi|qsv|nvenc|v4l2m2m" || true

      - name: Test VAAPI H264 encoding
        run: |
          set +e

          ffmpeg \
            -vaapi_device /dev/dri/renderD128 \
            -f lavfi \
            -i testsrc=size=1280x720:rate=60 \
            -vf 'format=nv12,hwupload' \
            -c:v h264_vaapi \
            -t 5 \
            -f null -

          echo "VAAPI exit code: $?"

      - name: Test V4L2 H264 encoding
        run: |
          set +e

          ffmpeg \
            -f lavfi \
            -i testsrc=size=1280x720:rate=60 \
            -c:v h264_v4l2m2m \
            -t 5 \
            -f null -

          echo "V4L2 exit code: $?"