name: Verify msys2 shell registration

on:
  workflow_dispatch:

jobs:
  without-setup-action:
    runs-on: windows-latest
    steps:
      - name: Call preinstalled msys2 bash directly by path
        shell: "C:\\msys64\\usr\\bin\\bash.exe -l {0}"
        run: |
          echo "CONFIRMED: preinstalled bash.exe works when called by full path"
          echo "MSYSTEM=$MSYSTEM"
          uname -a
          which gcc || echo "gcc not found (none installed yet, expected)"

      - name: Try shell msys2 {0} without registering it
        id: try_alias
        continue-on-error: true
        shell: msys2 {0}
        run: echo "this should not run"

      - name: Report result
        shell: pwsh
        run: |
          if ("${{ steps.try_alias.outcome }}" -eq "failure") {
            Write-Host "CONFIRMED: bash.exe by path works, but the 'msys2 {0}' shell KEYWORD is not registered without the setup-msys2 action"
          } else {
            Write-Host "UNEXPECTED: shell: msys2 {0} succeeded without setup-msys2 action"
            exit 1
          }

  with-setup-action:
    runs-on: windows-latest
    steps:
      - name: Register msys2 shell
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false

      - name: Try shell msys2 {0} after registering it
        shell: msys2 {0}
        run: |
          echo "MSYSTEM=$MSYSTEM"
          uname -a
          which gcc || echo "gcc not installed (expected, none requested)"

      - name: Report result
        shell: bash
        run: |
          echo "CONFIRMED: shell: msys2 {0} works after setup-msys2 action"