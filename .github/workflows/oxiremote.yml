name: OxiRemote Session

on:
  workflow_dispatch:

jobs:
  remote-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install codec deps
        run: brew install libvpx aom

      - name: Pre-seed database
        run: |
          mkdir -p ~/.oxiremote
          sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT NOT NULL); \
             INSERT INTO settings(key, value) VALUES ('auto_approve', 'true');"

      - name: Start OxiRemote
        env:
          OXI_HEADLESS: "1"
          OXI_SECURE_COOKIES: ""
          OXI_VIDEO_PIPELINE: "auto"
        run: |
          npx oxiremote --auto > /dev/null 2>&1 &
          wget -q --spider --retry-connrefused --waitretry=1 --timeout=5 -t 0 http://127.0.0.1:8787/api/health

          while true; do
            PAIRING_CODE=$(sed -nE 's/.*pairing_code=([A-Z0-9]+).*/\1/p' "${HOME}/.oxiremote/logs/agent.log" | head -1)
            if [ -n "$PAIRING_CODE" ]; then
              echo "Pairing code: $PAIRING_CODE"
              break
            fi

            sleep 1
          done

          wait