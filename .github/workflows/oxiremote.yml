name: OxiRemote Session

on:
  workflow_dispatch:

jobs:
  remote-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install codec deps
        run: brew install libvpx aom

      - name: Pre-seed database
        run: |
          mkdir -p ~/.oxiremote
          sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT NOT NULL); \
             INSERT INTO settings(key, value) VALUES ('auto_approve', 'true');"

      - name: Start OxiRemote
        id: oxiremote
        env:
          OXI_HEADLESS: "1"
          OXI_SECURE_COOKIES: ""
          OXI_VIDEO_PIPELINE: "auto"
        run: |
          npx oxiremote --auto > /tmp/oxiremote.log 2>&1 &
          
          while true; do
            TUNNEL_URL=$(grep -o "https://[a-z0-9-]*\.trycloudflare\.com" /tmp/oxiremote.log | head -1)
            PAIRING_CODE=$(grep -o "pairing_code=[A-Z0-9]*" /tmp/oxiremote.log | head -1 | cut -d= -f2)
            if [ -n "$TUNNEL_URL" ] && [ -n "$PAIRING_CODE" ]; then
              echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
              echo "PAIRING_CODE=$PAIRING_CODE" >> $GITHUB_OUTPUT
              echo "Tunnel URL: $TUNNEL_URL"
              echo "Pairing code: $PAIRING_CODE"
              break
            fi
            sleep 1
          done

      - name: Wait for agent
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/api/health && echo "Agent ready" && break
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Session info
        run: |
          echo "Tunnel URL: ${{ steps.oxiremote.outputs.TUNNEL_URL }}"
          echo "Pairing code: ${{ steps.oxiremote.outputs.PAIRING_CODE }}"
          sleep 21600