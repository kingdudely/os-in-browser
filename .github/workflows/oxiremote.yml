name: OxiRemote Session

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner OS
        type: choice
        options:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        default: macos-latest

jobs:
  remote-session:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360
    env:
      DISPLAY: ":67"
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: latest

      - name: Install MacOS packages
        if: runner.os == 'macOS'
        run: brew install libvpx aom curl sqlite

      - name: Install Linux packages
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: "xvfb lxqt openbox dbus-x11 x11-utils libvpx-dev libaom-dev curl sqlite3 libxdo3"
          version: "1.0"

      - name: Setup Linux desktop
        if: runner.os == 'Linux'
        run: |
          Xvfb "${DISPLAY}" -screen 0 1920x1080x24 &
          until xdpyinfo -display "${DISPLAY}" >/dev/null 2>&1; do sleep 0.67; done
          startlxqt &

      - name: Install Windows packages
        if: runner.os == 'Windows'
        run: choco install curl sqlite -y

      - name: Fix Windows tar
        if: runner.os == 'Windows'
        run: |
          GIT_USR_BIN="$(dirname "$(which git)")/../usr/bin"
          echo "$(realpath "$GIT_USR_BIN")" >> $GITHUB_PATH

      - name: Enable auto-approve
        run: |
          mkdir -p ~/.oxiremote
          sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT NOT NULL); \
             INSERT INTO settings(key, value) VALUES ('auto_approve', 'true');"

      - name: Start OxiRemote
        env:
          OXI_HEADLESS: "1"
          OXI_SECURE_COOKIES: ""
          OXI_VIDEO_PIPELINE: "auto"
        run: |
          npm install -g oxiremote
          oxiremote --auto & # > /tmp/oxiremote.log 2>&1
          until curl -f http://127.0.0.1:8787/api/health; do
            sleep 1
          done

          PAIRING_CODE=$(sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "SELECT code FROM pairing_codes WHERE used_at IS NULL AND expires_at > strftime('%s','now') ORDER BY expires_at DESC LIMIT 1;")
          echo "Pairing code: $PAIRING_CODE"
          echo "Log in URL: https://remote.erai.dev/login"

          wait