name: OxiRemote Session

on:
  workflow_dispatch:

jobs:
  remote-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install codec deps
        run: brew install libvpx aom

      - name: Start OxiRemote
        env:
          OXI_HEADLESS: "1"
          OXI_SECURE_COOKIES: ""
          OXI_VIDEO_PIPELINE: "auto"
        run: |
          # Pre-seed auto_approve so pairing doesn't need manual approval
          mkdir -p ~/.oxiremote
          sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT); \
            INSERT OR REPLACE INTO settings (key, value) VALUES ('auto_approve', 'true');"
          npx oxiremote --auto