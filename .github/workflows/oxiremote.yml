name: OxiRemote Session

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner OS
        type: choice
        options:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        default: macos-latest

jobs:
  remote-session:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup MacOS
        if: runner.os == 'macOS'
        run: brew install libvpx aom

      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && \
          sudo apt install --no-install-recommends \
            ubuntu-desktop-minimal \
            lightdm \
            libvpx-dev \
            libaom-dev && \
          sudo systemctl start lightdm

      - name: Pre-seed database
        run: |
          mkdir -p ~/.oxiremote
          sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT NOT NULL); \
             INSERT INTO settings(key, value) VALUES ('auto_approve', 'true');"

      - name: Start OxiRemote
        env:
          OXI_HEADLESS: "1"
          OXI_SECURE_COOKIES: ""
          OXI_VIDEO_PIPELINE: "auto"
        run: |
          npx oxiremote --auto > /dev/null 2>&1 &
          until curl -sf http://127.0.0.1:8787/api/health > /dev/null; do sleep 0.5; done

          PAIRING_CODE=$(sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "SELECT code FROM pairing_codes WHERE used_at IS NULL AND expires_at > strftime('%s','now') ORDER BY expires_at DESC LIMIT 1;")
          echo "Pairing code: $PAIRING_CODE"
          echo "Log in URL: https://remote.erai.dev/login"

          wait