name: OxiRemote Session

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner OS
        type: choice
        options:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        default: macos-latest

jobs:
  remote-session:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Setup macOS
        if: runner.os == 'macOS'
        run: brew install libvpx aom wget sqlite

      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends -y \
            ubuntu-desktop-minimal \
            lightdm \
            libvpx-dev \
            libaom-dev \
            wget \
            sqlite3 && \
          sudo systemctl start lightdm

      - name: Setup Windows
        if: runner.os == 'Windows'
        run: choco install wget sqlite -y

      - name: Pre-seed database
        run: |
          mkdir -p ~/.oxiremote
          sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT NOT NULL); \
             INSERT INTO settings(key, value) VALUES ('auto_approve', 'true');"

      - name: Start OxiRemote
        env:
          OXI_HEADLESS: "1"
          OXI_SECURE_COOKIES: ""
          OXI_VIDEO_PIPELINE: "auto"
        run: |
          npx oxiremote --auto > /dev/null 2>&1 &

          PAIRING_CODE=$(sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "SELECT code FROM pairing_codes WHERE used_at IS NULL AND expires_at > strftime('%s','now') ORDER BY expires_at DESC LIMIT 1;")
          echo "Pairing code: $PAIRING_CODE"
          echo "Log in URL: https://remote.erai.dev/login"

          wait