name: OxiRemote Session

on:
  workflow_dispatch:

jobs:
  remote-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install codec deps
        run: brew install libvpx aom

      - name: Pre-seed database
        run: |
          mkdir -p ~/.oxiremote
          sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT NOT NULL); \
             INSERT INTO settings(key, value) VALUES ('auto_approve', 'true');"

      - name: Start OxiRemote
        env:
          OXI_HEADLESS: "1"
          OXI_SECURE_COOKIES: ""
          OXI_VIDEO_PIPELINE: "auto"
        run: |
          npx oxiremote --auto 2>&1 &

          wget -q --spider --retry-connrefused --waitretry=1 --timeout=5 -t 0 http://127.0.0.1:8787/api/health

          # Mint a one-time key
          OTK=$(curl -s -X POST http://127.0.0.1:8787/api/agent/keys/one-time | grep -oE '"token":"[^"]+' | cut -d'"' -f4)

          # Tunnel URL from agent state
          curl -s http://127.0.0.1:8787/api/agent/state
          TUNNEL_URL=$(curl -s http://127.0.0.1:8787/api/agent/state | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | head -1)

          echo "Tunnel URL: $TUNNEL_URL"
          echo "One time key: $OTK"

          wait