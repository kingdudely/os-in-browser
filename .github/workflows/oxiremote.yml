name: OxiRemote Session

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runner OS"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - macos-latest
          - ubuntu-latest
          - windows-latest
      timeout_minutes:
        description: "How long to keep the session alive (minutes)"
        required: false
        default: "60"
      video_pipeline:
        description: "Video pipeline (auto | h264 | vp9 | av1 | jpeg)"
        required: false
        default: "auto"

jobs:
  remote-session:
    name: Remote Desktop Session
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ fromJson(inputs.timeout_minutes) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Install codec deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libvpx aom

      - name: Install codec deps + Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvpx-dev libaom-dev xvfb openbox
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          openbox &

      - name: Start OxiRemote
        env:
          OXI_HEADLESS: "1"
          OXI_SECURE_COOKIES: "1"
          OXI_VIDEO_PIPELINE: ${{ inputs.video_pipeline }}
        run: |
          npx oxiremote --auto > /tmp/oxiremote.log 2>&1 &

          # Wait for HTTP server (up to 60 s)
          echo "Waiting for agent..."
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/api/health > /dev/null 2>&1 && break
            [ $i -eq 30 ] && { echo "Agent failed to start. Log:"; cat /tmp/oxiremote.log; exit 1; }
            sleep 2
          done

          # Enable auto-approve
          curl -sf -X POST http://127.0.0.1:8787/api/agent/settings \
            -H 'Content-Type: application/json' \
            -d '{"auto_approve": true}'

          # Wait for tunnel URL
          echo "Waiting for tunnel URL..."
          until TUNNEL_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/oxiremote.log | head -1) && [ -n "$TUNNEL_URL" ]; do
            sleep 2
          done

          # Wait for pairing code
          echo "Waiting for pairing code..."
          until PAIRING_CODE=$(grep -oiE 'pairing code[: ]+([A-Z0-9]{8})' /tmp/oxiremote.log | grep -oE '[A-Z0-9]{8}' | head -1) && [ -n "$PAIRING_CODE" ]; do
            sleep 2
          done

          echo ""
          echo "============================================================"
          echo "  SESSION READY"
          echo "  OS      : $RUNNER_OS"
          echo "  URL     : $TUNNEL_URL"
          echo "  PAIRING : $PAIRING_CODE"
          echo "  CODEC   : ${{ inputs.video_pipeline }}"
          echo "============================================================"

          sleep 21600