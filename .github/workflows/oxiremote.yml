name: OxiRemote Session

on:
  workflow_dispatch:

jobs:
  remote-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install codec deps
        run: brew install libvpx aom

      - name: Pre-seed database
        run: |
          mkdir -p ~/.oxiremote
          sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT NOT NULL); \
             INSERT INTO settings(key, value) VALUES ('auto_approve', 'true');"

      - name: Start OxiRemote
        env:
          OXI_HEADLESS: "1"
          OXI_SECURE_COOKIES: ""
          OXI_VIDEO_PIPELINE: "auto"
        run: |
          npx oxiremote --auto > /tmp/oxiremote.log 2>&1 &

          wget -q --spider --retry-connrefused --waitretry=1 --timeout=5 -t 0 http://127.0.0.1:8787/api/health

          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/oxiremote.log | head -1)

          PAIRING_CODE=$(curl -s http://127.0.0.1:8787/api/pairing/code 2>/dev/null | grep -oP '"code"\s*:\s*"\K[^"]+' || true)
          
          # Fallback to log parsing if API doesn't have that endpoint
          if [ -z "$PAIRING_CODE" ]; then
            PAIRING_CODE=$(cat /tmp/oxiremote.log | tr -d '\000-\010\013\014\016-\037' | grep -oP 'pairing_code=\K[A-Z0-9]+' | head -1)
          fi

          echo "Tunnel URL: $TUNNEL_URL"
          echo "Pairing code: $PAIRING_CODE"
          wait