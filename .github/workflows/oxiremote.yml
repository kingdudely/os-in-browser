name: OxiRemote Session

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner OS
        type: choice
        options:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        default: macos-latest

jobs:
  remote-session:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: latest

      - name: Install MacOS packages
        if: runner.os == 'macOS'
        run: brew install libvpx aom wget sqlite

      - name: Install Linux packages
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: "xvfb lxqt openbox dbus-x11 libvpx-dev libaom-dev curl wget sqlite3"
          version: "1.0"

      - name: Setup Linux desktop
        if: runner.os == 'Linux'
        run: |
          Xvfb :67 -screen 0 1920x1080x24 &
          echo "DISPLAY=:67" >> $GITHUB_ENV
          startlxqt &

      - name: Install Windows packages
        if: runner.os == 'Windows'
        run: choco install wget sqlite -y

      - name: Enable auto-approve
        run: |
          mkdir -p ~/.oxiremote
          sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT NOT NULL); \
             INSERT INTO settings(key, value) VALUES ('auto_approve', 'true');"

      - name: Start OxiRemote
        env:
          OXI_HEADLESS: "1"
          OXI_SECURE_COOKIES: ""
          OXI_VIDEO_PIPELINE: "auto"
        run: |
          npx oxiremote --auto > /dev/null 2>&1 &
          wget -q --spider --retry-connrefused --waitretry=1 --timeout=5 -t 0 http://127.0.0.1:8787/api/health

          PAIRING_CODE=$(sqlite3 ~/.oxiremote/oxiremote.sqlite \
            "SELECT code FROM pairing_codes WHERE used_at IS NULL AND expires_at > strftime('%s','now') ORDER BY expires_at DESC LIMIT 1;")
          echo "Pairing code: $PAIRING_CODE"
          echo "Log in URL: https://remote.erai.dev/login"

          wait