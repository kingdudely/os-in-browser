on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: echo '{"result":"hello world"}' > output.json
      - uses: actions/upload-artifact@v7
        with:
          path: output.json
          archive: false
      - run: |
          echo "The build was deployed successfully to production." >> $GITHUB_STEP_SUMMARY
          sleep infinity