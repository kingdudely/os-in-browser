name: WebTransport via Cloudflared Signaling

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap
          pip install "aioquic>=0.9.20" cryptography aiohttp

      - name: Generate self-signed cert
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout key.pem -out cert.pem -days 1 -nodes -subj "/CN=wt-test"

      - name: Install cloudflared
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Start cloudflared tunnel
        run: |
          timeout 1800 cloudflared tunnel --url http://localhost:8080 --no-autoupdate 2>&1 | tee tunnel.log &
          TUNNEL_PID=$!
          
          # Wait for tunnel URL to appear
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*trycloudflare.com' tunnel.log | head -n1)
            if [ -n "$URL" ]; then
              echo "::notice title=Click to test::$URL"
              break
            fi
            sleep 1
          done

      - name: Run server with cloudflared + WebTransport
        run: |
          python3 -u << 'PYEOF'
          import asyncio, socket, subprocess, base64, hashlib, sys, os
          from aiohttp import web
          from aioquic.asyncio.protocol import QuicConnectionProtocol
          from aioquic.asyncio.server import QuicServer
          from aioquic.quic.configuration import QuicConfiguration
          from aioquic.h3.connection import H3_ALPN, H3Connection
          from aioquic.h3.events import HeadersReceived, WebTransportStreamDataReceived, DatagramReceived
          from cryptography import x509
          from cryptography.hazmat.primitives.serialization import Encoding

          LOCAL_HTTP_PORT = 8080
          LOCAL_QUIC_PORT = 45000
          STUN_SERVER = ("stun.l.google.com", 19302)

          # Shared state
          server_state = {
              "client_ip": None,
              "client_port": None,
              "pub_ip": None,
              "pub_port": None,
          }

          def get_stun_mapping(sock):
              sock.settimeout(5)
              stun_req = bytes.fromhex("0001000000000000000000000000000000000000")
              try:
                  sock.sendto(stun_req, STUN_SERVER)
                  data, _ = sock.recvfrom(2048)
                  magic = 0x2112a442
                  xor_port = int.from_bytes(data[28:30], 'big') ^ (magic >> 16)
                  xor_ip = data[24:28]
                  ip_bytes = bytes(a ^ b for a, b in zip(xor_ip, magic.to_bytes(4, 'big')))
                  pub_ip = '.'.join(map(str, ip_bytes))
                  sock.setblocking(False)
                  sock.settimeout(None)
                  return pub_ip, xor_port
              except Exception as e:
                  print(f"[!] STUN failed: {e}")
                  return None, None

          def make_bound_socket(port):
              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              sock.bind(("0.0.0.0", port))
              return sock

          async def punch_once(ip, port, local_port):
              try:
                  proc = await asyncio.create_subprocess_exec(
                      "sudo", "nping", "--udp", "-c", "1", "--quiet",
                      "--source-port", str(local_port),
                      "--dest-port", str(port),
                      "--data-string", "punch",
                      ip,
                      stdout=asyncio.subprocess.DEVNULL,
                      stderr=asyncio.subprocess.DEVNULL,
                  )
                  await proc.wait()
              except Exception as e:
                  print(f"[!] punch failed: {e}")

          async def punch_loop(client_ip, client_port, local_port):
              while True:
                  if client_ip and client_port:
                      await punch_once(client_ip, client_port, local_port)
                  await asyncio.sleep(28)

          class H3Protocol(QuicConnectionProtocol):
              def __init__(self, *a, **kw):
                  super().__init__(*a, **kw)
                  self._http = H3Connection(self._quic, enable_webtransport=True)

              def quic_event_received(self, event):
                  for e in self._http.handle_event(event):
                      if isinstance(e, HeadersReceived):
                          headers = dict(e.headers)
                          if headers.get(b":method") == b"CONNECT" and headers.get(b":protocol") == b"webtransport":
                              self._http.send_headers(e.stream_id, [(b":status", b"200")])
                              print(f"[+] WebTransport session opened")
                          else:
                              self._http.send_headers(e.stream_id, [(b":status", b"404")], end_stream=True)
                      elif isinstance(e, WebTransportStreamDataReceived):
                          msg = e.data.decode('utf-8', errors='ignore')
                          print(f"[+] stream: {msg}")
                          self._http.send_data(e.stream_id, f"echo:{msg}".encode(), end_stream=False)
                      elif isinstance(e, DatagramReceived):
                          msg = e.data.decode('utf-8', errors='ignore')
                          print(f"[+] dgram: {msg}")
                          self._http.send_datagram(e.stream_id, f"echo:{msg}".encode())
                  self.transmit()

          def cert_sha256():
              with open("cert.pem", "rb") as f:
                  cert = x509.load_pem_x509_certificate(f.read())
              h = hashlib.sha256(cert.public_bytes(Encoding.DER)).digest()
              return base64.b64encode(h).decode()

          # HTTP handlers for signaling
          async def handle_client_register(request):
              """Client sends its STUN-discovered IP/port"""
              data = await request.json()
              server_state["client_ip"] = data.get("ip")
              server_state["client_port"] = data.get("port")
              print(f"[+] Client registered: {server_state['client_ip']}:{server_state['client_port']}")
              return web.json_response({
                  "server_ip": server_state["pub_ip"],
                  "server_port": server_state["pub_port"],
                  "cert_hash": cert_sha256()
              })

          async def handle_status(request):
              """Client checks if server is ready"""
              return web.json_response({
                  "ready": bool(server_state["pub_ip"]),
                  "server_ip": server_state["pub_ip"],
                  "server_port": server_state["pub_port"],
                  "cert_hash": cert_sha256()
              })

          HTML_CLIENT = """<!DOCTYPE html>
          <html>
          <head>
            <title>WebTransport NAT Test</title>
            <style>
              body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
              .log { background: #252526; padding: 10px; margin: 20px 0; border-radius: 4px; max-height: 400px; overflow-y: auto; }
              .ok { color: #4ec9b0; }
              .err { color: #f48771; }
            </style>
          </head>
          <body>
            <h2>WebTransport NAT Hole-Punch Test</h2>
            <div class="log" id="log"></div>

            <script>
              const log = (msg, type = 'info') => {
                const div = document.getElementById('log');
                const line = document.createElement('div');
                line.className = type;
                line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                div.appendChild(line);
                div.scrollTop = div.scrollHeight;
              };

              async function runTest() {
                try {
                  // Step 1: Discover client's public IP/port via STUN
                  log('Discovering your public IP/port via STUN...', 'info');
                  const sock = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                  sock.createDataChannel('probe');
                  
                  let clientIP = null, clientPort = null;
                  const stun = new Promise((resolve, reject) => {
                    sock.onicecandidate = e => {
                      if (!e.candidate) {
                        sock.close();
                        if (clientIP) resolve([clientIP, clientPort]);
                        else reject(new Error('No STUN candidate'));
                        return;
                      }
                      if (e.candidate.type === 'srflx' && e.candidate.address.includes('.')) {
                        clientIP = e.candidate.address;
                        clientPort = e.candidate.port;
                      }
                    };
                    sock.createOffer().then(o => sock.setLocalDescription(o));
                    setTimeout(() => reject(new Error('STUN timeout')), 8000);
                  });

                  [clientIP, clientPort] = await stun;
                  log(`✓ Your public: ${clientIP}:${clientPort}`, 'ok');

                  // Step 2: Tell server about your IP/port
                  log('Registering with server...', 'info');
                  const regResp = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: clientIP, port: clientPort })
                  });
                  const serverInfo = await regResp.json();
                  log(`✓ Server: ${serverInfo.server_ip}:${serverInfo.server_port}`, 'ok');

                  // Step 3: Wait for server to start hole-punching
                  log('Waiting for server to start punching...', 'info');
                  await new Promise(r => setTimeout(r, 2000));

                  // Step 4: Connect via WebTransport to server's public IP/port
                  log('Connecting via WebTransport...', 'info');
                  const digest = Uint8Array.from(atob(serverInfo.cert_hash), c => c.charCodeAt(0));
                  const wt = new WebTransport(`https://${serverInfo.server_ip}:${serverInfo.server_port}/wt`, {
                    serverCertificateHashes: [{ algorithm: 'sha-256', digest }]
                  });

                  await Promise.race([
                    wt.ready,
                    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))
                  ]);
                  log('✓ WebTransport connected!', 'ok');

                  // Step 5: Test bidirectional stream
                  log('Testing stream...', 'info');
                  const stream = await wt.createBidirectionalStream();
                  const w = stream.writable.getWriter();
                  const r = stream.readable.getReader();
                  await w.write(new TextEncoder().encode('test-stream'));
                  const { value } = await r.read();
                  log(`> ${new TextDecoder().decode(value)}`, 'ok');

                  // Step 6: Test datagram
                  log('Testing datagram...', 'info');
                  const dw = wt.datagrams.writable.getWriter();
                  const dr = wt.datagrams.readable.getReader();
                  await dw.write(new TextEncoder().encode('test-dgram'));
                  const { value: dv } = await dr.read();
                  log(`> ${new TextDecoder().decode(dv)}`, 'ok');

                  log('✓✓ TEST PASSED ✓✓', 'ok');
                  wt.close();
                } catch (e) {
                  log(`Error: ${e.message}`, 'err');
                  console.error(e);
                }
              }

              // Auto-start test
              log('Page loaded, starting test...', 'info');
              runTest();
            </script>
          </body>
          </html>"""

          async def handle_root(request):
              return web.Response(text=HTML_CLIENT, content_type='text/html')

          async def main():
              # Get STUN mapping for QUIC server
              quic_sock = make_bound_socket(LOCAL_QUIC_PORT)
              print("[+] Discovering STUN mapping...")
              pub_ip, pub_port = get_stun_mapping(quic_sock)
              if not pub_ip:
                  print("[!] STUN failed")
                  sys.exit(1)
              
              server_state["pub_ip"] = pub_ip
              server_state["pub_port"] = pub_port
              print(f"[+] Server public: {pub_ip}:{pub_port}")

              # Start hole-punch loop
              asyncio.create_task(punch_loop(None, None, LOCAL_QUIC_PORT))

              # Start QUIC server
              quic_config = QuicConfiguration(alpn_protocols=H3_ALPN, is_client=False)
              quic_config.load_cert_chain("cert.pem", "key.pem")

              loop = asyncio.get_event_loop()
              await loop.create_datagram_endpoint(
                  lambda: QuicServer(configuration=quic_config, create_protocol=H3Protocol),
                  sock=quic_sock,
              )
              print(f"[+] QUIC listening on 0.0.0.0:{LOCAL_QUIC_PORT}")

              # Start HTTP signaling server
              app = web.Application()
              app.router.add_get('/', handle_root)
              app.router.add_post('/register', handle_client_register)
              app.router.add_get('/status', handle_status)
              
              runner = web.AppRunner(app)
              await runner.setup()
              site = web.TCPSite(runner, '0.0.0.0', LOCAL_HTTP_PORT)
              await site.start()
              print(f"[+] HTTP signaling on 0.0.0.0:{LOCAL_HTTP_PORT}")
              print(f"\n[+] Cloudflared tunnel starting...\n")

              await asyncio.Event().wait()

          asyncio.run(main())
          PYEOF