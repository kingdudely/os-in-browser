name: WebTransport NAT Hole-Punch Test

on:
  workflow_dispatch:
    inputs:
      client_ip:
        description: 'Your public IP (run: curl ifconfig.me)'
        required: true
      client_port:
        description: 'Your public UDP port (run: stun-client stun.l.google.com)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap
          pip install "aioquic>=0.9.20" cryptography

      - name: Generate self-signed cert
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout key.pem -out cert.pem -days 1 -nodes -subj "/CN=wt-test"

      - name: Get STUN public IP and run server
        env:
          CLIENT_IP: ${{ github.event.inputs.client_ip }}
          CLIENT_PORT: ${{ github.event.inputs.client_port }}
        run: python3 << 'PYEOF'
import asyncio, socket, subprocess, base64, hashlib, sys, os
from aioquic.asyncio.protocol import QuicConnectionProtocol
from aioquic.asyncio.server import QuicServer
from aioquic.quic.configuration import QuicConfiguration
from aioquic.h3.connection import H3_ALPN, H3Connection
from aioquic.h3.events import HeadersReceived, WebTransportStreamDataReceived, DatagramReceived
from cryptography import x509
from cryptography.hazmat.primitives.serialization import Encoding

LOCAL_PORT = 45000
STUN_SERVER = ("stun.l.google.com", 19302)

def get_stun_mapping(sock):
    sock.settimeout(5)
    stun_req = bytes.fromhex("0001000000000000000000000000000000000000")
    try:
        sock.sendto(stun_req, STUN_SERVER)
        data, _ = sock.recvfrom(2048)
        magic = 0x2112a442
        xor_port = int.from_bytes(data[28:30], 'big') ^ (magic >> 16)
        xor_ip = data[24:28]
        ip_bytes = bytes(a ^ b for a, b in zip(xor_ip, magic.to_bytes(4, 'big')))
        pub_ip = '.'.join(map(str, ip_bytes))
        sock.setblocking(False)
        sock.settimeout(None)
        return pub_ip, xor_port
    except Exception as e:
        print(f"[!] STUN failed: {e}")
        return None, None

def make_bound_socket(port):
    sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
    sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    sock.bind(("0.0.0.0", port))
    return sock

async def punch_once(ip, port, local_port):
    try:
        proc = await asyncio.create_subprocess_exec(
            "sudo", "nping", "--udp", "-c", "1", "--quiet",
            "--source-port", str(local_port),
            "--dest-port", str(port),
            "--data-string", "punch",
            ip,
            stdout=asyncio.subprocess.DEVNULL,
            stderr=asyncio.subprocess.DEVNULL,
        )
        await proc.wait()
    except Exception as e:
        print(f"[!] punch failed: {e}")

async def punch_loop(client_ip, client_port, local_port):
    while True:
        await punch_once(client_ip, client_port, local_port)
        await asyncio.sleep(28)

class H3Protocol(QuicConnectionProtocol):
    def __init__(self, *a, **kw):
        super().__init__(*a, **kw)
        self._http = H3Connection(self._quic, enable_webtransport=True)

    def quic_event_received(self, event):
        for e in self._http.handle_event(event):
            if isinstance(e, HeadersReceived):
                headers = dict(e.headers)
                if headers.get(b":method") == b"CONNECT" and headers.get(b":protocol") == b"webtransport":
                    self._http.send_headers(e.stream_id, [(b":status", b"200")])
                    print(f"[+] WebTransport session opened on stream {e.stream_id}")
                else:
                    self._http.send_headers(e.stream_id, [(b":status", b"404")], end_stream=True)
            elif isinstance(e, WebTransportStreamDataReceived):
                msg = e.data.decode('utf-8', errors='ignore')
                print(f"[+] stream data: {msg}")
                self._http.send_data(e.stream_id, f"echo:{msg}".encode(), end_stream=False)
            elif isinstance(e, DatagramReceived):
                msg = e.data.decode('utf-8', errors='ignore')
                print(f"[+] datagram: {msg}")
                self._http.send_datagram(e.stream_id, f"echo:{msg}".encode())
        self.transmit()

def cert_sha256():
    with open("cert.pem", "rb") as f:
        cert = x509.load_pem_x509_certificate(f.read())
    h = hashlib.sha256(cert.public_bytes(Encoding.DER)).digest()
    return base64.b64encode(h).decode()

async def main():
    client_ip = os.environ['CLIENT_IP']
    client_port = int(os.environ['CLIENT_PORT'])

    sock = make_bound_socket(LOCAL_PORT)
    print("[+] Getting NAT mapping via STUN...")
    pub_ip, pub_port = get_stun_mapping(sock)
    if not pub_ip:
        print("[!] STUN failed")
        sys.exit(1)
    print(f"[+] Server public: {pub_ip}:{pub_port}")

    asyncio.create_task(punch_loop(client_ip, client_port, LOCAL_PORT))

    quic_config = QuicConfiguration(alpn_protocols=H3_ALPN, is_client=False)
    quic_config.load_cert_chain("cert.pem", "key.pem")

    loop = asyncio.get_event_loop()
    await loop.create_datagram_endpoint(
        lambda: QuicServer(configuration=quic_config, create_protocol=H3Protocol),
        sock=sock,
    )
    print(f"[+] QUIC listening on 0.0.0.0:{LOCAL_PORT}")
    print(f"\n==== SERVER INFO ====")
    print(f"Server IP: {pub_ip}")
    print(f"Server Port: {pub_port}")
    print(f"Cert Hash: {cert_sha256()}")
    print(f"====\n")
    print(f"[*] Punching holes to {client_ip}:{client_port} every 28s...")
    await asyncio.Event().wait()

asyncio.run(main())
PYEOF
