name: Publish to GitHub Pages

on:
  push:
    paths:
      - 'public/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@main

      - uses: actions/upload-pages-artifact@main
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@main