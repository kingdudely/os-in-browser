name: 9remote

on:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        description: 'Operating system'
        options:
        - ubuntu
        - windows
        - macos
        default: ubuntu
        required: true

jobs:
  vm:
    runs-on: ${{ github.event.inputs.os }}-latest
    timeout-minutes: 360

    steps:
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run 9remote
        shell: bash
        run: npx --yes 9remote start
