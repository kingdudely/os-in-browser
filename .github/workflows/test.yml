name: Browser Console

on: [push]

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - name: Browser console via pipe
        run: |
          coproc CHROME (google-chrome --remote-debugging-pipe --headless=new \
            --no-first-run --disable-gpu --no-sandbox \
            --user-data-dir=/tmp/chrome-dbg 2>/dev/null)

          sleep 2

          send() { printf '%s\0' "$1" >&${CHROME[1]}; }

          while IFS= read -r -d $'\0' msg; do
            echo "RAW: $msg"
          done <&${CHROME[0]} &

          send '{"id":1,"method":"Runtime.enable","params":{}}'
          sleep 0.3
          send '{"id":2,"method":"Runtime.evaluate","params":{"expression":"console.log(\"Hello World\")"}}'

          sleep 3
          kill $CHROME_PID 2>/dev/null