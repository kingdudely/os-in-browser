name: Remote Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ubuntu
      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libx264-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxtst-dev \
            xvfb

      - name: Configure Ubuntu
        if: runner.os == 'Linux'
        run: cmake -S . -B build

      - name: Build Ubuntu
        if: runner.os == 'Linux'
        run: cmake --build build --parallel

      - name: Test Ubuntu
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/remote-desktop

      # macOS
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config x264

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build

      - name: Build macOS
        if: runner.os == 'macOS'
        run: cmake --build build --parallel

      - name: Test macOS
        if: runner.os == 'macOS'
        run: ./build/remote-desktop

      # Windows
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-x264

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Test Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./build/remote-desktop.exe