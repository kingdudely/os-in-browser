name: Browser Console

on: [push]

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - name: Launch Chrome and forward console.log
        run: |
          mkfifo /tmp/cdp.in /tmp/cdp.out

          google-chrome --remote-debugging-pipe --headless=new --no-first-run \
            --user-data-dir=/tmp/chrome-dbg 3</tmp/cdp.in 4>/tmp/cdp.out &

          sleep 1

          send() { printf '%s\0' "$1" > /tmp/cdp.in; }

          while IFS= read -r -d $'\0' msg; do
            if echo "$msg" | grep -q "consoleAPICalled"; then
              text=$(echo "$msg" | grep -o '"value":"[^"]*"' | head -1 | cut -d'"' -f4)
              echo "BROWSER: $text"
            fi
          done < /tmp/cdp.out &

          send '{"id":1,"method":"Runtime.enable","params":{}}'
          sleep 0.3
          send '{"id":2,"method":"Runtime.evaluate","params":{"expression":"console.log(\"Hello World\")"}}'

          sleep 1
          kill %1 2>/dev/null
          rm -f /tmp/cdp.in /tmp/cdp.out