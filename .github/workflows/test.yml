name: Remote Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Windows
      #
      # MSYS2 is already installed on the GitHub runner.
      # ============================================================

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      # ============================================================
      # Ubuntu dependencies
      #
      # Build tools are already installed on ubuntu-latest.
      # ============================================================

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxtst-dev \
            xvfb

      # ============================================================
      # x264 - Linux / macOS
      # ============================================================

      - name: Build x264
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264

          ./configure \
            --prefix="$HOME/x264" \
            --enable-static \
            --disable-cli

          make
          make install

      # ============================================================
      # x264 - Windows
      # ============================================================

      - name: Build x264 - Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264

          ./configure \
            --prefix="$HOME/x264" \
            --enable-static \
            --disable-cli

          make
          make install

      # ============================================================
      # Configure - Linux / macOS
      # ============================================================

      - name: Configure
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH="$HOME/x264"

      # ============================================================
      # Configure - Windows
      # ============================================================

      - name: Configure - Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$HOME/x264"

      # ============================================================
      # Build - Linux / macOS
      # ============================================================

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      # ============================================================
      # Build - Windows
      # ============================================================

      - name: Build - Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      # ============================================================
      # Test - Ubuntu
      # ============================================================

      - name: Test - Ubuntu
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./build/remote-desktop

      # ============================================================
      # Test - macOS
      # ============================================================

      - name: Test - macOS
        if: runner.os == 'macOS'
        run: |
          ./build/remote-desktop

      # ============================================================
      # Test - Windows
      # ============================================================

      - name: Test - Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ./build/remote-desktop.exe