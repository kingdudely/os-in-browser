name: Browser Console

on: [push]

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - name: Browser console via pipe
        run: |
          #!/usr/bin/env bash

          IN=/tmp/in OUT=/tmp/out
          mkfifo $IN $OUT 2>/dev/null
          exec 3<>$IN 4<>$OUT

          google-chrome --remote-debugging-pipe --headless=new \
            --no-first-run --disable-gpu --no-sandbox \
            --disable-extensions --disable-default-apps \
            --disable-background-networking \
            --user-data-dir=/tmp/chrome 2>/dev/null 3<&3 4>&4 &

          CHROME_PID=$!
          SID=""
          MSG_ID=4

          send() { printf '%s\0' "$1" >&3; }

          # Bootstrap: get page target and attach
          while IFS= read -r -d $'\0' msg; do
            if echo "$msg" | grep -q '"id":1'; then
              TID=$(echo "$msg" | grep -o '"targetId":"[^"]*","type":"page"' | cut -d'"' -f4)
              send "{\"id\":2,\"method\":\"Target.attachToTarget\",\"params\":{\"targetId\":\"$TID\",\"flatten\":true}}"
            fi
            if echo "$msg" | grep -q '"id":2' && [ -z "$SID" ]; then
              SID=$(echo "$msg" | grep -o '"sessionId":"[^"]*"' | head -1 | cut -d'"' -f4)
              send "{\"id\":3,\"sessionId\":\"$SID\",\"method\":\"Runtime.enable\",\"params\":{}}"
              break
            fi
          done <&4 &
          READER_PID=$!

          sleep 0.5
          send '{"id":1,"method":"Target.getTargets","params":{}}'
          sleep 1
          kill $READER_PID 2>/dev/null

          # API: run JS in Chrome
          run_js() {
            local code="$1"
            MSG_ID=$((MSG_ID + 1))
            local id=$MSG_ID
            local result=""

            # Start reader for this call
            while IFS= read -r -d $'\0' msg; do
              if echo "$msg" | grep -q "\"id\":$id"; then
                result=$(echo "$msg" | grep -o '"value":[^,}]*' | head -1 | cut -d: -f2 | tr -d '"')
                break
              fi
            done <&4 &
            READER_PID=$!

            send "{\"id\":$id,\"sessionId\":\"$SID\",\"method\":\"Runtime.evaluate\",\"params\":{\"expression\":\"$code\",\"returnByValue\":true}}"
            sleep 0.3
            kill $READER_PID 2>/dev/null
            echo "$result"
          }

          # ── Usage ─────────────────────────────────────────────────────────────────────
          echo "Chrome ready. Running JS..."

          run_js "1 + 1"
          run_js "document.title"
          run_js "navigator.userAgent"
          run_js "console.log('Hello World'); 'done'"

          # cleanup
          kill $CHROME_PID 2>/dev/null
          rm -f $IN $OUT