name: Remote Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Windows / MSYS2
      # ============================================================

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            nasm
            pkgconf
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # ============================================================
      # Ubuntu dependencies
      # ============================================================

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            nasm \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxtst-dev \
            xvfb

      # ============================================================
      # macOS dependencies
      # ============================================================

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install nasm

      # ============================================================
      # Build x264 - Linux/macOS
      # ============================================================

      - name: Build x264
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git

          cd x264

          ./configure \
            --prefix="$HOME/x264" \
            --enable-static \
            --disable-cli

          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

          make install

      # ============================================================
      # Build x264 - Windows
      # ============================================================

      - name: Build x264 - Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git

          cd x264

          ./configure \
            --prefix="$HOME/x264" \
            --enable-static \
            --disable-cli

          make -j"$(nproc)"

          make install

      # ============================================================
      # Configure - Linux/macOS
      # ============================================================

      - name: Configure
        if: runner.os != 'Windows'
        run: |
          export PKG_CONFIG_PATH="$HOME/x264/lib/pkgconfig:$PKG_CONFIG_PATH"

          cmake \
            -S . \
            -B build

      # ============================================================
      # Configure - Windows
      # ============================================================

      - name: Configure - Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="$HOME/x264/lib/pkgconfig:$PKG_CONFIG_PATH"

          cmake \
            -S . \
            -B build \
            -G Ninja

      # ============================================================
      # Build - Linux/macOS
      # ============================================================

      - name: Build
        if: runner.os != 'Windows'
        run: |
          cmake --build build --parallel

      # ============================================================
      # Build - Windows
      # ============================================================

      - name: Build - Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --build build --parallel -DCMAKE_C_FLAGS=-D__USE_MINGW_ANSI_STDIO=1

      # ============================================================
      # Test - Ubuntu
      # ============================================================

      - name: Test - Ubuntu
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./build/remote-desktop

      # ============================================================
      # Test - macOS
      # ============================================================

      - name: Test - macOS
        if: runner.os == 'macOS'
        run: |
          ./build/remote-desktop

      # ============================================================
      # Test - Windows
      # ============================================================

      - name: Test - Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ./build/remote-desktop.exe