name: Browser Console

on: [push]

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - name: Check Chrome exists
        run: google-chrome --version

      - name: Test pipe
        run: |
          IN=/tmp/cdp.in
          OUT=/tmp/cdp.out

          mkfifo $IN $OUT
          exec 3>$IN

          google-chrome --remote-debugging-pipe --headless=new --no-first-run \
            --disable-gpu --no-sandbox \
            --user-data-dir=/tmp/chrome-dbg 3<$IN 4>$OUT 2>&1 &

          echo "Chrome PID: $!"
          sleep 3
          echo "Reading from pipe..."
          timeout 5 cat $OUT | xxd | head -20 || echo "Nothing came out of pipe"

          exec 3>&-
          rm -f $IN $OUT