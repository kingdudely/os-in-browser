name: Remote Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Xmake
      # ============================================================

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # ============================================================
      # Linux
      # ============================================================

      - name: Install dependencies - Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxtst-dev \
            xvfb

      # ============================================================
      # Configure
      # ============================================================

      - name: Configure - Windows
        if: runner.os == 'Windows'
        run: |
          xmake f \
            -p windows \
            -a x64 \
            -m release \
            --toolchain=msvc \
            -y

      - name: Configure - Linux/macOS
        if: runner.os != 'Windows'
        run: |
          xmake f \
            -m release \
            -y

      # ============================================================
      # Build
      # ============================================================

      - name: Build
        run: |
          xmake -y

      # ============================================================
      # Test - Linux
      # ============================================================

      - name: Test - Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a xmake run remote-desktop

      # ============================================================
      # Test - macOS
      # ============================================================

      - name: Test - macOS
        if: runner.os == 'macOS'
        run: |
          xmake run remote-desktop

      # ============================================================
      # Test - Windows
      # ============================================================

      - name: Test - Windows
        if: runner.os == 'Windows'
        run: |
          xmake run remote-desktop