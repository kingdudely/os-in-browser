name: Build WebRTC Libraries

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies - Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            libssl-dev \
            libsrtp2-dev \
            libusrsctp-dev

      - name: Install dependencies - macOS
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja openssl@3 srtp libusrsctp mbedtls

      - name: Install dependencies - Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install cmake ninja -y

      # ------------------------------------------------------------
      # libpeer
      # ------------------------------------------------------------

      - name: Clone libpeer
        run: |
          git clone --recursive https://github.com/sepfy/libpeer.git

      - name: Build libpeer
        working-directory: libpeer
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DBUILD_TESTING=OFF

          cmake --build build --config Release --parallel

      # ------------------------------------------------------------
      # AWS KVS WebRTC C SDK
      # ------------------------------------------------------------

      - name: Clone KVS WebRTC SDK
        run: |
          git clone --recursive \
            https://github.com/awslabs/amazon-kinesis-video-streams-webrtc-sdk-c.git \
            kvs-webrtc

      - name: Configure KVS WebRTC SDK
        working-directory: kvs-webrtc
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DBUILD_STATIC_LIBS=TRUE \
            -DBUILD_TEST=FALSE \
            -DBUILD_DEPENDENCIES=TRUE \
            -DUSE_OPENSSL=ON

      - name: Build KVS WebRTC SDK
        working-directory: kvs-webrtc
        shell: bash
        run: |
          cmake --build build --parallel

      # ------------------------------------------------------------
      # Show output
      # ------------------------------------------------------------

      - name: Show libraries
        shell: bash
        run: |
          echo "=== libpeer ==="
          find libpeer/build -type f \
            \( -name '*.a' -o -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) \
            -print || true

          echo "=== KVS WebRTC ==="
          find kvs-webrtc/build -type f \
            \( -name '*.a' -o -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) \
            -print || true

      # ------------------------------------------------------------
      # Artifacts
      # ------------------------------------------------------------

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-libraries-${{ matrix.os }}
          path: |
            libpeer/build/**
            kvs-webrtc/build/**
          if-no-files-found: error