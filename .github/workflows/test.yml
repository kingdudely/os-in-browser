name: Browser Console

on: [push]

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - name: Launch Chrome and forward console.log
        run: |
          IN=/tmp/cdp.in
          OUT=/tmp/cdp.out

          mkfifo $IN $OUT
          exec 3>$IN

          google-chrome --remote-debugging-pipe --headless=new --no-first-run \
            --disable-gpu --no-sandbox \
            --user-data-dir=/tmp/chrome-dbg 3<$IN 4>$OUT 2>/dev/null &

          sleep 2

          send() { printf '%s\0' "$1" >&3; }

          # Print ALL raw CDP output so we can see what Chrome is saying
          while IFS= read -r -d $'\0' msg; do
            echo "RAW: $msg"
          done < $OUT &

          send '{"id":1,"method":"Runtime.enable","params":{}}'
          sleep 0.3
          send '{"id":2,"method":"Runtime.evaluate","params":{"expression":"console.log(\"Hello World\")"}}'

          sleep 3
          exec 3>&-
          rm -f $IN $OUT