name: Remote Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Ubuntu dependencies
      # ============================================================

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxtst-dev \
            xvfb

      # ============================================================
      # Install Xmake
      # ============================================================

      - name: Install Xmake
        uses: xmake-io/github-action@v1
        with:
          xmake-version: latest

      # ============================================================
      # Configure
      # ============================================================

      - name: Configure
        run: |
          xmake f -m release

      # ============================================================
      # Build
      # ============================================================

      - name: Build
        run: |
          xmake -y -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      # ============================================================
      # Test - Ubuntu
      # ============================================================

      - name: Test - Ubuntu
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a xmake run remote-desktop

      # ============================================================
      # Test - macOS
      # ============================================================

      - name: Test - macOS
        if: runner.os == 'macOS'
        run: |
          xmake run remote-desktop

      # ============================================================
      # Test - Windows
      # ============================================================

      - name: Test - Windows
        if: runner.os == 'Windows'
        run: |
          xmake run remote-desktop