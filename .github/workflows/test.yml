name: Browser Console

on: [push]

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - name: Browser console via pipe
        run: |
          mkfifo /tmp/in /tmp/out
          exec 3<>/tmp/in
          exec 4<>/tmp/out

          google-chrome --remote-debugging-pipe --headless=new \
            --no-first-run --disable-gpu --no-sandbox \
            --user-data-dir=/tmp/chrome-dbg \
            2>/dev/null 3<&3 4>&4 &

          sleep 2

          send() { printf '%s\0' "$1" >&3; }

          while IFS= read -r -d $'\0' msg; do
            echo "RAW: $msg"

            # Step 2: got targets, extract targetId and attach
            if echo "$msg" | grep -q '"id":1'; then
              TID=$(echo "$msg" | grep -o '"targetId":"[^"]*"' | head -1 | cut -d'"' -f4)
              echo "Target: $TID"
              send "{\"id\":2,\"method\":\"Target.attachToTarget\",\"params\":{\"targetId\":\"$TID\",\"flatten\":true}}"
            fi

            # Step 3: got session, enable runtime and evaluate
            if echo "$msg" | grep -q '"id":2'; then
              SID=$(echo "$msg" | grep -o '"sessionId":"[^"]*"' | head -1 | cut -d'"' -f4)
              echo "Session: $SID"
              send "{\"id\":3,\"sessionId\":\"$SID\",\"method\":\"Runtime.enable\",\"params\":{}}"
              sleep 0.3
              send "{\"id\":4,\"sessionId\":\"$SID\",\"method\":\"Runtime.evaluate\",\"params\":{\"expression\":\"console.log('Hello World')\"}}"
            fi

            # Step 4: catch console log event
            if echo "$msg" | grep -q "consoleAPICalled"; then
              TEXT=$(echo "$msg" | grep -o '"value":"[^"]*"' | head -1 | cut -d'"' -f4)
              echo "BROWSER: $TEXT"
            fi

          done <&4 &

          send '{"id":1,"method":"Target.getTargets","params":{}}'

          sleep 5
          rm -f /tmp/in /tmp/out