name: Build srtc

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            build-essential \
            git

      - name: Clone srtc
        run: |
          git clone --depth 1 https://github.com/kmansoft/srtc.git

      - name: Build srtc
        run: |
          cmake -S srtc -B srtc/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Os -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections"

          cmake --build srtc/build --parallel

      - name: Measure srtc
        run: |
          echo "===== srtc ====="

          find srtc/build \
            -type f \
            \( -name '*.a' -o -name '*.so' -o -perm -111 \) \
            -printf '%s %p\n' \
            | sort -n

          echo
          echo "Build directory:"
          du -sh srtc/build

      - name: Upload srtc
        uses: actions/upload-artifact@v4
        with:
          name: srtc
          path: srtc/build
          if-no-files-found: error
          retention-days: 7