name: Test CMake Build

run-name: CMake Test - ${{ inputs.os }}

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail

jobs:
  build-and-run:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          cmake --version
          vcpkg version

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: |
          cmake \
            --build build \
            --config Release \
            --parallel

      - name: Find executable
        id: binary
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BINARY="$(find build -type f -iname 'remote-desktop.exe' | head -n 1)"
          else
            BINARY="$(find build -type f -name 'remote-desktop' -perm -111 | head -n 1)"
          fi

          if [[ -z "$BINARY" ]]; then
            echo "::error::remote-desktop executable not found"
            exit 1
          fi

          echo "Found: $BINARY"
          echo "path=$BINARY" >> "$GITHUB_OUTPUT"

      - name: Run remote-desktop
        run: |
          echo "Starting remote-desktop..."
          echo "========================================"

          "${{ steps.binary.outputs.path }}"