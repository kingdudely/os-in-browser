name: Remote Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Ubuntu
      # ─────────────────────────────────────────────

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libx264-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxtst-dev \
            xvfb

      # ─────────────────────────────────────────────
      # macOS
      # ─────────────────────────────────────────────

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config x264

      # ─────────────────────────────────────────────
      # Windows / MSYS2 UCRT64
      # ─────────────────────────────────────────────

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-x264

      # ─────────────────────────────────────────────
      # Configure
      # ─────────────────────────────────────────────

      - name: Configure
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        env:
          PKG_CONFIG_PATH: ${{ runner.os == 'macOS' && '/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig' || '' }}
        run: |
          cmake -S . -B build -G Ninja

      # ─────────────────────────────────────────────
      # Build
      # ─────────────────────────────────────────────

      - name: Build
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        env:
          PKG_CONFIG_PATH: ${{ runner.os == 'macOS' && '/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig' || '' }}
        run: |
          cmake --build build --parallel

      # ─────────────────────────────────────────────
      # Test
      # ─────────────────────────────────────────────

      - name: Test
        if: runner.os != 'Linux'
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: |
          ./build/remote-desktop

      - name: Test with Xvfb
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./build/remote-desktop