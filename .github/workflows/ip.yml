name: Public IP

on: push

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Public IP
      id: ip
      uses: haythem/public-ip@v1.3

    - name: Print Public IP
      run: |
        echo ${{ steps.ip.outputs.ipv4 }}
        echo ${{ steps.ip.outputs.ipv6 }}

    - name: Create HTML page
      run: |
        cat > /tmp/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
          <head><title>GitHub Actions Runner</title></head>
          <body>
            <h1>Hello from GitHub Actions!</h1>
            <p>Runner IP: ${{ steps.ip.outputs.ipv4 }}</p>
          </body>
        </html>
        EOF

    - name: Serve HTML
      run: |
        echo "Serving at http://${{ steps.ip.outputs.ipv4 }}:8080"
        cd /tmp && python3 -m http.server 8080