name: Public IP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Bypass firewall
      run: |
        sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
        sudo pfctl -d 2>/dev/null || true

    - name: Get public IP
      id: ip
      uses: haythem/public-ip@v1.3

    - name: Print public IP
      run: echo "http://${{ steps.ip.outputs.ipv4 }}:8080"

    - name: Create HTML page
      run: |
        mkdir -p /tmp/site
        cat > /tmp/site/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
          <head><title>hello</title></head>
          <body>
            <h1>hello from github actions</h1>
          </body>
        </html>
        EOF

    - name: Serve HTML
      run: cd /tmp/site && python3 -m http.server 8080