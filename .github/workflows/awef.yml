name: Check Startup Security Policy

on:
  push:
  workflow_dispatch:

jobs:
  check-security-policy:
    runs-on: macos-latest

    steps:
      - name: Check SIP status
        run: csrutil status

      - name: Check boot args
        run: nvram boot-args 2>/dev/null || echo "no boot-args set"

      - name: Check security policy via bputil
        run: sudo bputil -d 2>/dev/null || echo "bputil not available"

      - name: Check via spctl
        run: spctl --status

      - name: Check kext consent via systempolicy
        run: |
          sudo sqlite3 /var/db/SystemPolicyConfiguration/KextPolicy \
            "SELECT * FROM kext_policy_mdm;" 2>/dev/null || echo "no mdm kext policy"
          sudo sqlite3 /var/db/SystemPolicyConfiguration/KextPolicy \
            "SELECT * FROM kext_policy;" 2>/dev/null || echo "no user kext policy"

      - name: Try loading a real unsigned kext
        run: |
          mkdir -p /tmp/test.kext/Contents/MacOS

          cat > /tmp/testkext.c <<'EOF'
          #include <mach/mach_types.h>

          kern_return_t TestKext_start(kmod_info_t *ki, void *d) { return KERN_SUCCESS; }
          kern_return_t TestKext_stop(kmod_info_t *ki, void *d)  { return KERN_SUCCESS; }

          __attribute__((visibility("default"))) kmod_info_t kmod_info = {
              0, 1, 0,
              "com.test.virtualhid",
              "1.0",
              0, 0, 0, 0, 0,
              TestKext_start, TestKext_stop
          };
          EOF

          clang -arch arm64e \
            -mkernel -nostdlib -Xlinker -kext \
            /tmp/testkext.c -o /tmp/test.kext/Contents/MacOS/TestKext

          cat > /tmp/test.kext/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.test.virtualhid</string>
            <key>CFBundleName</key><string>TestKext</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundlePackageType</key><string>KEXT</string>
            <key>CFBundleExecutable</key><string>TestKext</string>
            <key>OSBundleLibraries</key><dict>
              <key>com.apple.kpi.libkern</key><string>12.0</string>
            </dict>
          </dict></plist>
          EOF

          sudo chown -R root:wheel /tmp/test.kext
          sudo chmod -R 755 /tmp/test.kext

          echo "--- arch check ---"
          lipo -info /tmp/test.kext/Contents/MacOS/TestKext

          echo "--- symbols check ---"
          nm /tmp/test.kext/Contents/MacOS/TestKext | grep -E "kmod_info|start|stop"

          echo "--- approving kext in policy db ---"
          sudo sqlite3 /var/db/SystemPolicyConfiguration/KextPolicy \
            "INSERT OR REPLACE INTO kext_policy VALUES ('com.test.virtualhid', 'com.test.virtualhid', 1, 'TestKext', 1);"

          echo "--- kmutil load ---"
          sudo kmutil load -p /tmp/test.kext; echo "exit: $?"

          echo "--- dmesg tail ---"
          sudo dmesg | tail -20