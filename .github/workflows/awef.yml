name: Check Karabiner Virtual HID

on:
  push:
  workflow_dispatch:

jobs:
  check-virtual-hid:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@main

      - name: Install Karabiner-DriverKit-VirtualHIDDevice
        run: |
          curl -L https://github.com/pqrs-org/Karabiner-DriverKit-VirtualHIDDevice/releases/download/v7.1.0/Karabiner-DriverKit-VirtualHIDDevice-7.1.0.pkg \
            -o vhid.pkg
          sudo installer -pkg vhid.pkg -target /

      - name: Activate driver and start daemon
        run: |
          /Applications/.Karabiner-VirtualHIDDevice-Manager.app/Contents/MacOS/Karabiner-VirtualHIDDevice-Manager activate
          sleep 2
          systemextensionsctl list
          sudo '/Library/Application Support/org.pqrs/Karabiner-DriverKit-VirtualHIDDevice/Applications/Karabiner-VirtualHIDDevice-Daemon.app/Contents/MacOS/Karabiner-VirtualHIDDevice-Daemon' &
          sleep 2
          ls '/Library/Application Support/org.pqrs/tmp/rootonly/vhidd_server/'

      - name: Clone headers
        run: |
          git clone --depth 1 https://github.com/pqrs-org/Karabiner-DriverKit-VirtualHIDDevice.git karabiner-vhid

      - name: Build and run test client
        run: |
          clang++ -std=c++17 \
            -I karabiner-vhid/include \
            -I karabiner-vhid/examples/virtual-hid-device-service-client/vendor/include \
            -framework CoreFoundation \
            host/macos.cpp -o virtual_hid_test
          sudo ./virtual_hid_test