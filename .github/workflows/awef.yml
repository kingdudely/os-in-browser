name: Check CoreHID HIDVirtualDevice

on:
  push:
  workflow_dispatch:

jobs:
  check-corehid:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@main

      - name: Check SIP status
        run: csrutil status

      - name: Build, sign, and run
        run: |
          clang++ -std=c++17 -framework IOKit -framework CoreFoundation \
            $GITHUB_WORKSPACE/host/macos.cpp -o virtual_mouse

          cat > ent.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.hid.virtual.device</key><true/>
          </dict></plist>
          EOF

          codesign -s - --entitlements ent.plist --force ./virtual_mouse
          ./virtual_mouse

      - name: macOS & Xcode version info
        run: |
          sw_vers
          xcodebuild -version