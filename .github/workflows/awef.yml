name: Check CoreHID HIDVirtualDevice

on:
  push:
  workflow_dispatch:

jobs:
  check-corehid:
    runs-on: macos-latest

    steps:
      - name: Check AMFI / SIP status
        run: |
          echo "=== SIP ==="
          csrutil status
          echo "=== NVRAM boot-args ==="
          nvram boot-args 2>/dev/null || echo "(no boot-args set)"
          echo "=== AMFI in boot-args ==="
          nvram -p | grep -o 'amfi_get_out_of_my_way=[^ ]*' || echo "AMFI NOT disabled"