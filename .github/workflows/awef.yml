name: Check CoreHID HIDVirtualDevice

on:
  push:
  workflow_dispatch:

jobs:
  check-corehid:
    runs-on: macos-latest

    steps:
      - name: Check SIP status
        run: csrutil status

      - name: Try creating a HIDVirtualDevice
        run: |
          swiftc $GITHUB_WORKSPACE/host/macos.swift -o /tmp/check_hidvirtualdevice
          /tmp/check_hidvirtualdevice

      - name: macOS & Xcode version info
        run: |
          sw_vers
          xcodebuild -version