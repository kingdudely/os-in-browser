name: Check Startup Security Policy

on:
  push:
  workflow_dispatch:

jobs:
  check-security-policy:
    runs-on: macos-latest

    steps:
      - name: Check SIP status
        run: csrutil status

      - name: Check boot args
        run: nvram boot-args 2>/dev/null || echo "no boot-args set"

      - name: Check security policy via bputil
        run: sudo bputil -d 2>/dev/null || echo "bputil not available"

      - name: Check via spctl
        run: spctl --status

      - name: Check kext consent via systempolicy
        run: |
          sudo sqlite3 /var/db/SystemPolicyConfiguration/KextPolicy \
            "SELECT * FROM kext_policy_mdm;" 2>/dev/null || echo "no mdm kext policy"
          sudo sqlite3 /var/db/SystemPolicyConfiguration/KextPolicy \
            "SELECT * FROM kext_policy;" 2>/dev/null || echo "no user kext policy"

      - name: Try loading a trivial unsigned kext
        run: |
          # Create a minimal do-nothing kext to probe the policy
          mkdir -p /tmp/test.kext/Contents
          cat > /tmp/test.kext/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.test.kext</string>
            <key>CFBundleName</key><string>TestKext</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundlePackageType</key><string>KEXT</string>
            <key>OSBundleLibraries</key><dict>
              <key>com.apple.kpi.libkern</key><string>12.0</string>
            </dict>
          </dict></plist>
          EOF
          sudo chown -R root:wheel /tmp/test.kext
          sudo chmod -R 755 /tmp/test.kext
          sudo kextutil -n /tmp/test.kext 2>&1 || true
          sudo kextload /tmp/test.kext 2>&1 || true