name: resize screen

on:
  workflow_dispatch:
    inputs:
      width:
        description: Target width
        default: "1366"
      height:
        description: Target height
        default: "768"

jobs:
  resize:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@main

      - name: Resize screen
        run: sudo python3 resize_screen.py ${{ github.event.inputs.width || '1366' }} ${{ github.event.inputs.height || '768' }}

      - name: Verify resolution
        run: |
          python3 - ${{ github.event.inputs.width || '1366' }} ${{ github.event.inputs.height || '768' }} <<'EOF'
          import ctypes, sys

          want_w, want_h = int(sys.argv[1]), int(sys.argv[2])

          cg = ctypes.cdll.LoadLibrary(
              "/System/Library/Frameworks/CoreGraphics.framework/CoreGraphics"
          )
          cg.CGMainDisplayID.restype  = ctypes.c_uint32
          cg.CGMainDisplayID.argtypes = []
          cg.CGDisplayCopyDisplayMode.restype  = ctypes.c_void_p
          cg.CGDisplayCopyDisplayMode.argtypes = [ctypes.c_uint32]
          cg.CGDisplayModeGetWidth.restype  = ctypes.c_size_t
          cg.CGDisplayModeGetWidth.argtypes  = [ctypes.c_void_p]
          cg.CGDisplayModeGetHeight.restype  = ctypes.c_size_t
          cg.CGDisplayModeGetHeight.argtypes = [ctypes.c_void_p]

          did  = cg.CGMainDisplayID()
          mode = cg.CGDisplayCopyDisplayMode(did)
          got_w = cg.CGDisplayModeGetWidth(mode)
          got_h = cg.CGDisplayModeGetHeight(mode)

          print(f"Expected: {want_w}x{want_h}")
          print(f"Got:      {got_w}x{got_h}")

          if got_w != want_w or got_h != want_h:
              print("FAIL: resolution mismatch")
              sys.exit(1)

          print("OK: resolution matches")
          EOF