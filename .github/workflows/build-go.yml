name: Build main.go

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Golang
        uses: actions/setup-go@main
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        id: build
        env:
          CGO_ENABLED: 1
          EXTENSION: ""
        run: |
          mkdir -p dist

          case "${RUNNER_OS}" in
            Windows)
              EXTENSION=".exe"
              export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
              pacman --noconfirm -Sy --needed mingw-w64-x86_64-pkgconf mingw-w64-x86_64-libx264

              OUTPUT_PATH="dist/$(go env GOOS)${EXTENSION}"
              go build -o "${OUTPUT_PATH}"

              # ship the dll next to the exe — Windows checks the exe's own
              # directory for dependencies automatically, no linker tricks needed
              cp /c/msys64/mingw64/bin/libx264-*.dll dist/
              ;;

            macOS)
              brew install x264 pkg-config

              OUTPUT_PATH="dist/$(go env GOOS)${EXTENSION}"
              go build -o "${OUTPUT_PATH}"

              X264_DYLIB="$(find "$(brew --prefix x264)/lib" -name 'libx264.*.dylib' ! -type l | head -n1)"
              cp "$X264_DYLIB" dist/

              # rewrite the binary's load path from the absolute Homebrew path
              # to "look next to me" so no brew install is needed at runtime
              install_name_tool -change \
                "$X264_DYLIB" \
                "@executable_path/$(basename "$X264_DYLIB")" \
                "$OUTPUT_PATH"
              ;;

            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                libx11-dev libxext-dev libxtst-dev libx264-dev pkg-config

              # bake "look in my own directory first" into the binary
              export CGO_LDFLAGS="-Wl,-rpath -Wl,\$ORIGIN"

              OUTPUT_PATH="dist/$(go env GOOS)${EXTENSION}"
              go build -o "${OUTPUT_PATH}"

              X264_SO="$(ldconfig -p | grep libx264.so | awk '{print $NF}' | head -n1)"
              cp "$X264_SO" dist/
              ;;

            *)
              echo "::error::Unsupported operating system"
              exit 1
              ;;
          esac

          echo "path=${OUTPUT_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Verify binary finds its bundled libx264
        run: |
          case "${RUNNER_OS}" in
            macOS)
              otool -L "${{ steps.build.outputs.path }}"
              if ! otool -L "${{ steps.build.outputs.path }}" | grep -q "@executable_path"; then
                echo "::error::binary is not pointed at the bundled dylib"
                exit 1
              fi
              ;;
            Linux)
              ldd "${{ steps.build.outputs.path }}"
              if ! readelf -d "${{ steps.build.outputs.path }}" | grep -qi '\$ORIGIN'; then
                echo "::error::binary does not have \$ORIGIN rpath baked in"
                exit 1
              fi
              ;;
            Windows)
              echo "skipping — Windows resolves the dll from the exe's own folder automatically"
              ;;
          esac

      - name: Upload dist directory
        uses: actions/upload-artifact@main
        with:
          name: ${{ runner.os }}
          path: dist/

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Download all binaries
        uses: actions/download-artifact@main
        with:
          path: dist
          merge-multiple: true

      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/*
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add cross-platform binaries + libx264 to dist/"
          git push