name: Build main.go

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ext: ""
          - os: macos-latest
            goos: darwin
            ext: ""
          - os: windows-latest
            goos: windows
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-go@main
        with:
          go-version: "1.26"
          cache: true

      - name: Install Windows MSYS2 toolchain
        if: runner.os == 'windows-latest'
        uses: msys2/setup-msys2@main
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-x264
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gcc

      - name: Install dependencies
        run: |
          case "${RUNNER_OS}" in
            Windows)
              ;;
            macOS)
              brew install x264 pkg-config
              ;;
            Linux)
              sudo apt-get update
              sudo apt-get install -y libx11-dev libxext-dev libxtst-dev libx264-dev pkg-config
              ;;
            *)
              echo "::error::Unsupported operating system"
              exit 1
              ;;
          esac

      - name: Build
        env:
          GOARCH: "amd64"
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
        run: |
          mkdir -p dist
          go build -o "dist/${GOOS}${{ matrix.ext }}"

      - name: Upload binary
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.goos }}
          path: dist/${{ matrix.goos }}${{ matrix.ext }}

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Download all binaries
        uses: actions/download-artifact@main
        with:
          path: dist
          merge-multiple: true

      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/*
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add cross-platform binaries to dist/"
          git push