name: Build main.go

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ext: ""
          - os: macos-latest
            goos: darwin
            ext: ""
          - os: windows-latest
            goos: windows
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-go@main
        with:
          go-version: "1.26"
          cache: true

      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxtst-dev

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          MINGW_LIB=$(dirname $(which ar))/../x86_64-w64-mingw32/lib
          ar rcs "$MINGW_LIB/libssp.a"

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          GOARCH=amd64 CGO_ENABLED=1 GOOS=${{ matrix.goos }} \
            go build -o "dist/${{ matrix.goos }}${{ matrix.ext }}" .

      - name: Upload binary
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.goos }}
          path: dist/${{ matrix.goos }}${{ matrix.ext }}

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Download all binaries
        uses: actions/download-artifact@main
        with:
          path: dist
          merge-multiple: true

      - name: Commit Files to Repo
        uses: stefanzweifel/git-auto-commit-action@master
        with:
          commit_message: "Add cross-platform binaries to dist/"
          file_pattern: "dist/*"