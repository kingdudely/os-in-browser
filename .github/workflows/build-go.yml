name: Build main.go

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ext: ""
            shell: bash
          - os: macos-latest
            goos: darwin
            ext: ""
            shell: bash
          - os: windows-latest
            goos: windows
            ext: ".exe"
            shell: "msys2 {0}"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxtst-dev libx264-dev pkg-config

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install x264 pkg-config

      - name: Install Windows MSYS2 toolchain
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-x264
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gcc

      - name: Build
        shell: ${{ matrix.shell }}
        env:
          GOARCH: "amd64"
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
        run: |
          mkdir -p dist
          go build -o "dist/${GOOS}${{ matrix.ext }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}
          path: dist/${{ matrix.goos }}${{ matrix.ext }}

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Commit binaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/*
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add cross-platform binaries to dist/"
          git push