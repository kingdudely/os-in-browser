name: Build main.go

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Golang
        uses: actions/setup-go@main
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        id: build
        env:
          CGO_ENABLED: 1
          EXTENSION: ""
        run: |
          case "${RUNNER_OS}" in
            Windows)
              EXTENSION=".exe"
              export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
              pacman --noconfirm -Sy --needed mingw-w64-x86_64-pkgconf mingw-w64-x86_64-libx264
              ;;
            macOS)
              brew install x264 pkg-config
              ;;
            Linux)
              sudo apt-get update
              sudo apt-get install -y libx11-dev libxext-dev libxtst-dev libx264-dev pkg-config
              ;;
            *)
              echo "::error::Unsupported operating system"
              exit 1
              ;;
          esac

          mkdir -p dist
          OUTPUT_PATH="dist/$(go env GOOS)${EXTENSION}"
          echo "path=${OUTPUT_PATH}" >> "${GITHUB_OUTPUT}"
          go build -o "${OUTPUT_PATH}"

      - name: Upload binary
        uses: actions/upload-artifact@main
        with:
          path: ${{ steps.build.outputs.path }}

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Download all binaries
        uses: actions/download-artifact@main
        with:
          path: dist
          merge-multiple: true

      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/*
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add cross-platform binaries to dist/"
          git push