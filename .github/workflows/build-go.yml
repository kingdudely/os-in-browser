name: Build main.go

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # Fix macOS/all: allows git-auto-commit-action to push

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ext: ""
          - os: macos-latest
            goos: darwin
            ext: ""
          - os: windows-latest
            goos: windows
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-go@main
        with:
          go-version: "1.26"
          cache: true

      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libxtst-dev provides X11/extensions/XTest.h (fix Ubuntu error)
          sudo apt-get install -y libx11-dev libxext-dev libxtst-dev

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: |
          # Reinstall MinGW with a version that includes libssp (fix Windows linker error)
          choco install mingw --version=13.2.0 --force -y
          echo "C:\ProgramData\mingw64\mingw64\bin" >> $GITHUB_PATH
        shell: bash

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          GOARCH=amd64 CGO_ENABLED=1 GOOS=${{ matrix.goos }} \
            go build -o "dist/${{ matrix.goos }}${{ matrix.ext }}" .

      - name: Commit Files to Repo
        uses: stefanzweifel/git-auto-commit-action@master
        with:
          commit_message: "Add cross-platform binaries for ${{ matrix.goos }} to dist/"
          file_pattern: "dist/${{ matrix.goos }}${{ matrix.ext }}"