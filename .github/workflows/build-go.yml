name: Build main.go

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ext: ""
          - os: macos-latest
            goos: darwin
            ext: ""
          - os: windows-latest
            goos: windows
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-go@main
        with:
          go-version: "1.26"
          cache: true

      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxtst-dev libx264-dev pkg-config

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install x264 pkg-config

      - name: Install Windows MSYS2 toolchain
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@main
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-x264
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gcc

      - name: Windows libssp workaround
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          MINGW_LIB=$(dirname $(which ar))/../lib
          ar rcs "$MINGW_LIB/libssp.a" || true

      - name: Build (Ubuntu/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          GOARCH=amd64 CGO_ENABLED=1 GOOS=${{ matrix.goos }} \
            go build -o "dist/${{ matrix.goos }}${{ matrix.ext }}" .

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          export PATH="/mingw64/bin:$PATH"
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig"
          GOARCH=amd64 CGO_ENABLED=1 GOOS=windows \
            go build -o "dist/${{ matrix.goos }}${{ matrix.ext }}" .

      - name: Upload binary
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.goos }}
          path: dist/${{ matrix.goos }}${{ matrix.ext }}

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Download all binaries
        uses: actions/download-artifact@main
        with:
          path: dist
          merge-multiple: true

      - name: Commit binaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/*
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add cross-platform binaries to dist/"
          git push