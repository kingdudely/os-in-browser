name: WebTransport Direct Hole-Punch Test

on:
  workflow_dispatch: {}

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install "aioquic>=0.9.20" aiohttp cryptography

      - name: Install cloudflared
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Generate short-lived ECDSA cert
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout key.pem -out cert.pem -days 13 -nodes -subj "/CN=wt-test"

      - name: Write server
        run: |
          cat > server.py << 'PYEOF'
          import asyncio, base64, hashlib, socket, struct
          from aiohttp import web
          from aioquic.asyncio import serve
          from aioquic.asyncio.protocol import QuicConnectionProtocol
          from aioquic.quic.configuration import QuicConfiguration
          from aioquic.h3.connection import H3_ALPN, H3Connection
          from aioquic.h3.events import HeadersReceived, WebTransportStreamDataReceived, DatagramReceived
          from cryptography import x509
          from cryptography.hazmat.primitives.serialization import Encoding

          LOCAL_PORT = 45000
          STUN_SERVER = ("stun.l.google.com", 19302)
          MAGIC_COOKIE = 0x2112A442

          PAGE = b"""<!doctype html><script>
          const log = m => fetch("/log", {method:"POST", body:m});
          function gatherSrflx() {
            return new Promise((resolve, reject) => {
              const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
              pc.createDataChannel("probe");
              let found = null;
              pc.onicecandidate = e => {
                if (!e.candidate) {
                  pc.close();
                  found ? resolve(found) : reject(new Error("no ipv4 srflx candidate"));
                  return;
                }
                // force ipv4 -- server's punch socket is ipv4 only
                if (e.candidate.type === "srflx" && e.candidate.address.includes(".")) {
                  found = { ip: e.candidate.address, port: e.candidate.port };
                }
              };
              pc.createOffer().then(o => pc.setLocalDescription(o));
              setTimeout(() => reject(new Error("gather timeout")), 8000);
            });
          }
          async function main() {
            log("gathering our ipv4 public ip:port via STUN...");
            const { ip, port } = await gatherSrflx();
            log("our public mapping: " + ip + ":" + port);
            const info = await fetch("/server-info").then(r => r.json());
            log("server is at " + info.serverIp + ":" + info.serverPort);
            await fetch("/register-client", {
              method: "POST", headers: {"Content-Type": "application/json"},
              body: JSON.stringify({ ip, port }),
            });
            log("registered, server is punching toward us...");
            await new Promise(r => setTimeout(r, 1500));
            const digest = Uint8Array.from(atob(info.certHash), c => c.charCodeAt(0));
            log("opening WebTransport...");
            const t = new WebTransport("https://" + info.serverIp + ":" + info.serverPort + "/wt",
              { serverCertificateHashes: [{ algorithm: "sha-256", digest }] });
            await t.ready;
            log("WebTransport established!");
            const s = await t.createBidirectionalStream();
            const w = s.writable.getWriter(); const r = s.readable.getReader();
            await w.write(new TextEncoder().encode("ping-stream"));
            const { value } = await r.read();
            log("stream reply: " + new TextDecoder().decode(value));
            const dw = t.datagrams.writable.getWriter(); const dr = t.datagrams.readable.getReader();
            await dw.write(new TextEncoder().encode("ping-datagram"));
            const { value: dv } = await dr.read();
            log("datagram reply: " + new TextDecoder().decode(dv));
            log("TEST PASSED: direct UDP hole-punch + WebTransport OK, no WebRTC data path used");
          }
          main().catch(e => log("ERROR: " + e));
          </script>"""

          def cert_hash_b64(path="cert.pem"):
              with open(path, "rb") as f:
                  cert = x509.load_pem_x509_certificate(f.read())
              return base64.b64encode(hashlib.sha256(cert.public_bytes(Encoding.DER)).digest()).decode()

          def build_stun_request():
              return struct.pack("!HHI", 0x0001, 0, MAGIC_COOKIE) + b"\x00" * 12

          def parse_xor_mapped(data):
              i = 20
              while i + 4 <= len(data):
                  t, l = struct.unpack("!HH", data[i:i+4])
                  v = data[i+4:i+4+l]
                  if t == 0x0020 and l >= 8:
                      p = struct.unpack("!H", v[2:4])[0] ^ (MAGIC_COOKIE >> 16)
                      ip = socket.inet_ntoa(bytes(a ^ b for a, b in zip(v[4:8], struct.pack("!I", MAGIC_COOKIE))))
                      return ip, p
                  i += 4 + l + (l % 4)
              return None

          def self_stun(port):
              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              sock.bind(("0.0.0.0", port))
              sock.settimeout(5)
              sock.sendto(build_stun_request(), STUN_SERVER)
              data, _ = sock.recvfrom(2048)
              sock.close()
              return parse_xor_mapped(data)

          quic_server_ref = {"server": None}

          def punch_toward(ip, port, count=5):
              server = quic_server_ref["server"]
              if server is None:
                  print("[!] quic server not ready, cannot punch")
                  return
              for _ in range(count):
                  server._transport.sendto(b"\x00punch", (ip, port))
              print(f"[+] sent {count} punch packets toward {ip}:{port}")

          class H3Protocol(QuicConnectionProtocol):
              def __init__(self, *a, **kw):
                  super().__init__(*a, **kw)
                  self._http = H3Connection(self._quic, enable_webtransport=True)
                  self._sessions = set()

              def quic_event_received(self, event):
                  for e in self._http.handle_event(event):
                      if isinstance(e, HeadersReceived):
                          h = dict(e.headers)
                          if h.get(b":method") == b"CONNECT" and h.get(b":protocol") == b"webtransport":
                              self._sessions.add(e.stream_id)
                              self._http.send_headers(e.stream_id, [(b":status", b"200")])
                              print(f"[+] WebTransport session up on stream {e.stream_id}")
                          else:
                              self._http.send_headers(e.stream_id, [(b":status", b"404")], end_stream=True)
                      elif isinstance(e, WebTransportStreamDataReceived):
                          print(f"[+] stream data: {e.data!r}")
                          self._http.send_data(e.stream_id, b"pong-stream", end_stream=False)
                      elif isinstance(e, DatagramReceived):
                          print(f"[+] datagram: {e.data!r}")
                          for sid in self._sessions:
                              self._http.send_datagram(sid, b"pong-datagram")
                  self.transmit()

          async def handle_page(request):
              return web.Response(body=PAGE, content_type="text/html")

          async def handle_log(request):
              print("[client]", (await request.text()))
              return web.Response(text="ok")

          async def handle_server_info(request):
              return web.json_response({
                  "serverIp": request.app["pub_ip"],
                  "serverPort": request.app["pub_port"],
                  "certHash": cert_hash_b64(),
              })

          async def handle_register_client(request):
              body = await request.json()
              ip, port = body["ip"], int(body["port"])
              print(f"[+] client registered at {ip}:{port}")
              punch_toward(ip, port)
              return web.json_response({"ok": True})

          async def main():
              print("[+] self-STUNning...")
              pub_ip, pub_port = self_stun(LOCAL_PORT)
              print(f"[+] our public mapping: {pub_ip}:{pub_port}")

              quic_config = QuicConfiguration(alpn_protocols=H3_ALPN, is_client=False)
              quic_config.load_cert_chain("cert.pem", "key.pem")
              server = await serve("0.0.0.0", LOCAL_PORT, configuration=quic_config, create_protocol=H3Protocol)
              quic_server_ref["server"] = server
              print(f"[+] QUIC/WebTransport listening on 0.0.0.0:{LOCAL_PORT}")

              app = web.Application()
              app["pub_ip"], app["pub_port"] = pub_ip, pub_port
              app.router.add_get("/", handle_page)
              app.router.add_post("/log", handle_log)
              app.router.add_get("/server-info", handle_server_info)
              app.router.add_post("/register-client", handle_register_client)
              runner = web.AppRunner(app)
              await runner.setup()
              site = web.TCPSite(runner, "0.0.0.0", 8080)
              await site.start()
              print("[+] HTTP signaling server on :8080 -- open the cloudflared URL now")

              await asyncio.Event().wait()  # block forever, keeps logs flowing to the job

          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF

      - name: Start cloudflared tunnel
        run: |
          cloudflared tunnel --url http://localhost:8080 --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 1 15); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*trycloudflare.com' tunnel.log | head -n1)
            [ -n "$URL" ] && break
            sleep 1
          done
          [ -n "$URL" ] || { echo "Tunnel URL never appeared" >&2; cat tunnel.log; exit 1; }
          echo "::notice title=Click this URL::$URL"

      - name: Run server (foreground, logs stream live)
        run: python3 server.py