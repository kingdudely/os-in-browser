name: QUIC Runner (WebRTC hole-punch + WebTransport, single-file)

on:
  workflow_dispatch: {}

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install aiortc aioquic aiohttp cryptography

      - name: Install cloudflared
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Generate self-signed cert for WebTransport
        run: |
          # WebTransport's serverCertificateHashes path requires <= 14 day
          # validity and (per spec) an ECDSA key — RSA certs are rejected.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout key.pem -out cert.pem -days 14 -nodes -subj "/CN=os-in-browser"
          openssl x509 -in cert.pem -outform der -out cert.der
          # base64 of the raw SHA-256 digest bytes, for serverCertificateHashes in JS
          openssl dgst -sha256 -binary cert.der | base64 -w0 > certhash.b64

      - name: Write landing page (offer -> srflx+certhash -> WebTransport)
        run: |
          mkdir -p www
          cat > www/index.html << 'HTMLEOF'
          <!doctype html><html><body>
          <h1>os-in-browser</h1>
          <pre id="out">connecting...</pre>
          <script>
          function b64ToBytes(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
          }

          async function main() {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
            pc.createDataChannel("keepalive"); // keeps ICE consent checks flowing, holds the NAT mapping open
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            await new Promise(resolve => {
              if (pc.iceGatheringState === "complete") return resolve();
              pc.onicegatheringstatechange = () => {
                if (pc.iceGatheringState === "complete") resolve();
              };
            });

            const res = await fetch("/offer", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
            });
            const { answer, srflx, certhash } = await res.json();
            await pc.setRemoteDescription(answer);

            const [ip, port] = srflx.split(":");

            // WebTransport bootstraps over QUIC directly — no TCP fallback,
            // no CA trust chain needed, cert is trusted via exact hash pin.
            const transport = new WebTransport(`https://${ip}:${port}/`, {
              serverCertificateHashes: [{ algorithm: "sha-256", value: b64ToBytes(certhash) }],
            });
            await transport.ready;

            const stream = await transport.incomingUnidirectionalStreams.getReader().read();
            const reader = stream.value.getReader();
            const decoder = new TextDecoder();
            let text = "";
            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              text += decoder.decode(value);
            }
            document.getElementById("out").textContent = text;
          }
          main().catch(e => {
            document.getElementById("out").textContent = "error: " + e;
          });
          </script>
          </body></html>
          HTMLEOF

      - name: Write server (offer/answer + srflx harvest + WebTransport, one process)
        run: |
          cat > server.py << 'PYEOF'
          import asyncio
          import pathlib
          import socket

          from aiohttp import web
          from aiortc import RTCPeerConnection, RTCConfiguration, RTCIceServer, RTCSessionDescription

          from aioquic.asyncio import serve
          from aioquic.quic.configuration import QuicConfiguration
          from aioquic.quic.events import QuicEvent
          from aioquic.h3.connection import H3_ALPN, H3Connection
          from aioquic.h3.events import H3Event, HeadersReceived, WebTransportStreamDataReceived
          from aioquic.asyncio.protocol import QuicConnectionProtocol

          MESSAGE = b"Hello, world!"

          with open("certhash.b64") as f:
              CERTHASH_B64 = f.read().strip()


          def extract_srflx(sdp: str):
              for line in sdp.splitlines():
                  if "typ srflx" in line:
                      parts = line.split()
                      return parts[4], int(parts[5])
              return None


          async def handle_offer(request):
              body = await request.json()
              offer = RTCSessionDescription(sdp=body["sdp"], type=body["type"])

              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sock.bind(("0.0.0.0", 0))
              local_port = sock.getsockname()[1]

              pc = RTCPeerConnection(
                  configuration=RTCConfiguration(
                      iceServers=[RTCIceServer(urls=["stun:stun.l.google.com:19302"])]
                  )
              )
              await pc.setRemoteDescription(offer)
              answer = await pc.createAnswer()
              await pc.setLocalDescription(answer)

              while pc.iceGatheringState != "complete":
                  await asyncio.sleep(0.1)

              srflx = extract_srflx(pc.localDescription.sdp)
              if not srflx:
                  sock.close()
                  return web.json_response({"error": "no srflx candidate"}, status=500)

              srflx_ip, srflx_port = srflx
              print(f"[+] srflx candidate: {srflx_ip}:{srflx_port} (local port {local_port})")

              request.app["peers"].append(pc)  # keep alive so datachannel keepalives have a peer
              asyncio.create_task(start_webtransport(sock, local_port))

              return web.json_response({
                  "answer": {"sdp": pc.localDescription.sdp, "type": pc.localDescription.type},
                  "srflx": f"{srflx_ip}:{srflx_port}",
                  "certhash": CERTHASH_B64,
              })


          class WebTransportProtocol(QuicConnectionProtocol):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self._http = H3Connection(self._quic, enable_webtransport=True)

              def quic_event_received(self, event: QuicEvent):
                  for h3_event in self._http.handle_event(event):
                      self.h3_event_received(h3_event)
                  self.transmit()

              def h3_event_received(self, event: H3Event):
                  if isinstance(event, HeadersReceived):
                      headers = dict(event.headers)
                      if headers.get(b":method") == b"CONNECT" and headers.get(b":protocol") == b"webtransport":
                          # Accept the session
                          self._http.send_headers(
                              stream_id=event.stream_id,
                              headers=[(b":status", b"200")],
                          )
                          session_id = event.stream_id
                          # Push our payload immediately on a unidirectional stream
                          stream_id = self._http.create_webtransport_stream(
                              session_id=session_id, is_unidirectional=True
                          )
                          self._quic.send_stream_data(stream_id, MESSAGE, end_stream=True)


          async def start_webtransport(sock, local_port):
              quic_config = QuicConfiguration(alpn_protocols=H3_ALPN, is_client=False)
              quic_config.load_cert_chain("cert.pem", "key.pem")
              sock.close()  # aioquic rebinds fresh, but on the SAME local port
              await serve("0.0.0.0", local_port, configuration=quic_config, create_protocol=WebTransportProtocol)
              print(f"[+] WebTransport serving on 0.0.0.0:{local_port}")


          app = web.Application()
          app["peers"] = []
          app.router.add_post("/offer", handle_offer)
          app.router.add_static("/", pathlib.Path("www"), show_index=True)

          if __name__ == "__main__":
              web.run_app(app, host="0.0.0.0", port=8080)
          PYEOF

      - name: Start server
        run: |
          python3 server.py &
          sleep 2

      - name: Start cloudflared quick tunnel
        run: |
          cloudflared tunnel --url http://localhost:8080 --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 1 15); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*trycloudflare.com' tunnel.log | head -n1)
            [ -n "$URL" ] && break
            sleep 1
          done
          [ -n "$URL" ] || { echo "Tunnel URL never appeared" >&2; cat tunnel.log; exit 1; }
          echo "::notice title=Click this URL::$URL"

      - name: Keep runner alive
        run: sleep 1800