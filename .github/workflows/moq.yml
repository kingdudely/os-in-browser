name: NAT Type Test

on:
  workflow_dispatch: {}

jobs:
  test-nat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write NAT test script
        run: |
          cat > nat_test.py << 'PYEOF'
          import socket
          import struct
          import random

          def stun_request(sock, server, port=19302):
              msg_type = 0x0001
              msg_len = 0
              magic_cookie = 0x2112A442
              txn_id = random.randbytes(12)
              packet = struct.pack("!HHI12s", msg_type, msg_len, magic_cookie, txn_id)
              sock.sendto(packet, (server, port))
              data, _ = sock.recvfrom(2048)
              i = 20
              while i < len(data):
                  attr_type, attr_len = struct.unpack("!HH", data[i:i+4])
                  val = data[i+4:i+4+attr_len]
                  if attr_type == 0x0020:  # XOR-MAPPED-ADDRESS
                      xport = struct.unpack("!H", val[2:4])[0] ^ (magic_cookie >> 16)
                      xip = struct.unpack("!I", val[4:8])[0] ^ magic_cookie
                      ip = socket.inet_ntoa(struct.pack("!I", xip))
                      return ip, xport
                  elif attr_type == 0x0001:  # MAPPED-ADDRESS
                      xport = struct.unpack("!H", val[2:4])[0]
                      ip = socket.inet_ntoa(val[4:8])
                      return ip, xport
                  i += 4 + attr_len + (attr_len % 4)
              return None

          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.bind(("0.0.0.0", 0))
          sock.settimeout(5)

          servers = [
              ("stun.l.google.com", 19302),
              ("stun1.l.google.com", 19302),
              ("stun.cloudflare.com", 3478),
          ]

          results = []
          for host, port in servers:
              try:
                  ip, mapped_port = stun_request(sock, host, port)
                  print(f"{host}:{port} -> {ip}:{mapped_port}")
                  results.append((ip, mapped_port))
              except Exception as e:
                  print(f"{host}:{port} -> failed ({e})")

          print()
          if len(results) >= 2:
              ports = set(p for _, p in results)
              ips = set(i for i, _ in results)
              if len(ports) == 1 and len(ips) == 1:
                  print("=> Likely CONE NAT (consistent mapping across servers) — srflx hole-punching is viable")
              else:
                  print("=> Likely SYMMETRIC NAT (mapping varies per destination) — srflx punching won't work, need a relay/TURN")
          else:
              print("=> Not enough successful STUN responses to determine NAT type")
          PYEOF

      - name: Run NAT test
        run: python3 nat_test.py

      - name: Runner egress IP (for reference)
        run: curl -s https://ifconfig.me && echo