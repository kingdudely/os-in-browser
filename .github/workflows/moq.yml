name: WebTransport Hole-Punch Test (single-file)

on:
  workflow_dispatch: {}

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install "aiortc>=1.9" "aioquic>=0.9.20" aiohttp cryptography

      - name: Install cloudflared
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Generate short-lived ECDSA cert for WebTransport
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout key.pem -out cert.pem -days 13 -nodes -subj "/CN=wt-test"

      - name: Write landing page (offer -> srflx -> WebTransport echo test)
        run: |
          mkdir -p www
          cat > www/index.html << 'HTMLEOF'
          <!doctype html><html><body>
          <h1>WebTransport hole-punch test</h1>
          <pre id="log">connecting...</pre>
          <script>
          const log = (m) => { document.getElementById("log").textContent += "\n" + m; console.log(m); };

          async function main() {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
            pc.createDataChannel("keepalive"); // keeps ICE consent checks flowing
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            await new Promise(resolve => {
              if (pc.iceGatheringState === "complete") return resolve();
              pc.onicegatheringstatechange = () => {
                if (pc.iceGatheringState === "complete") resolve();
              };
            });

            log("posting offer...");
            const res = await fetch("/offer", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
            });
            const { answer, srflx, certHash } = await res.json();
            await pc.setRemoteDescription(answer);
            log(`got srflx=${srflx}`);

            const [ip, port] = srflx.split(":");
            const digest = Uint8Array.from(atob(certHash), c => c.charCodeAt(0));

            log("opening WebTransport session...");
            const transport = new WebTransport(`https://${ip}:${port}/wt`, {
              serverCertificateHashes: [{ algorithm: "sha-256", digest }],
            });

            await transport.ready;
            log("WebTransport session established!");

            // Bidi stream echo test
            const stream = await transport.createBidirectionalStream();
            const writer = stream.writable.getWriter();
            const reader = stream.readable.getReader();
            await writer.write(new TextEncoder().encode("ping-stream"));
            const { value } = await reader.read();
            log(`stream echo reply: ${new TextDecoder().decode(value)}`);

            // Datagram echo test
            const dgWriter = transport.datagrams.writable.getWriter();
            const dgReader = transport.datagrams.readable.getReader();
            await dgWriter.write(new TextEncoder().encode("ping-datagram"));
            const { value: dgValue } = await dgReader.read();
            log(`datagram echo reply: ${new TextDecoder().decode(dgValue)}`);

            log("TEST PASSED: NAT hole-punch + WebTransport round trip OK");
          }
          main().catch(e => log("ERROR: " + e));
          </script>
          </body></html>
          HTMLEOF

      - name: Write server (offer/answer + srflx harvest + WebTransport echo)
        run: |
          cat > server.py << 'PYEOF'
          import asyncio
          import base64
          import hashlib
          import pathlib

          from aiohttp import web
          from aiortc import RTCPeerConnection, RTCConfiguration, RTCIceServer, RTCSessionDescription

          from aioquic.asyncio import serve
          from aioquic.quic.configuration import QuicConfiguration
          from aioquic.h3.connection import H3_ALPN, H3Connection
          from aioquic.asyncio.protocol import QuicConnectionProtocol
          from aioquic.h3.events import HeadersReceived, WebTransportStreamDataReceived, DatagramReceived

          from cryptography import x509
          from cryptography.hazmat.primitives.serialization import Encoding


          def cert_sha256_b64(path="cert.pem"):
              with open(path, "rb") as f:
                  cert = x509.load_pem_x509_certificate(f.read())
              der = cert.public_bytes(Encoding.DER)
              return base64.b64encode(hashlib.sha256(der).digest()).decode()


          def extract_srflx(sdp: str):
              for line in sdp.splitlines():
                  if "typ srflx" in line:
                      parts = line.split()
                      return parts[4], int(parts[5])
              return None


          class H3Protocol(QuicConnectionProtocol):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self._http = H3Connection(self._quic, enable_webtransport=True)
                  self._sessions = set()

              def quic_event_received(self, event):
                  for h3_event in self._http.handle_event(event):
                      if isinstance(h3_event, HeadersReceived):
                          headers = dict(h3_event.headers)
                          if headers.get(b":method") == b"CONNECT" and headers.get(b":protocol") == b"webtransport":
                              self._sessions.add(h3_event.stream_id)
                              self._http.send_headers(h3_event.stream_id, [(b":status", b"200")])
                              print(f"[+] WebTransport session established on stream {h3_event.stream_id}")
                          else:
                              self._http.send_headers(h3_event.stream_id, [(b":status", b"404")], end_stream=True)
                      elif isinstance(h3_event, WebTransportStreamDataReceived):
                          print(f"[+] stream data received: {h3_event.data!r}")
                          # simple echo back on the same stream
                          self._http.send_data(h3_event.stream_id, b"pong-stream", end_stream=False)
                      elif isinstance(h3_event, DatagramReceived):
                          print(f"[+] datagram received: {h3_event.data!r}")
                          # simple echo back as a datagram on the same session
                          for session_id in self._sessions:
                              self._http.send_datagram(session_id, b"pong-datagram")
                  self.transmit()


          async def start_quic(local_port):
              quic_config = QuicConfiguration(alpn_protocols=H3_ALPN, is_client=False)
              quic_config.load_cert_chain("cert.pem", "key.pem")
              await serve("0.0.0.0", local_port, configuration=quic_config, create_protocol=H3Protocol)
              print(f"[+] WebTransport/HTTP3 serving on 0.0.0.0:{local_port}")


          async def handle_offer(request):
              body = await request.json()
              offer = RTCSessionDescription(sdp=body["sdp"], type=body["type"])

              pc = RTCPeerConnection(
                  configuration=RTCConfiguration(
                      iceServers=[RTCIceServer(urls=["stun:stun.l.google.com:19302"])]
                  )
              )

              connected = asyncio.Event()

              @pc.on("iceconnectionstatechange")
              async def on_ice_state_change():
                  print(f"[+] ICE state: {pc.iceConnectionState}")
                  if pc.iceConnectionState == "connected":
                      connected.set()

              await pc.setRemoteDescription(offer)
              answer = await pc.createAnswer()
              await pc.setLocalDescription(answer)

              while pc.iceGatheringState != "complete":
                  await asyncio.sleep(0.1)

              srflx = extract_srflx(pc.localDescription.sdp)
              if not srflx:
                  return web.json_response({"error": "no srflx candidate"}, status=500)
              srflx_ip, srflx_port = srflx

              request.app["peers"].append(pc)

              async def start_after_connected():
                  await connected.wait()
                  print("[+] ICE connected -- NAT binding is open toward the browser.")
                  ice_transport = pc.sctp.transport.transport
                  default_candidate = ice_transport._connection.get_default_candidate(component=1)
                  if default_candidate is None:
                      print("[!] Could not resolve default candidate; aborting WebTransport startup")
                      return
                  local_port = default_candidate.port
                  print(f"[+] ICE-connected local port: {local_port}, public srflx: {srflx_ip}:{srflx_port}")
                  await start_quic(local_port)

              asyncio.create_task(start_after_connected())

              return web.json_response({
                  "answer": {"sdp": pc.localDescription.sdp, "type": pc.localDescription.type},
                  "srflx": f"{srflx_ip}:{srflx_port}",
                  "certHash": cert_sha256_b64(),
              })


          app = web.Application()
          app["peers"] = []
          app.router.add_post("/offer", handle_offer)
          app.router.add_static("/", pathlib.Path("www"), show_index=True)

          if __name__ == "__main__":
              web.run_app(app, host="0.0.0.0", port=8080)
          PYEOF

      - name: Start server
        run: |
          python3 server.py &
          sleep 2

      - name: Start cloudflared quick tunnel
        run: |
          cloudflared tunnel --url http://localhost:8080 --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 1 15); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*trycloudflare.com' tunnel.log | head -n1)
            [ -n "$URL" ] && break
            sleep 1
          done
          [ -n "$URL" ] || { echo "Tunnel URL never appeared" >&2; cat tunnel.log; exit 1; }
          echo "::notice title=Click this URL::$URL"

      - name: Keep runner alive
        run: sleep 900