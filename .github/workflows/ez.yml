name: Test wait PID

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Start background process
        id: start
        run: |
          sleep 300 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"

      - name: Try wait in another step
        run: |
          echo "Trying to wait on PID: ${{ steps.start.outputs.pid }}"
          wait "${{ steps.start.outputs.pid }}"
          echo "wait returned successfully"