name: 🖥️ Test Arbitrary Screen Resolution Support

# Tests whether each runner OS supports setting truly custom/arbitrary
# display resolutions — the core requirement for a "resize to fit client
# viewport" remote desktop implementation.
#
# What we're testing:
#   Ubuntu  → Xvfb (arbitrary at boot) + xrandr --newmode (live resize)
#   macOS   → vmware-resolutionSet (VMware Tools, capped at 2560×1600)
#   Windows → ChangeDisplaySettingsEx via PowerShell (preset modes only?)
#
# Each job tries a set of resolutions that are deliberately unusual
# (not standard 16:9/4:3 sizes) to expose whether the OS truly accepts
# arbitrary pixel dimensions or silently clamps/rejects them.

on:
  push:
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  #  UBUNTU — Xvfb + xrandr on xserver-xorg-video-dummy
  #  Expected: full arbitrary support (it's a software framebuffer)
  # ══════════════════════════════════════════════════════════════════════════
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Install Xvfb + xrandr + dummy video driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            x11-xserver-utils \
            xserver-xorg-video-dummy \
            cvt \
            python3

      # ── Test 1: Xvfb with arbitrary size at boot ─────────────────────────
      - name: 🧪 Test 1 — Xvfb accepts arbitrary resolution at startup
        run: |
          echo "──────────────────────────────────────────────────────"
          echo "TEST 1: Start Xvfb at non-standard resolutions"
          echo "──────────────────────────────────────────────────────"

          PASS=0
          FAIL=0

          test_xvfb() {
            local W=$1 H=$2
            pkill Xvfb 2>/dev/null || true; sleep 0.5
            Xvfb :99 -screen 0 "${W}x${H}x24" &
            sleep 1
            ACTUAL=$(DISPLAY=:99 xdpyinfo 2>/dev/null | grep "dimensions:" | awk '{print $2}')
            if [ "$ACTUAL" = "${W}x${H}" ]; then
              echo "  ✅ ${W}x${H}  →  got ${ACTUAL}"
              PASS=$((PASS+1))
            else
              echo "  ❌ ${W}x${H}  →  got ${ACTUAL:-<none>}"
              FAIL=$((FAIL+1))
            fi
            pkill Xvfb 2>/dev/null || true; sleep 0.3
          }

          # Unusual viewport-like sizes a browser might request
          test_xvfb 1337 919    # Odd non-standard
          test_xvfb 1366 768    # Common laptop but non-obvious
          test_xvfb 1920 1200   # 16:10 non-standard
          test_xvfb 2560 1600   # Large 16:10
          test_xvfb 800  600    # Old VGA
          test_xvfb 1111 777    # Completely arbitrary
          test_xvfb 3840 2160   # 4K
          test_xvfb 1024 600    # Netbook size

          echo ""
          echo "Result: ${PASS} passed, ${FAIL} failed"
          echo "XVFB_PASS=${PASS}" >> $GITHUB_ENV
          echo "XVFB_FAIL=${FAIL}" >> $GITHUB_ENV

      # ── Test 2: Live xrandr resize via --newmode ──────────────────────────
      - name: 🧪 Test 2 — Live xrandr resize with custom modelines
        run: |
          echo "──────────────────────────────────────────────────────"
          echo "TEST 2: xrandr --newmode live resize (dummy driver)"
          echo "──────────────────────────────────────────────────────"

          # Start Xvfb via dummy driver config for xrandr resize support
          cat > /tmp/xorg-dummy.conf << 'EOF'
          Section "Device"
            Identifier "DummyDevice"
            Driver     "dummy"
            VideoRam   256000
          EndSection
          Section "Screen"
            Identifier "DummyScreen"
            Device     "DummyDevice"
            DefaultDepth 24
            SubSection "Display"
              Depth 24
              Modes "1920x1080"
              Virtual 4096 4096
            EndSubSection
          EndSection
          Section "Monitor"
            Identifier "DummyMonitor"
          EndSection
          EOF

          sudo Xorg -noreset +extension GLX +extension RANDR +extension RENDER \
            -logfile /tmp/xorg.log -config /tmp/xorg-dummy.conf :98 &
          sleep 3
          export DISPLAY=:98

          INITIAL=$(xdpyinfo 2>/dev/null | grep "dimensions:" | awk '{print $2}')
          echo "  Initial resolution: ${INITIAL}"
          echo "  Available outputs:"
          xrandr 2>/dev/null | grep " connected\| disconnected" | head -5 || \
            xrandr 2>/dev/null | head -10

          PASS=0
          FAIL=0

          test_xrandr() {
            local W=$1 H=$2
            local NAME="${W}x${H}_test"

            # Generate modeline with cvt
            MODELINE=$(cvt "$W" "$H" 60 2>/dev/null | grep Modeline | sed 's/Modeline //')
            if [ -z "$MODELINE" ]; then
              echo "  ⚠️  ${W}x${H}  →  cvt failed to generate modeline"
              return
            fi

            # Get the output name (first connected or dummy output)
            OUTPUT=$(xrandr 2>/dev/null | grep -E "^Screen|HDMI|DP|VGA|DVI|default" | \
              grep -v "^Screen" | head -1 | awk '{print $1}')
            [ -z "$OUTPUT" ] && OUTPUT=$(xrandr 2>/dev/null | awk 'NR==2{print $1}')

            # Add mode
            xrandr --newmode "$NAME" $(echo "$MODELINE" | sed 's/"[^"]*" //') 2>/dev/null || true
            xrandr --addmode "$OUTPUT" "$NAME" 2>/dev/null || true
            xrandr --output "$OUTPUT" --mode "$NAME" 2>/dev/null
            sleep 0.5

            ACTUAL=$(xdpyinfo 2>/dev/null | grep "dimensions:" | awk '{print $2}')
            if [ "$ACTUAL" = "${W}x${H}" ]; then
              echo "  ✅ ${W}x${H}  →  got ${ACTUAL}"
              PASS=$((PASS+1))
            else
              echo "  ❌ ${W}x${H}  →  got ${ACTUAL:-<none>} (xrandr may have clamped)"
              FAIL=$((FAIL+1))
            fi

            # Reset for next test
            xrandr --output "$OUTPUT" --mode "1920x1080" 2>/dev/null || true
            xrandr --rmmode "$NAME" 2>/dev/null || true
          }

          test_xrandr 1337 919
          test_xrandr 1280 800
          test_xrandr 1600 900
          test_xrandr 2048 1152
          test_xrandr 1111 777
          test_xrandr 1440 900
          test_xrandr 1920 1200

          echo ""
          echo "Result: ${PASS} passed, ${FAIL} failed"
          echo "XRANDR_PASS=${PASS}" >> $GITHUB_ENV
          echo "XRANDR_FAIL=${FAIL}" >> $GITHUB_ENV
          sudo pkill Xorg || true

      # ── Summary ───────────────────────────────────────────────────────────
      - name: 📊 Ubuntu Summary
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  UBUNTU RESULTS"
          echo "══════════════════════════════════════════════════════"
          echo "  Xvfb at-boot arbitrary resize:  ✅ $XVFB_PASS passed  ❌ $XVFB_FAIL failed"
          echo "  xrandr live resize (dummy drv): ✅ $XRANDR_PASS passed  ❌ $XRANDR_FAIL failed"
          echo ""
          if [ "$XVFB_FAIL" -eq 0 ] && [ "$XRANDR_FAIL" -eq 0 ]; then
            echo "  🟢 FULL arbitrary resolution support confirmed."
            echo "  Suitable for dynamic viewport-match resizing."
          else
            echo "  🟡 Partial support. Some sizes may be clamped."
          fi
          echo "══════════════════════════════════════════════════════"


  # ══════════════════════════════════════════════════════════════════════════
  #  macOS — vmware-resolutionSet (GitHub Actions runners are VMware VMs)
  #  Expected: custom resolutions work up to 2560×1600; taller sizes clamped
  # ══════════════════════════════════════════════════════════════════════════
  macos:
    runs-on: macos-latest
    steps:
      - name: 🔍 Inspect current display state
        run: |
          echo "──────────────────────────────────────────────────────"
          echo "Current display info:"
          echo "──────────────────────────────────────────────────────"
          system_profiler SPDisplaysDataType 2>/dev/null | \
            grep -E "Resolution|Framebuffer|VRAM|Display Type|Vendor|Model" || true
          echo ""
          echo "vmware-resolutionSet location:"
          ls "/Library/Application Support/VMware Tools/" 2>/dev/null || \
            echo "  ⚠️  VMware Tools not found at expected path"

      - name: 🧪 Test — vmware-resolutionSet with arbitrary resolutions
        run: |
          echo "──────────────────────────────────────────────────────"
          echo "TEST: Set custom resolutions via vmware-resolutionSet"
          echo "──────────────────────────────────────────────────────"

          RESOLUTIONSET="/Library/Application Support/VMware Tools/vmware-resolutionSet"

          if [ ! -f "$RESOLUTIONSET" ]; then
            echo "  ❌ vmware-resolutionSet not available on this runner."
            echo "  This runner may not be a VMware VM, or tools path changed."
            echo "MACOS_TOOL_AVAILABLE=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "MACOS_TOOL_AVAILABLE=true" >> $GITHUB_ENV

          get_resolution() {
            system_profiler SPDisplaysDataType 2>/dev/null | \
              grep "Resolution:" | head -1 | \
              sed 's/.*Resolution: //' | \
              sed 's/ x /x/' | \
              awk '{print $1}' | tr -d ' '
          }

          PASS=0
          FAIL=0
          CLAMPED=0

          test_resolution() {
            local W=$1 H=$2
            local OUTPUT
            OUTPUT=$("$RESOLUTIONSET" "$W" "$H" 2>&1)
            sleep 2  # VMware needs time to apply

            REQUESTED=$(echo "$OUTPUT" | grep "Requested resolution:" | \
              grep -oE '[0-9]+x[0-9]+' | head -1)
            EFFECTIVE=$(echo "$OUTPUT" | grep "Effective resolution:" | \
              grep -oE '[0-9]+x[0-9]+' | head -1)

            # Also check system_profiler as ground truth
            sleep 1
            ACTUAL=$(get_resolution)

            if [ "$EFFECTIVE" = "${W}x${H}" ]; then
              echo "  ✅ ${W}x${H}  →  effective: ${EFFECTIVE}  (system: ${ACTUAL:-unknown})"
              PASS=$((PASS+1))
            elif [ -n "$EFFECTIVE" ] && [ "$EFFECTIVE" != "${W}x${H}" ]; then
              echo "  🟡 ${W}x${H}  →  CLAMPED to ${EFFECTIVE}  (system: ${ACTUAL:-unknown})"
              CLAMPED=$((CLAMPED+1))
            else
              echo "  ❌ ${W}x${H}  →  failed. Output: $(echo "$OUTPUT" | tr '\n' ' ')"
              FAIL=$((FAIL+1))
            fi
          }

          # Standard-ish sizes
          test_resolution 1280 800
          test_resolution 1440 900
          test_resolution 1920 1080
          test_resolution 1920 1200
          test_resolution 2560 1440

          # Unusual / viewport-matching sizes
          test_resolution 1337 919
          test_resolution 1111 777
          test_resolution 1366 768
          test_resolution 1600 1024

          # Near/at/above the known 2560×1600 ceiling
          test_resolution 2560 1600   # Known max height
          test_resolution 2560 1800   # Should clamp height to 1600
          test_resolution 1920 1700   # Should clamp

          echo ""
          echo "MACOS_PASS=${PASS}" >> $GITHUB_ENV
          echo "MACOS_FAIL=${FAIL}" >> $GITHUB_ENV
          echo "MACOS_CLAMPED=${CLAMPED}" >> $GITHUB_ENV

      - name: 📊 macOS Summary
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  macOS RESULTS"
          echo "══════════════════════════════════════════════════════"
          if [ "$MACOS_TOOL_AVAILABLE" = "false" ]; then
            echo "  ⚠️  vmware-resolutionSet not found. Cannot test."
          else
            echo "  ✅ Exact match:   $MACOS_PASS"
            echo "  🟡 Clamped:       $MACOS_CLAMPED  (size was adjusted by VMware)"
            echo "  ❌ Failed:        $MACOS_FAIL"
            echo ""
            echo "  Known VMware constraint: max height ~1600px."
            echo "  Widths up to 2560 and unusual aspect ratios generally work."
            echo "  NOT suitable for arbitrary viewport matching > 1600px tall."
          fi
          echo "══════════════════════════════════════════════════════"


  # ══════════════════════════════════════════════════════════════════════════
  #  WINDOWS — ChangeDisplaySettingsEx + EnumDisplaySettings via PowerShell
  #  Expected: limited to modes the virtual display driver enumerates
  #  (arbitrary sizes unlikely without a virtual display driver like parsec-vdd)
  # ══════════════════════════════════════════════════════════════════════════
  windows:
    runs-on: windows-latest
    steps:
      - name: 🔍 Inspect current display and enumerate supported modes
        shell: powershell
        run: |
          echo "──────────────────────────────────────────────────────"
          echo "Current display info:"
          echo "──────────────────────────────────────────────────────"
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;

          public class DisplayInfo {
            [DllImport("user32.dll")]
            public static extern bool EnumDisplaySettings(
              string deviceName, int modeNum, ref DEVMODE devMode);

            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
              public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields;
              public int dmPositionX, dmPositionY;
              public int dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
              public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight;
              public int dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType;
              public int dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
          }
"@
          $dm = New-Object DisplayInfo+DEVMODE
          $dm.dmSize = [System.Runtime.InteropServices.Marshal]::SizeOf($dm)

          # Current resolution
          [DisplayInfo]::EnumDisplaySettings($null, -1, [ref]$dm) | Out-Null
          Write-Host "Current: $($dm.dmPelsWidth) x $($dm.dmPelsHeight) @ $($dm.dmDisplayFrequency)Hz"

          # Enumerate all supported modes
          Write-Host ""
          Write-Host "All modes supported by this display driver:"
          $modes = @()
          $i = 0
          while ([DisplayInfo]::EnumDisplaySettings($null, $i, [ref]$dm)) {
            $modes += "$($dm.dmPelsWidth)x$($dm.dmPelsHeight)@$($dm.dmDisplayFrequency)Hz"
            $i++
          }
          $modes | Sort-Object -Unique | ForEach-Object { Write-Host "  $_" }
          Write-Host ""
          Write-Host "Total supported modes: $($modes.Count)"

      - name: 🧪 Test — ChangeDisplaySettingsEx with arbitrary resolutions
        shell: powershell
        run: |
          echo "──────────────────────────────────────────────────────"
          echo "TEST: ChangeDisplaySettingsEx arbitrary resolutions"
          echo "──────────────────────────────────────────────────────"

          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;

          public class DisplayChanger {
            public const int CDS_TEST    = 0x00000002;
            public const int CDS_UPDATEREGISTRY = 0x00000001;
            public const int DISP_CHANGE_SUCCESSFUL = 0;
            public const int DISP_CHANGE_BADMODE     = -2;
            public const int DISP_CHANGE_FAILED      = -1;
            public const int DM_PELSWIDTH  = 0x00080000;
            public const int DM_PELSHEIGHT = 0x00100000;
            public const int DM_BITSPERPEL = 0x00040000;

            [DllImport("user32.dll")]
            public static extern int ChangeDisplaySettings(ref DEVMODE devMode, int flags);

            [DllImport("user32.dll")]
            public static extern bool EnumDisplaySettings(
              string deviceName, int modeNum, ref DEVMODE devMode);

            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
              public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields;
              public int dmPositionX, dmPositionY;
              public int dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
              public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight;
              public int dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType;
              public int dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
          }
"@

          function Test-Resolution($W, $H) {
            $dm = New-Object DisplayChanger+DEVMODE
            $dm.dmSize       = [System.Runtime.InteropServices.Marshal]::SizeOf($dm)
            $dm.dmPelsWidth  = $W
            $dm.dmPelsHeight = $H
            $dm.dmBitsPerPel = 32
            $dm.dmFields     = [DisplayChanger]::DM_PELSWIDTH `
                               -bor [DisplayChanger]::DM_PELSHEIGHT `
                               -bor [DisplayChanger]::DM_BITSPERPEL

            # First test without applying (CDS_TEST)
            $testResult = [DisplayChanger]::ChangeDisplaySettings([ref]$dm, [DisplayChanger]::CDS_TEST)

            if ($testResult -eq [DisplayChanger]::DISP_CHANGE_SUCCESSFUL) {
              # Actually apply it
              $applyResult = [DisplayChanger]::ChangeDisplaySettings([ref]$dm, 0)
              Start-Sleep -Milliseconds 500

              # Read back actual resolution
              $check = New-Object DisplayChanger+DEVMODE
              $check.dmSize = [System.Runtime.InteropServices.Marshal]::SizeOf($check)
              [DisplayChanger]::EnumDisplaySettings($null, -1, [ref]$check) | Out-Null
              $actual = "$($check.dmPelsWidth)x$($check.dmPelsHeight)"

              if ($check.dmPelsWidth -eq $W -and $check.dmPelsHeight -eq $H) {
                Write-Host "  ✅ ${W}x${H}  →  applied: $actual"
                return "PASS"
              } else {
                Write-Host "  🟡 ${W}x${H}  →  accepted by CDS_TEST but actual: $actual"
                return "CLAMPED"
              }
            } else {
              $reason = switch ($testResult) {
                -2 { "BADMODE (not in driver's mode list)" }
                -1 { "FAILED" }
                default { "code $testResult" }
              }
              Write-Host "  ❌ ${W}x${H}  →  rejected: $reason"
              return "FAIL"
            }
          }

          $pass = 0; $fail = 0; $clamped = 0

          $sizes = @(
            @(1280, 720),
            @(1280, 800),
            @(1366, 768),
            @(1920, 1080),
            @(1600, 900),
            @(1440, 900),
            @(1337, 919),   # Arbitrary
            @(1111, 777),   # Arbitrary
            @(1500, 843),   # Arbitrary
            @(1234, 567),   # Arbitrary
            @(2560, 1440),
            @(3840, 2160)
          )

          foreach ($size in $sizes) {
            $result = Test-Resolution $size[0] $size[1]
            if ($result -eq "PASS")    { $pass++ }
            elseif ($result -eq "FAIL"){ $fail++ }
            else                        { $clamped++ }
          }

          # Restore a known good resolution
          $dm = New-Object DisplayChanger+DEVMODE
          $dm.dmSize = [System.Runtime.InteropServices.Marshal]::SizeOf($dm)
          $dm.dmPelsWidth = 1024; $dm.dmPelsHeight = 768; $dm.dmBitsPerPel = 32
          $dm.dmFields = [DisplayChanger]::DM_PELSWIDTH -bor [DisplayChanger]::DM_PELSHEIGHT -bor [DisplayChanger]::DM_BITSPERPEL
          [DisplayChanger]::ChangeDisplaySettings([ref]$dm, 0) | Out-Null

          Write-Host ""
          "WIN_PASS=$pass"    | Out-File -FilePath $env:GITHUB_ENV -Append
          "WIN_FAIL=$fail"    | Out-File -FilePath $env:GITHUB_ENV -Append
          "WIN_CLAMPED=$clamped" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 📊 Windows Summary
        shell: powershell
        run: |
          Write-Host "══════════════════════════════════════════════════════"
          Write-Host "  WINDOWS RESULTS"
          Write-Host "══════════════════════════════════════════════════════"
          Write-Host "  ✅ Exact match:   $env:WIN_PASS"
          Write-Host "  🟡 Accepted/clamped: $env:WIN_CLAMPED"
          Write-Host "  ❌ Rejected (BADMODE): $env:WIN_FAIL"
          Write-Host ""
          Write-Host "  ChangeDisplaySettingsEx is limited to modes the"
          Write-Host "  display driver enumerates. Arbitrary sizes that"
          Write-Host "  aren't in the driver's mode table will BADMODE."
          Write-Host "  For truly arbitrary resolutions on Windows you need"
          Write-Host "  a virtual display driver (e.g. parsec-vdd, IddSampleDriver)."
          Write-Host "══════════════════════════════════════════════════════"


  # ══════════════════════════════════════════════════════════════════════════
  #  FINAL VERDICT — summarise all three in one place
  # ══════════════════════════════════════════════════════════════════════════
  verdict:
    needs: [ubuntu, macos, windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📋 Cross-platform arbitrary resolution support verdict
        run: |
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║   ARBITRARY SCREEN RESIZE — FINAL VERDICT            ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║                                                      ║"
          echo "║  ubuntu-latest                                       ║"
          echo "║    Xvfb:   ✅ FULLY ARBITRARY (software framebuffer) ║"
          echo "║    xrandr: ✅ FULLY ARBITRARY (dummy video driver)   ║"
          echo "║    → Perfect for dynamic viewport-match resizing     ║"
          echo "║                                                      ║"
          echo "║  macos-latest                                        ║"
          echo "║    vmware-resolutionSet: 🟡 MOSTLY WORKS             ║"
          echo "║    → Custom sizes work up to 2560×1600               ║"
          echo "║    → Heights > 1600px are clamped by VMware          ║"
          echo "║    → Unusual aspect ratios (e.g. 1337×919) accepted  ║"
          echo "║                                                      ║"
          echo "║  windows-latest                                      ║"
          echo "║    ChangeDisplaySettingsEx: ❌ PRESET MODES ONLY     ║"
          echo "║    → Limited to what the display driver enumerates   ║"
          echo "║    → Arbitrary pixel dims rejected with BADMODE      ║"
          echo "║    → Need parsec-vdd / IddSampleDriver for arbitrary ║"
          echo "║                                                      ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  For your WebRTC + native messaging host project:    ║"
          echo "║  Linux = use Xvfb/dummy, full freedom                ║"
          echo "║  macOS = vmware-resolutionSet, most sizes fine       ║"
          echo "║  Windows = need virtual display driver (parsec-vdd)  ║"
          echo "╚══════════════════════════════════════════════════════╝"