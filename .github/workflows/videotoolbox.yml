name: Encode Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          brew update
          brew install ffmpeg

      - name: Generate test video (synthetic, consistent)
        run: |
          ffmpeg -f lavfi -i testsrc2=size=1280x720:rate=30 -t 20 -pix_fmt yuv420p input.mp4

      # ----------------------------
      # 🔥 X264 TEST
      # ----------------------------
      - name: Benchmark x264
        run: |
          echo "===== X264 TEST ====="
          /usr/bin/time -l ffmpeg -y -i input.mp4 \
            -c:v libx264 -preset ultrafast -tune zerolatency \
            -f mp4 x264.mp4 2>&1 | tee x264_log.txt

      # ----------------------------
      # ⚡ VIDEOTOOLBOX TEST
      # ----------------------------
      - name: Benchmark VideoToolbox
        run: |
          echo "===== VIDEOTOOLBOX TEST ====="
          /usr/bin/time -l ffmpeg -y -i input.mp4 \
            -vf format=nv12 \
            -c:v h264_videotoolbox \
            -realtime true \
            -prio_speed 1 \
            -allow_sw 0 \
            -b:v 2M -maxrate 2M -bufsize 2M \
            -f mp4 vt.mp4 2>&1 | tee vt_log.txt

      # ----------------------------
      # 📊 CPU + SYSTEM INFO
      # ----------------------------
      - name: Capture system stats
        run: |
          echo "===== SYSTEM INFO ====="
          sysctl -a | grep machdep.cpu > cpu_info.txt || true
          sysctl -a | grep hw.memsize >> cpu_info.txt || true

          echo "===== TOP SNAPSHOT ====="
          top -l 1 -n 0 > top.txt

      # ----------------------------
      # 📦 Upload results
      # ----------------------------
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            x264_log.txt
            vt_log.txt
            top.txt
            cpu_info.txt