name: Check VideoToolbox Hardware Usage (Swift)

on:
  workflow_dispatch:

jobs:
  check-videotoolbox-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: System info
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n hw.ncpu
          swift --version

      - name: Run VideoToolbox hardware check
        run: |
          swift check_videotoolbox.swift

      - name: Also try requiring hardware explicitly (should fail loudly if unavailable)
        run: |
          cat > check_videotoolbox_require_hw.swift << 'EOF'
          import Foundation
          import VideoToolbox
          import CoreMedia

          var session: VTCompressionSession?
          let spec: [CFString: Any] = [
              kVTVideoEncoderSpecification_EnableHardwareAcceleratedVideoEncoder: true,
              kVTVideoEncoderSpecification_RequireHardwareAcceleratedVideoEncoder: true
          ]
          let status = VTCompressionSessionCreate(
              allocator: kCFAllocatorDefault,
              width: 1920, height: 1080,
              codecType: kCMVideoCodecType_H264,
              encoderSpecification: spec as CFDictionary,
              imageBufferAttributes: nil,
              compressedDataAllocator: nil,
              outputCallback: nil,
              refcon: nil,
              compressionSessionOut: &session
          )
          if status == noErr {
              print("Session created with REQUIRE_HARDWARE=true — hardware encoder is genuinely available.")
          } else {
              print("Session creation FAILED with REQUIRE_HARDWARE=true, status: \(status)")
              print("This confirms no real hardware encoder is reachable in this environment.")
          }
          EOF
          swift check_videotoolbox_require_hw.swift