name: Test macOS Screen Sizes

on:
  workflow_dispatch:

jobs:
  test-resolutions:
    runs-on: macos-latest

    steps:
      - name: Show initial display info
        run: |
          system_profiler SPDisplaysDataType

      - name: Test a few resolutions
        shell: bash
        run: |
          set -e

          tool="/Library/Application Support/VMware Tools/vmware-resolutionSet"

          if [ ! -x "$tool" ]; then
            echo "vmware-resolutionSet not found or not executable"
            ls -l "/Library/Application Support/VMware Tools" || true
            exit 1
          fi

          try_res() {
            w="$1"
            h="$2"
            echo "Trying ${w}x${h}"
            "$tool" "$w" "$h" || true
            sleep 2
            echo "Reported after trying ${w}x${h}:"
            system_profiler SPDisplaysDataType | sed -n '/Resolution:/p'
          }

          try_res 2560 1440
          try_res 1080 2160
          try_res 1920 1080
          try_res 3840 2160

      - name: Final display info
        run: |
          system_profiler SPDisplaysDataType