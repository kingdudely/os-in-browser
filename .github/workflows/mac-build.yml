name: Build libwebrtc-mac-arm64-release

on:
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: "webrtc-sdk/webrtc branch to build"
        required: true
        default: "m144_release"
      libwebrtc_ref:
        description: "webrtc-sdk/libwebrtc ref (branch/tag) to build against"
        required: true
        default: "main"
      audio_patch:
        description: "Patch file name in libwebrtc/patches to apply (blank to skip)"
        required: false
        default: "custom_audio_source_m144.patch"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Create .gclient checkout
        run: |
          mkdir -p "$HOME/libwebrtc_build"
          cat > "$HOME/libwebrtc_build/.gclient" <<EOF
          solutions = [
            {
              "name"        : 'src',
              "url"         : 'https://github.com/webrtc-sdk/webrtc.git@${{ inputs.webrtc_branch }}',
              "deps_file"   : 'DEPS',
              "managed"     : False,
              "custom_deps" : {},
              "custom_vars": {},
            },
          ]
          target_os = ['mac']
          EOF

      - name: gclient sync
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          cd "$HOME/libwebrtc_build"
          gclient sync --nohooks --no-history -j"$(sysctl -n hw.ncpu)"
          cd src
          gclient runhooks

      - name: Clone webrtc-sdk/libwebrtc wrapper
        run: |
          cd "$HOME/libwebrtc_build/src"
          git clone --branch "${{ inputs.libwebrtc_ref }}" https://github.com/webrtc-sdk/libwebrtc.git

      - name: Apply audio custom source patch
        if: ${{ inputs.audio_patch != '' }}
        run: |
          cd "$HOME/libwebrtc_build/src"
          git apply "libwebrtc/patches/${{ inputs.audio_patch }}"

      - name: Wire libwebrtc into the default build group
        run: |
          cd "$HOME/libwebrtc_build/src"
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("BUILD.gn")
          s = p.read_text()
          s2 = s.replace('deps = [ ":webrtc" ]', 'deps = [ ":webrtc","//libwebrtc", ]')
          if s2 == s and '"//libwebrtc"' not in s:
              raise SystemExit("Expected deps line not found — libwebrtc BUILD.gn convention may have changed, patch manually")
          p.write_text(s2)
          PY

      - name: gn gen (mac arm64, release)
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$HOME/libwebrtc_build/src"
          gn gen out/mac-arm64-release --args='
            target_os="mac"
            target_cpu="arm64"
            is_debug=false
            is_component_build=true
            use_rtti=true
            use_custom_libcxx=false
            rtc_include_tests=false
            rtc_build_examples=false
            rtc_use_h264=false
            rtc_enable_protobuf=false
            rtc_enable_symbol_export=true
            rtc_libvpx_build_vp9=true
            enable_dsyms=false
            enable_stripping=true
            libwebrtc_desktop_capture=true
          '

      - name: ninja build libwebrtc
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$HOME/libwebrtc_build/src"
          ninja -C out/mac-arm64-release libwebrtc

      - name: Package release archive
        run: |
          cd "$HOME/libwebrtc_build/src"
          STAGE="$RUNNER_TEMP/libwebrtc-mac-arm64-release"
          mkdir -p "$STAGE/include"
          find out/mac-arm64-release -maxdepth 1 -name '*.dylib' -exec cp {} "$STAGE/" \;
          cp -R libwebrtc/include/. "$STAGE/include/"
          cd "$RUNNER_TEMP"
          tar -czf libwebrtc-mac-arm64-release.tar.gz libwebrtc-mac-arm64-release
          shasum -a 256 libwebrtc-mac-arm64-release.tar.gz | tee libwebrtc-mac-arm64-release.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libwebrtc-mac-arm64-release
          path: |
            ${{ runner.temp }}/libwebrtc-mac-arm64-release.tar.gz
            ${{ runner.temp }}/libwebrtc-mac-arm64-release.tar.gz.sha256
          retention-days: 14
