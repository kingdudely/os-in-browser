name: Build libwebrtc-mac-arm64-release

on:
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: "webrtc-sdk/webrtc branch to build"
        required: true
        default: "m144_release"
      libwebrtc_ref:
        description: "webrtc-sdk/libwebrtc ref (branch/tag) to build against"
        required: true
        default: "main"
      audio_patch:
        description: "Patch file name in libwebrtc/patches to apply (blank to skip)"
        required: false
        default: "custom_audio_source_m144.patch"

# Full checkout + build is large (30-40GB) and slow (1-2h+), well past the
# default 6h job timeout margin on a cold cache, so give it room.
jobs:
  build:
    # macos-14 only has 3 vCPU — that's the actual bottleneck for the ninja
    # compile step (CPU-bound, thousands of TUs). If your org has access to
    # larger macOS runners (Team/Enterprise), switch to e.g.
    # macos-14-xlarge — build time scales close to linearly with cores.
    runs-on: macos-14 # arm64 (Apple Silicon) hosted runner
    timeout-minutes: 360
    env:
      GYP_MSVS_VERSION: ""  # n/a on mac, kept for parity with libwebrtc docs
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /Applications/Xcode_15*.app || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          df -h

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Create .gclient checkout (webrtc-sdk fork, not full chromium)
        run: |
          mkdir -p "$HOME/libwebrtc_build"
          cat > "$HOME/libwebrtc_build/.gclient" <<EOF
          solutions = [
            {
              "name"        : 'src',
              "url"         : 'https://github.com/webrtc-sdk/webrtc.git@${{ inputs.webrtc_branch }}',
              "deps_file"   : 'DEPS',
              "managed"     : False,
              "custom_deps" : {},
              "custom_vars": {},
            },
          ]
          target_os = ['mac']
          EOF

      - name: gclient sync
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          cd "$HOME/libwebrtc_build"
          # This solution URL is webrtc-sdk/webrtc.git, not chromium/src or
          # googlesource webrtc — DEPS here is already scoped to just the
          # WebRTC tree, so this was never pulling full Chromium. --no-history
          # strips .git after fetch (biggest single win, since CI never needs
          # blame/log). target_os=['mac'] in .gclient makes DEPS skip
          # win/linux/android-only deps and hooks automatically.
          gclient sync --nohooks --no-history -j"$(sysctl -n hw.ncpu)"
          cd src
          gclient runhooks

      - name: Clone webrtc-sdk/libwebrtc wrapper
        working-directory: ${{ github.workspace }}
        run: |
          cd "$HOME/libwebrtc_build/src"
          git clone --branch "${{ inputs.libwebrtc_ref }}" https://github.com/webrtc-sdk/libwebrtc.git

      - name: Apply audio custom source patch
        if: ${{ inputs.audio_patch != '' }}
        run: |
          cd "$HOME/libwebrtc_build/src"
          git apply "libwebrtc/patches/${{ inputs.audio_patch }}"

      - name: Wire libwebrtc into the default build group
        run: |
          cd "$HOME/libwebrtc_build/src"
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("BUILD.gn")
          s = p.read_text()
          s2 = s.replace('deps = [ ":webrtc" ]', 'deps = [ ":webrtc","//libwebrtc", ]')
          if s2 == s:
              raise SystemExit("Expected deps line not found — libwebrtc BUILD.gn convention may have changed, patch manually")
          p.write_text(s2)
          PY

      - name: Install ccache
        run: brew install ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # Doesn't speed up the very first build, but every re-run after
          # this (patch tweaks, retries, version bumps) only recompiles
          # what actually changed instead of the whole tree from scratch.
          key: ccache-mac-arm64-${{ inputs.webrtc_branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-mac-arm64-${{ inputs.webrtc_branch }}-

      - name: gn gen (mac arm64, release)
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache --max-size=5G
          cd "$HOME/libwebrtc_build/src"
          gn gen out/mac-arm64-release --args='
            target_os="mac"
            target_cpu="arm64"
            is_debug=false
            is_component_build=true
            use_rtti=true
            use_custom_libcxx=false
            rtc_include_tests=false
            rtc_build_examples=false
            rtc_use_h264=false
            rtc_enable_protobuf=false
            rtc_enable_symbol_export=true
            rtc_libvpx_build_vp9=true
            enable_dsyms=false
            enable_stripping=true
            libwebrtc_desktop_capture=true
            cc_wrapper="ccache"
          '

      - name: ninja build libwebrtc
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd "$HOME/libwebrtc_build/src"
          ninja -C out/mac-arm64-release libwebrtc

      - name: Package release archive (matches linux/win layout)
        run: |
          cd "$HOME/libwebrtc_build/src"
          STAGE="$RUNNER_TEMP/libwebrtc-mac-arm64-release"
          mkdir -p "$STAGE/include"
          find out/mac-arm64-release -maxdepth 1 -name '*.dylib' -exec cp {} "$STAGE/" \;
          # Same include/ layout as libwebrtc-linux-x64-release and
          # libwebrtc-win-x64-release: libwebrtc.h, rtc_*.h, helper.h, base/
          cp -R libwebrtc/include/. "$STAGE/include/"
          cd "$RUNNER_TEMP"
          tar -czf libwebrtc-mac-arm64-release.tar.gz libwebrtc-mac-arm64-release
          shasum -a 256 libwebrtc-mac-arm64-release.tar.gz | tee libwebrtc-mac-arm64-release.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libwebrtc-mac-arm64-release
          path: |
            ${{ runner.temp }}/libwebrtc-mac-arm64-release.tar.gz
            ${{ runner.temp }}/libwebrtc-mac-arm64-release.tar.gz.sha256
          retention-days: 14
