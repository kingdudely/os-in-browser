name: Chrome Remote Desktop
on:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system"
        required: true
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
      crd_command:
        description: "Command from remotedesktop.google.com/headless (any format — code will be extracted)"
        required: true
        type: string
      pin:
        description: "PIN to access the session (minimum 6 digits)"
        required: true
        type: string

jobs:
  session:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    steps:
      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Setup Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install chrome-remote-desktop-host -y --no-progress # "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
          Add-Content -Path $Env:GITHUB_ENV -Value "CHROME_REMOTE_DESKTOP=${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

      - name: Setup Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Install Chrome Remote Desktop
          curl -fsSL \
            "https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb" \
            -o /tmp/chrome-remote-desktop.deb
          sudo apt-get update
          sudo apt-get install -y xvfb xterm /tmp/chrome-remote-desktop.deb

          read -r DISPLAY_NUMBER < <(exec Xvfb -displayfd 1)

          export DISPLAY=":${DISPLAY_NUMBER}"
          echo "DISPLAY=$DISPLAY" >> "${GITHUB_ENV}"
          echo "CHROME_REMOTE_DESKTOP=/opt/google/chrome-remote-desktop/start-host" >> "${GITHUB_ENV}"

          xterm &

      - name: Start Chrome Remote Desktop
        shell: bash
        run: |
          raw='${{ github.event.inputs.crd_command }}'
          code=$(echo "$raw" | grep -oP '(?<=--code=")[^"]+')
          if [ -z "$code" ]; then
            code=$(echo "$raw" | xargs)
          fi

          "${CHROME_REMOTE_DESKTOP}" \
            --code="$code" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name="$(hostname)" \
            --pin="${{ github.event.inputs.pin }}"

          # Keep alive
          echo "Connect at: https://remotedesktop.google.com/access"
          sleep infinity