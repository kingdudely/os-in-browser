name: Chrome Remote Desktop
on:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system"
        required: true
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
      crd_command:
        description: "Command from remotedesktop.google.com/headless (any format — code will be extracted)"
        required: true
      pin:
        description: "PIN to access the session (minimum 6 digits)"
        required: true

jobs:
  session:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 360

    steps:
      - name: Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Install Chrome Remote Desktop
          $installer = "$env:TEMP\chromeremotedesktop.msi"
          Invoke-WebRequest `
            -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
            -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait

          # Start Chrome Remote Desktop
          $raw = '${{ github.event.inputs.crd_command }}'
          if ($raw -notmatch '--code="([^"]+)"') {
            Write-Error "Could not extract --code from the provided command."
            exit 1
          }
          $code = $Matches[1]
          $pin  = '${{ github.event.inputs.pin }}'

          & "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe" `
            --code="$code" `
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" `
            --name="$Env:COMPUTERNAME" `
            --pin="$pin"

          # Keep alive
          Write-Host "Connect at: https://remotedesktop.google.com/access"
          Wait-Event

      - name: Ubuntu
        if: runner.os == 'Linux'
        run: |
          # Install Chrome Remote Desktop
          curl -fsSL \
            "https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb" \
            -o /tmp/chrome-remote-desktop.deb
          sudo apt-get install -y /tmp/chrome-remote-desktop.deb

          # Setup virtual display
          sudo apt-get install -y xvfb xfce4 xfce4-goodies dbus-x11
 
          PIPE=$(mktemp -u)
          mkfifo "$PIPE"
          Xvfb -displayfd 3 -screen 0 1920x1080x24 3>"$PIPE" &
          export DISPLAY=:$(head -1 "$PIPE")
          rm "$PIPE"
 
          startxfce4 &

          # Start Chrome Remote Desktop
          raw='${{ github.event.inputs.crd_command }}'
          code=$(echo "$raw" | grep -oP '(?<=--code=")[^"]+')
          if [ -z "$code" ]; then
            echo "Error: could not extract --code from the provided command."
            exit 1
          fi

          /opt/google/chrome-remote-desktop/start-host \
            --code="$code" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name="$(hostname)" \
            --pin="${{ github.event.inputs.pin }}"

          # Keep alive
          echo "Connect at: https://remotedesktop.google.com/access"
          sleep infinity