name: Test Public IP Reachability

on:
  workflow_dispatch:

jobs:
  test-reachability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get public IP
        id: ip
        shell: bash
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "public_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Public IP: $IP"

      # ---- Linux ----
      - name: Open firewall (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo ufw allow 8765/tcp || true
          sudo iptables -I INPUT -p tcp --dport 8765 -j ACCEPT || true

      - name: Start listener (ubuntu/macos)
        if: matrix.os != 'windows-latest'
        run: |
          echo "hello from ${{ matrix.os }} runner" > index.html
          nohup python3 -m http.server 8765 > server.log 2>&1 &
          sleep 2
          echo "Listener started"

      # ---- macOS ----
      - name: Open firewall (macos)
        if: matrix.os == 'macos-latest'
        run: |
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off || true

      # ---- Windows ----
      - name: Open firewall + start listener (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-NetFirewallRule -DisplayName "AllowTest8765" -Direction Inbound -LocalPort 8765 -Protocol TCP -Action Allow
          Start-Process powershell -ArgumentList '-Command Set-Content -Path index.html -Value "hello from windows-latest runner"; python -m http.server 8765'
          Start-Sleep -Seconds 3

      - name: Print test URL and wait
        shell: bash
        run: |
          echo "=================================================="
          echo "Test this URL from YOUR machine right now:"
          echo "http://${{ steps.ip.outputs.public_ip }}:8765/"
          echo "curl -m 5 http://${{ steps.ip.outputs.public_ip }}:8765/"
          echo "=================================================="
          echo "Sleeping 5 minutes so you have time to test..."
          sleep 300

      - name: Job summary
        shell: bash
        run: |
          echo "### ${{ matrix.os }} — public IP" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.ip.outputs.public_ip }}:8765\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Did the curl from your machine succeed? Note the result here manually." >> "$GITHUB_STEP_SUMMARY"