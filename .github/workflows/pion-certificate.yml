name: Generate static Pion certificate

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: openssl version
      - name: Generate cert (never expires, per RFC 5280)
        run: |
          openssl req -new -x509 -newkey rsa:2048 -noenc \
            -keyout key.pem -out cert.pem \
            -subj "/CN=pion-webrtc-static-cert" \
            -not_after 99991231235959Z

          openssl x509 -in cert.pem -noout -fingerprint -sha256 \
            | sed 's/sha256 Fingerprint=//' > docs/fingerprint.txt

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Generate static Pion certificate"
          file_pattern: "cert.pem key.pem docs/fingerprint.txt"