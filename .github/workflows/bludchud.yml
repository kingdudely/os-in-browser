name: chrome-webrtc-screen

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Install cloudflared
        run: brew install cloudflared

      - name: Write signaling + viewer server
        run: |
          cat > server.py << 'PYEOF'
          import asyncio, json, uuid
          from aiohttp import web

          pending = {}   # id -> offer sdp
          answers = {}   # id -> answer sdp

          async def offer(request):
              data = await request.json()
              sid = str(uuid.uuid4())
              pending[sid] = data["sdp"]
              return web.json_response({"id": sid})

          async def get_offer(request):
              sid = request.query.get("id")
              if sid not in pending:
                  return web.json_response({}, status=404)
              return web.json_response({"sdp": pending[sid]})

          async def answer(request):
              data = await request.json()
              sid = data["id"]
              answers[sid] = data["sdp"]
              return web.json_response({"ok": True})

          async def get_answer(request):
              sid = request.query.get("id")
              if sid not in answers:
                  return web.json_response({}, status=404)
              return web.json_response({"sdp": answers[sid]})

          async def viewer(request):
              return web.Response(text=VIEWER_HTML, content_type="text/html")

          async def sender(request):
              return web.Response(text=SENDER_HTML, content_type="text/html")

          VIEWER_HTML = """
          <!doctype html><html><body style="margin:0;background:#111">
          <video id=v autoplay playsinline style="width:100vw;height:100vh;object-fit:contain"></video>
          <script>
          const params = new URLSearchParams(location.search);
          const id = params.get('id');
          const pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
          pc.ontrack = e => { document.getElementById('v').srcObject = e.streams[0]; };
          async function run() {
            let offerData;
            while (true) {
              const r = await fetch('/get_offer?id=' + id);
              if (r.status === 200) { offerData = await r.json(); break; }
              await new Promise(r => setTimeout(r, 1000));
            }
            await pc.setRemoteDescription({type:'offer', sdp: offerData.sdp});
            const ans = await pc.createAnswer();
            await pc.setLocalDescription(ans);
            await fetch('/answer', {method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({id, sdp: pc.localDescription.sdp})});
          }
          run();
          </script>
          </body></html>
          """

          SENDER_HTML = """
          <!doctype html><html><body>
          <script>
          async function run() {
            const stream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:false});
            const pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await new Promise(r => setTimeout(r, 1500)); // let ICE gather
            const resp = await fetch('/offer', {method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({sdp: pc.localDescription.sdp})});
            const {id} = await resp.json();
            document.title = 'SESSION_ID:' + id;
            while (true) {
              const r = await fetch('/get_answer?id=' + id);
              if (r.status === 200) {
                const {sdp} = await r.json();
                await pc.setRemoteDescription({type:'answer', sdp});
                break;
              }
              await new Promise(r => setTimeout(r, 1000));
            }
          }
          run();
          </script>
          </body></html>
          """

          app = web.Application()
          app.router.add_post('/offer', offer)
          app.router.add_get('/get_offer', get_offer)
          app.router.add_post('/answer', answer)
          app.router.add_get('/get_answer', get_answer)
          app.router.add_get('/viewer', viewer)
          app.router.add_get('/', sender)

          web.run_app(app, host='127.0.0.1', port=8080)
          PYEOF

      - name: Start signaling server
        run: |
          python3 -m pip install aiohttp --break-system-packages --quiet
          nohup python3 server.py > server.log 2>&1 &
          sleep 2

      - name: Start cloudflared tunnel
        run: |
          nohup cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cloudflared.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' cloudflared.log | head -n1)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
          echo "Tunnel URL: $URL"

      - name: Launch Chrome with getDisplayMedia
        run: |
          open -a "Google Chrome" --args \
            --auto-select-desktop-capture-source="Entire screen" \
            --use-fake-ui-for-media-stream \
            --autoplay-policy=no-user-gesture-required \
            --disable-features=IsolateOrigins,site-per-process \
            "$TUNNEL_URL/"
          sleep 5

      - name: Print viewer link
        run: |
          echo "Open this to view the screen:"
          echo "$TUNNEL_URL/viewer?id=<check chrome tab title for SESSION_ID>"
          echo "---- cloudflared log ----"
          cat cloudflared.log

      - name: Keep session alive
        run: sleep 3000