name: Deploy SPA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>GitHub App SPA Auth Test</title>
          </head>
          <body>
            <h1>GitHub App SPA Auth Test</h1>
            <p>Open the console to see output. Click below to start login.</p>
            <button id="login">Log in with GitHub</button>
            <pre id="output"></pre>

            <script>
            document.getElementById('login').addEventListener('click', run);
            // Auto-run if we're coming back with a ?code= param
            if (new URL(window.location.href).searchParams.get('code')) {
              run();
            }

            async function run() {
              const CLIENT_ID = 'Iv23liyBVjlZRV5r16UD';
              const REDIRECT_URI = window.location.origin + window.location.pathname;

              const b64url = (buf) =>
                btoa(String.fromCharCode(...new Uint8Array(buf)))
                  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

              const url = new URL(window.location.href);
              const code = url.searchParams.get('code');
              const state = url.searchParams.get('state');

              if (!code) {
                const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
                const challengeBuf = await crypto.subtle.digest(
                  'SHA-256', new TextEncoder().encode(verifier)
                );
                const challenge = b64url(challengeBuf);
                const randState = b64url(crypto.getRandomValues(new Uint8Array(16)));

                sessionStorage.setItem('pkce_verifier', verifier);
                sessionStorage.setItem('pkce_state', randState);

                const authUrl = new URL('https://github.com/login/oauth/authorize');
                authUrl.searchParams.set('client_id', CLIENT_ID);
                authUrl.searchParams.set('redirect_uri', REDIRECT_URI);
                authUrl.searchParams.set('state', randState);
                authUrl.searchParams.set('code_challenge', challenge);
                authUrl.searchParams.set('code_challenge_method', 'S256');

                console.log('Redirecting to GitHub for auth...');
                window.location.href = authUrl.toString();
                return;
              }

              const savedState = sessionStorage.getItem('pkce_state');
              const verifier = sessionStorage.getItem('pkce_verifier');

              if (state !== savedState) {
                console.error('State mismatch! Possible CSRF, aborting.');
                document.getElementById('output').textContent = 'State mismatch, aborting.';
                return;
              }

              const res = await fetch('https://github.com/login/oauth/access_token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                  client_id: CLIENT_ID,
                  code,
                  redirect_uri: REDIRECT_URI,
                  code_verifier: verifier,
                }),
              });

              const data = await res.json();
              console.log('Token exchange response:', data);
              document.getElementById('output').textContent = JSON.stringify(data, null, 2);

              sessionStorage.removeItem('pkce_verifier');
              sessionStorage.removeItem('pkce_state');

              window.history.replaceState({}, document.title, REDIRECT_URI);
            }
            </script>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
