name: Chrome getDisplayMedia Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-getdisplaymedia:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Create test HTML page
        run: |
          cat > test.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>getDisplayMedia Test</title></head>
          <body>
          <script>
            (async () => {
              const log = (msg) => {
                console.log(msg);
                document.title = msg; // used so we can poll via CDP/title if needed
              };
              try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                  log('RESULT:FAIL:getDisplayMedia not available');
                  return;
                }
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const tracks = stream.getVideoTracks();
                log('RESULT:SUCCESS:' + tracks.length + ' track(s), label=' + (tracks[0] ? tracks[0].label : 'none'));
                tracks.forEach(t => t.stop());
              } catch (err) {
                log('RESULT:FAIL:' + err.name + ':' + err.message);
              }
            })();
          </script>
          </body>
          </html>
          EOF

      - name: Run via Puppeteer for reliable result capture
        run: |
          npm init -y > /dev/null 2>&1
          npm install puppeteer-core > /dev/null 2>&1

          cat > run.js << 'EOF'
          const puppeteer = require('puppeteer-core');
          const path = require('path');

          (async () => {
            const chromePath = process.env.CHROME_PATH || require('child_process')
              .execSync('which google-chrome || which chromium-browser || which chromium || echo "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"')
              .toString().trim();

            console.log('Using Chrome at:', chromePath);

            const browser = await puppeteer.launch({
              executablePath: chromePath,
              headless: 'new',
              args: [
                '--no-sandbox',
                '--disable-dev-shm-usage',
                '--disable-gpu',
                '--use-fake-ui-for-media-stream',
                '--use-fake-device-for-media-stream',
                '--auto-select-desktop-capture-source=Entire screen',
                '--enable-usermedia-screen-capturing',
                '--allow-http-screen-capture',
                '--auto-accept-this-tab-capture',
                '--window-size=1920,1080',
              ],
            });

            const page = await browser.newPage();

            page.on('console', (msg) => console.log('PAGE LOG:', msg.text()));

            await page.goto('file://' + path.resolve('test.html'));

            // Wait for the title to be set to a RESULT: string, with a hard timeout
            await page.waitForFunction(
              () => document.title.startsWith('RESULT:'),
              { timeout: 15000 }
            );

            const title = await page.title();
            console.log('FINAL RESULT:', title);

            await browser.close();

            if (title.includes('FAIL')) {
              process.exit(1);
            }
          })().catch(async (err) => {
            console.error('Script error:', err);
            process.exit(1);
          });
          EOF

          CHROME_PATH=$(which google-chrome || which chromium-browser || which chromium || echo "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome") node run.js