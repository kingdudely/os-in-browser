name: chrome-getdisplaymedia-webrtc-cloudflared

on:
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Install cloudflared
        run: brew install cloudflared

      - name: Install deps
        run: |
          node -v || brew install node
          npm init -y
          npm install ws

      - name: Write signaling/broadcast/view server
        run: |
          cat > server.js <<'EOF'
          const http = require('http');
          const WebSocket = require('ws');

          const PORT = 8085;

          const BROADCAST_HTML = `<!doctype html><html><body>
          <script>
          const ws = new WebSocket('ws://localhost:${PORT}');
          let pc;
          ws.onopen = () => ws.send(JSON.stringify({role:'broadcaster'}));
          ws.onmessage = async (ev) => {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'viewer-ready') {
              pc = new RTCPeerConnection();
              pc.onicecandidate = (e) => {
                if (e.candidate) ws.send(JSON.stringify({type:'candidate', candidate:e.candidate, role:'broadcaster'}));
              };
              const stream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:false});
              stream.getTracks().forEach(t => pc.addTrack(t, stream));
              const offer = await pc.createOffer();
              await pc.setLocalDescription(offer);
              ws.send(JSON.stringify({type:'offer', sdp: offer, role:'broadcaster'}));
            } else if (msg.type === 'answer') {
              await pc.setRemoteDescription(msg.sdp);
            } else if (msg.type === 'candidate' && msg.role === 'viewer') {
              await pc.addIceCandidate(msg.candidate);
            }
          };
          </script>
          </body></html>`;

          const VIEW_HTML = `<!doctype html><html><body>
          <video id="v" autoplay playsinline controls style="width:100%"></video>
          <script>
          const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
          const ws = new WebSocket(proto + location.host);
          let pc;
          ws.onopen = () => ws.send(JSON.stringify({role:'viewer', type:'viewer-ready'}));
          ws.onmessage = async (ev) => {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'offer') {
              pc = new RTCPeerConnection();
              pc.ontrack = (e) => { document.getElementById('v').srcObject = e.streams[0]; };
              pc.onicecandidate = (e) => {
                if (e.candidate) ws.send(JSON.stringify({type:'candidate', candidate:e.candidate, role:'viewer'}));
              };
              await pc.setRemoteDescription(msg.sdp);
              const answer = await pc.createAnswer();
              await pc.setLocalDescription(answer);
              ws.send(JSON.stringify({type:'answer', sdp: answer, role:'viewer'}));
            } else if (msg.type === 'candidate' && msg.role === 'broadcaster') {
              await pc.addIceCandidate(msg.candidate);
            }
          };
          </script>
          </body></html>`;

          const server = http.createServer((req, res) => {
            if (req.url === '/broadcast') {
              res.writeHead(200, {'Content-Type':'text/html'});
              res.end(BROADCAST_HTML);
            } else {
              res.writeHead(200, {'Content-Type':'text/html'});
              res.end(VIEW_HTML);
            }
          });

          const wss = new WebSocket.Server({ server });
          let broadcaster = null;
          let viewer = null;

          wss.on('connection', (ws) => {
            ws.on('message', (data) => {
              const msg = JSON.parse(data);
              if (msg.role === 'broadcaster') broadcaster = ws;
              if (msg.role === 'viewer') viewer = ws;

              if (msg.type === 'viewer-ready' && broadcaster) {
                broadcaster.send(JSON.stringify(msg));
              } else if (msg.type === 'offer' && viewer) {
                viewer.send(JSON.stringify(msg));
              } else if (msg.type === 'answer' && broadcaster) {
                broadcaster.send(JSON.stringify(msg));
              } else if (msg.type === 'candidate') {
                if (msg.role === 'broadcaster' && viewer) viewer.send(JSON.stringify(msg));
                if (msg.role === 'viewer' && broadcaster) broadcaster.send(JSON.stringify(msg));
              }
            });
          });

          server.listen(PORT, () => console.log('signaling server up on ' + PORT));
          EOF

      - name: Start signaling server
        run: node server.js &

      - name: Start cloudflared tunnel
        run: |
          cloudflared tunnel --url http://localhost:8085 --no-autoupdate > cloudflared.log 2>&1 &
          sleep 8
          cat cloudflared.log
          grep -o 'https://[a-zA-Z0-9.-]*trycloudflare.com' cloudflared.log | head -n1 > tunnel_url.txt
          echo "Public viewer URL: $(cat tunnel_url.txt)"

      - name: Launch Chrome broadcaster tab
        run: |
          open -na "Google Chrome" --args \
            --auto-select-desktop-capture-source="Entire screen" \
            --use-fake-ui-for-media-stream \
            --auto-accept-this-tab-capture \
            --enable-usermedia-screen-capturing \
            --autoplay-policy=no-user-gesture-required \
            --new-window "http://localhost:8085/broadcast"
          sleep 5

      - name: Print viewer link
        run: |
          echo "Open this URL in a browser to watch the screen:"
          cat tunnel_url.txt

      - name: Keep session alive for viewing
        run: sleep 1500