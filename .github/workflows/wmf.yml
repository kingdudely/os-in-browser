name: Test Windows Media Foundation availability

on:
  workflow_dispatch:

jobs:
  check-wmf:
    runs-on: windows-latest
    steps:
      - name: OS version info
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsHardwareAbstractionLayer
          [System.Environment]::OSVersion.Version

      - name: Check core Media Foundation DLLs exist
        shell: pwsh
        run: |
          $dlls = @(
            "mf.dll",
            "mfplat.dll",
            "mfreadwrite.dll",
            "mfcore.dll",
            "msmpeg2vdec.dll",
            "wmvdecod.dll",
            "evr.dll"
          )
          $sys32 = "$env:SystemRoot\System32"
          foreach ($dll in $dlls) {
            $path = Join-Path $sys32 $dll
            if (Test-Path $path) {
              $ver = (Get-Item $path).VersionInfo.FileVersion
              Write-Host "FOUND   $dll  (version $ver)"
            } else {
              Write-Host "MISSING $dll"
            }
          }

      - name: Check Media Foundation Windows optional feature / capability
        shell: pwsh
        continue-on-error: true
        run: |
          # On client SKUs this is a Windows Capability; on Server it may be
          # a Windows Feature (Server Media Foundation) or absent entirely.
          Write-Host "--- Get-WindowsCapability (client-style) ---"
          Get-WindowsCapability -Online -Name "*MediaPlayer*" -ErrorAction SilentlyContinue
          Get-WindowsCapability -Online -Name "*Media.Foundation*" -ErrorAction SilentlyContinue

          Write-Host "--- Get-WindowsFeature (server-style) ---"
          Get-WindowsFeature -Name "*Media*" -ErrorAction SilentlyContinue

          Write-Host "--- Get-WindowsOptionalFeature ---"
          Get-WindowsOptionalFeature -Online -FeatureName "*Media*" -ErrorAction SilentlyContinue

      - name: Try instantiating MFStartup via a tiny C# test
        shell: pwsh
        run: |
          $code = @"
          using System;
          using System.Runtime.InteropServices;

          class Program {
              [DllImport("mfplat.dll", ExactSpelling = true, PreserveSig = false)]
              static extern void MFStartup(uint version, uint dwFlags = 0);

              [DllImport("mfplat.dll", ExactSpelling = true, PreserveSig = false)]
              static extern void MFShutdown();

              static void Main() {
                  const uint MF_VERSION = 0x0002; // Win7+ = 0x0002 << 16 | 0x0070, simplified check
                  try {
                      MFStartup(0x00020070, 0);
                      Console.WriteLine("MFStartup SUCCEEDED - Media Foundation is functional");
                      MFShutdown();
                  } catch (Exception e) {
                      Console.WriteLine("MFStartup FAILED: " + e.Message);
                      Environment.Exit(1);
                  }
              }
          }
"@
          Set-Content -Path mftest.cs -Value $code
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo mftest.cs
          ./mftest.exe

      - name: Check for x264/H264 related MF transforms registered
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "--- Registered MF Transform categories (video encoders) ---"
          Get-ChildItem "HKLM:\SOFTWARE\Classes\MediaFoundation\Transforms\CategoryDeny" -ErrorAction SilentlyContinue
          Get-ChildItem "HKLM:\SOFTWARE\Classes\CLSID\{083863F1-70DE-11d0-BD40-00A0C911CE86}\Instance" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ItemProperty $_.PSPath }