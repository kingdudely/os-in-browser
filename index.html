<!DOCTYPE html>
<html>

        <meta charset="utf-8" />
        <title>os-in-browser</title>
        <script>
const { writeFile } = require('node:fs/promises');
const { env, stdout } = require("node:process");
const { Screen } = nw;

stdout.write("app/index.js loaded!");
const offer = decodeURIComponent(env.OFFER);

const peer = new RTCPeerConnection({
	iceServers: [
		{ urls: "stun:stun.l.google.com:19302" }
	]
});

stdout.write("Bfauzzezcheecks")

captureScreen().then(() => {
	createDataChannels();
	createAnswerTXT();
});

async function captureScreen() {
	Screen.Init();
	const { DesktopCaptureMonitor } = Screen;

	const streamId = await new Promise((resolve) => {
		DesktopCaptureMonitor.on("added", function onAdded(id, name, order, type) {
			if (type !== "screen") return;

			const streamId = DesktopCaptureMonitor.registerStream(id);
			DesktopCaptureMonitor.stop();
			DesktopCaptureMonitor.off("added", onAdded);
			resolve(streamId);
		});

		DesktopCaptureMonitor.start(true, false);
	});

	const stream = await navigator.mediaDevices.getUserMedia({
		video: {
		mandatory: {
			chromeMediaSource: 'desktop',
			chromeMediaSourceId: streamId
		}
		}
	})
	
	stream.getTracks().forEach((track) => peer.addTrack(track, stream));

	stdout.write("c")
}

function createDataChannels() {
	const pointerMovementChannel = peer.createDataChannel("pointer-movement", {
		ordered: false,
		maxRetransmits: 0,
		negotiated: true,
		id: 0
	});

	pointerMovementChannel.addEventListener("message", async (event) => {
		const view = new DataView(event.data);
		const isRelative = view.getUint8(0) === 1;

		if (isRelative) {
			const movementX = view.getInt32(1, true);
			const movementY = view.getInt32(5, true);
		} else {
			const absoluteX = view.getUint32(1, true);
			const absoluteY = view.getUint32(5, true);
		}
	});

	const pointerClickChannel = peer.createDataChannel("pointer-click", {
		ordered: true,
		negotiated: true,
		id: 1
	});

	pointerClickChannel.addEventListener("message", async (event) => {
		const view = new DataView(event.data);
		const isDown = view.getUint8(0) === 1;
		const button = view.getUint8(1);

		if (isDown) {
		} else {
		}
	});

	const keyboardTypeChannel = peer.createDataChannel("keyboard-type", {
		ordered: true,
		negotiated: true,
		id: 2
	});

	keyboardTypeChannel.addEventListener("message", async (event) => {
		const view = new DataView(event.data);
		const isDown = view.getUint8(0) === 1;
		const key = view.getUint8(1);

		if (isDown) {
		} else {
		}
	});

	const screenResizeChannel = peer.createDataChannel("screen-resize", {
		ordered: false,
		negotiated: true,
		id: 3
	});

	screenResizeChannel.addEventListener("message", async (event) => {
		const view = new DataView(event.data);
		const innerWidth = view.getUint32(0, true);
		const innerHeight = view.getUint32(4, true);
	});

	const pointerScrollChannel = peer.createDataChannel("pointer-scroll", {
		ordered: false,
		maxRetransmits: 0,
		negotiated: true,
		id: 4
	});

	/*
	const DOM_DELTA_PIXEL = 0x00;
	const DOM_DELTA_LINE = 0x01;
	const DOM_DELTA_PAGE = 0x02;
	*/

	pointerScrollChannel.addEventListener("message", async (event) => {
		const view = new DataView(event.data);
		const deltaMode = view.getUint8(0);
		const deltaX = view.getUint32(1, true);
		const deltaY = view.getUint32(5, true);
		const deltaZ = view.getUint32(9, true);
	});
}

async function createAnswerTXT() {
	stdout.write("A")
	await peer.setRemoteDescription({ type: "offer", sdp: offer });
	stdout.write("A")

	await peer.setLocalDescription();
	stdout.write("A")


	await new Promise((resolve) => {
		if (peer.iceGatheringState === "complete") {
			resolve();
		} else {
			peer.addEventListener("icegatheringstatechange", function onStateChange() {
				if (peer.iceGatheringState === "complete") {
					peer.removeEventListener("icegatheringstatechange", onStateChange);
					resolve();
				}
			});
		}
	});
	stdout.write("A")


	await writeFile('answer.txt', peer.localDescription.sdp);
	stdout.write("A")
}
