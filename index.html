<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>os-in-browser</title>
        <script>
console.log("app/index.js loaded!");
// Import the WebSocket Server from the 'ws' library
const { WebSocketServer } = require('ws');
const { startTunnel } = require("untun");

const port = 8080;
const wss = new WebSocketServer({ port });

wss.on('connection', (ws) => {
  console.log('A new client connected!');

  // Send a welcome message to the connected client
  ws.send('Welcome to the WebSocket server!');

  // Listen for messages from this specific client
  ws.on('message', (message) => {
    // Convert Buffer data to a readable string
    console.log(`Received message: ${message}`);
    
    // Echo the message back to the client
    ws.send(`Server received: ${message}`);
  });

  // Handle client disconnection
  ws.on('close', () => {
    console.log('Client has disconnected.');
  });
});

const tunnel = await startTunnel({ port, acceptCloudflareNotice: true });
const tunnelUrl = await tunnel.getURL();

const stream = await navigator.mediaDevices.getDisplayMedia()
		</script>
    </head>

</html>
