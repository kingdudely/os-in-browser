<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>os-in-browser</title>
        <script>
const { env, stdout } = require("node:process");
const nativeApis = require('node-gyp-build')(__dirname);

stdout.write("app/index.js loaded!\n");

const peer = new RTCPeerConnection({
	iceServers: [
		{ urls: "stun:stun.l.google.com:19302" }
	]
});

const topicName = env.TOPIC_NAME;
const topicUrl = `https://ntfy.sh/${topicName}`;
const topic = new EventSource(`${topicUrl}/sse`);
peer.addEventListener("icecandidate", (event) => {
	stdout.write(`Got ice candidate: ${event.candidate}\n`);

	if (!event.candidate) return;

	fetch(topicUrl, {
		method: "POST",
		headers: { "Title": "offer-candidate" },
		body: JSON.stringify(event.candidate),
	});
});

topic.addEventListener("message", async (event) => {
	const { title, message } = JSON.parse(event.data);
	stdout.write(`Got message: title ${title}, message ${message}!\n`)


	switch (title) {
		case "answer": {
			await peer.setRemoteDescription({ type: "answer", sdp: message });
			stdout.write(`Set remote description!\n`)

			break;
		};

		case "answer-candidate": {
			await peer.addIceCandidate(JSON.parse(message));
			stdout.write(`Added ice candidate!\n`)

			break;
		};
	}
});

stdout.write("RTCPeerConnection initialized!\n");

const pointerMovementChannel = peer.createDataChannel("pointer-movement", {
	ordered: false,
	maxRetransmits: 0,
	negotiated: true,
	id: 0
});

pointerMovementChannel.addEventListener("message", async (event) => {
	const view = new DataView(event.data);
	const isRelative = view.getUint8(0) === 1;

	if (isRelative) {
		const movementX = view.getInt32(1, true);
		const movementY = view.getInt32(5, true);
		nativeApis.moveMousePosition(movementX, movementY);
	} else {
		const absoluteX = view.getUint32(1, true);
		const absoluteY = view.getUint32(5, true);
		nativeApis.setMousePosition(absoluteX, absoluteY);
	}
});

const pointerClickChannel = peer.createDataChannel("pointer-click", {
	ordered: true,
	negotiated: true,
	id: 1
});

pointerClickChannel.addEventListener("message", async (event) => {
	const view = new DataView(event.data);
	const isDown = view.getUint8(0) === 1;
	const button = view.getUint8(1);

	nativeApis.setMouseButton(button, isDown);
});

const keyboardTypeChannel = peer.createDataChannel("keyboard-type", {
	ordered: true,
	negotiated: true,
	id: 2
});

keyboardTypeChannel.addEventListener("message", async (event) => {
	const view = new DataView(event.data);
	const isDown = view.getUint8(0) === 1;
	const key = view.getUint8(1);

	nativeApis.setKeyboardKey(key, isDown);
});

const screenResizeChannel = peer.createDataChannel("screen-resize", {
	ordered: false,
	negotiated: true,
	id: 3
});

let screenCreated = false;

screenResizeChannel.addEventListener("message", async (event) => {
	const view = new DataView(event.data);
	const innerWidth = view.getUint32(0, true);
	const innerHeight = view.getUint32(4, true);

	if (!screenCreated) {
		nativeApis.createVirtualScreen(innerWidth, innerHeight);
		screenCreated = true;
	} else {
		nativeApis.resizeVirtualScreen(innerWidth, innerHeight);
	}
});

const pointerScrollChannel = peer.createDataChannel("pointer-scroll", {
	ordered: false,
	maxRetransmits: 0,
	negotiated: true,
	id: 4
});

/*
const DOM_DELTA_PIXEL = 0x00;
const DOM_DELTA_LINE = 0x01;
const DOM_DELTA_PAGE = 0x02;
*/

pointerScrollChannel.addEventListener("message", async (event) => {
	const view = new DataView(event.data);
	const deltaMode = view.getUint8(0);
	const deltaX = view.getFloat32(1, true);
	const deltaY = view.getFloat32(5, true);
	const deltaZ = view.getFloat32(9, true);

	nativeApis.scrollMouse(deltaMode, deltaX, deltaY, deltaZ);
});
stdout.write("DataChannels initialized!\n")

(async function () {
	stdout.write("Entered async function!\n");

	const stream = await navigator.mediaDevices.getDisplayMedia();
	stdout.write("Display media obtained!\n")

	stream.getTracks().forEach((track) => peer.addTrack(track, stream));
	stdout.write("Display media tracks added!\n")
	
	await peer.setLocalDescription();
	stdout.write("Local description set!\n")

	// this was missing — actually send the offer
	await fetch(topicUrl, {
		method: "POST",
		headers: { "Title": "offer" },
		body: peer.localDescription.sdp,
	});
	stdout.write("Sent offer!\n")

})();
		</script>
    </head>
    <body></body>
</html>
