<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>GitHub Login</title>
	</head>
	<body>
		<button id="login">Create a new secret credential file</button>

		<br />

		<form id="tokenForm">
			<label for="tokenInput">Upload a credential file:</label>
			<input type="file" id="tokenInput" name="token" />
		</form>

		<form id="download-credential-file" method="POST" action="https://github.com/login/oauth/access_token" target="_blank" hidden>
			<input type="hidden" name="client_id" value="Ov23lipwX2GRkJRc0FdF">
			<input type="hidden" name="client_secret" value="e1acb40a1999c11881db8be8a8ae26f2def89602">
			<input type="hidden" name="redirect_uri" value="https://kingdudely.github.io/os-in-browser/">
			<input type="hidden" name="code" id="code">
			<input type="hidden" name="code_verifier" id="code_verifier">
		</form>

		<script defer>
			const VERIFIER_KEY = "pkce_code_verifier";
			const to_base64url = (...args) => new Uint8Array(...args).toBase64({ alphabet: "base64url", omitPadding: true });

			document.getElementById("login").addEventListener("click", async () => {
				const verifier = to_base64url(crypto.getRandomValues(new Uint8Array(32)));
				const challenge = to_base64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));

				sessionStorage.setItem(VERIFIER_KEY, verifier);
				location.href = `https://github.com/login/oauth/authorize?${new URLSearchParams({
					client_id: "Ov23lipwX2GRkJRc0FdF",
					redirect_uri: "https://kingdudely.github.io/os-in-browser/",
					code_challenge: challenge,
					code_challenge_method: "S256"
				})}`;
			});

			document.getElementById("tokenInput").addEventListener("change", async e => {
				const file = e.target.files[0];
				if (!file) return;

				const params = new URLSearchParams(await file.text());
				if (!params.has("access_token")) return alert("Invalid credential file");

				alert(params.get("access_token"));
			});

			const url = new URL(location.href);
			const code = url.searchParams.get("code");
			if (code) {
				const verifier = sessionStorage.getItem(VERIFIER_KEY);
				if (!verifier) {
					alert("Missing code_verifier — the login flow was not started from this browser/tab.");
				} else {
					document.getElementById("code").value = code;
					document.getElementById("code_verifier").value = verifier;
					sessionStorage.removeItem(VERIFIER_KEY);
					document.getElementById("download-credential-file").requestSubmit();
				}
			}

			url.search = "";
			history.replaceState({}, document.title, url);
		</script>
	</body>
</html>
